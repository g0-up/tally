# Postgres settings of the production database, mounted by infra/docker-compose.backup.yml as
# /etc/postgresql/postgresql.conf and selected with `-c config_file=`. A file given this way
# replaces the postgresql.conf initdb wrote into the data volume, so the first block repeats the
# values initdb generates for postgres:16-alpine; change them here, not in the volume.

# --- initdb defaults of the image (unchanged behaviour) ---
listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# --- continuous archiving (RPO <= 15 min) ---
wal_level = replica
archive_mode = on
# Close a WAL segment at least every 5 minutes, so a quiet database still ships its last commits.
# With the sidecar pushing the spool every 30 s the worst-case loss stays well under 15 minutes.
archive_timeout = 300s
# Hand each finished segment to the wal-g sidecar through the shared spool volume. A segment is
# copied under a temporary name, flushed and renamed, so the sidecar never uploads a partial file;
# a segment already in the spool succeeds only if it is byte-identical (postgres may retry an
# archive after a crash), otherwise the command fails and postgres keeps the segment and retries.
archive_command = 'f=/var/lib/postgresql/wal-spool/%f; if [ -f "$f" ]; then cmp -s "%p" "$f"; else cp "%p" "$f.part" && fsync "$f.part" && mv "$f.part" "$f" && fsync /var/lib/postgresql/wal-spool; fi'
