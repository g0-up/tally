name: Release

# A version tag publishes the api, web and wal-g sidecar images to GHCR. Each image is scanned by
# trivy before it is pushed (a fixable HIGH or CRITICAL finding stops the release) and signed with
# cosign keyless (GitHub OIDC) after; `cosign verify` at the end proves the signature.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.0

jobs:
  image:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: apps/api
          - image: web
            context: apps/web
          - image: walg
            context: infra/backup
    steps:
      - uses: actions/checkout@v5
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tally-${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build for the scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Trivy scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro "$TRIVY_IMAGE" image --quiet \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:scan"
      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
