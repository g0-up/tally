# One SPA bundle for every host (apex, admin.<domain>, <slug>.<domain>); the app picks its route tree
# from the host. Traefik routes /api/* straight to the api container and adds the security headers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker must be revalidated on every load so a new deploy takes over promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API traffic never reaches nginx in production; answer 404 instead of the SPA shell if it does.
    location /api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: index.html is never cached so a new deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
