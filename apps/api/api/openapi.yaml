  /pos/carts/{id}:checkout:
    post:
      tags: [sales]
      operationId: checkoutPosCart
      summary: Sell an open cart like a checkout
      description: |
        The cart becomes `sold` and points at its sales document.
      parameters:
        - $ref: '#/components/parameters/ID'
