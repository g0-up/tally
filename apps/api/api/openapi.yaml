          description: The sale, its shift and payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosSale'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            cart_sold, insufficient_stock, exception_required (below the minimum price or over the credit
            limit; the owner confirms the exception and the request is retried with its
            exception_confirmation_ids), sale_changed (a combo recipe or a promotion changed the goods of
            the sale while it posted; send it again), shift_changed (the day's shift kept changing while the
            sale posted; nothing was kept, send it again under the same key), loyalty_disabled,
            insufficient_points or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          description: |
            validation_failed (including loyalty_points), idempotency_key_required, walk_in_must_pay_in_full or
            payment_mismatch.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /pos/offline-session:
    post:
      tags: [sales]
      operationId: grantPosOfflineSession
      summary: Allow this login session to sell offline for a while
      description: |
        Sets how long the device may queue sales while offline: the store's offline hours from now,
        never past the end of the session.
      responses:
        '200':
          description: The end of the offline window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSession'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: offline_pos_disabled.
          $ref: '#/components/responses/Error'
        '422':
          description: offline_pos_disabled (no login session).
          $ref: '#/components/responses/Error'
  /pos/offline-sync:
    post:
      tags: [sales]
      operationId: syncPosOffline
      summary: Upload the sales a device made offline
      description: |
        Posts each sale once, keyed by its `offline_client_id`, so a batch sent twice posts nothing new
        (`replayed`). A sale the server cannot post as made offline, such as one paid by credit or
        transfer, over the offline amount or past the offline window, is parked as a sync exception for
        a manager to resolve. A sale whose `offline_client_id` is still posting from another upload, or
        was sent before with other contents, fails without being parked, as does one whose goods or
        shift changed while it posted (`sale_changed`, `shift_changed`; the next upload posts it). A
        parked sale never posts from a later upload. The request carries no Idempotency-Key; each item reports its own outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineSyncRequest'
      responses:
        '200':
          description: One outcome per sale, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only; a read-only subscription refuses the whole batch and parks nothing.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /pos/sync-exceptions:
    get:
      tags: [sales]
      operationId: listPosSyncExceptions
      summary: Offline sales waiting for a manager, newest first
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [open, resolved, discarded]}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sync exceptions with the sale as sent.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PosSyncException'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
  /pos/sync-exceptions/{id}:resolve:
    post:
      tags: [sales]
      operationId: resolvePosSyncException
      summary: Post a parked offline sale, as sent or corrected
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosResolveRequest'
      responses:
        '201':
          description: The sale, its shift and payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosSale'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            sync_exception_closed, offline_sale_already_posted (the offline sale posted under its client id;
            discard the exception instead), insufficient_stock, exception_required (below the minimum price
            or over the credit limit; the owner confirms the exception and the request is retried with its
            exception_confirmation_ids), sale_changed (a combo recipe or a promotion changed the goods of the
            sale while it posted; send it again), shift_changed (the day's shift kept changing while the sale
            posted; nothing was kept, send it again under the same key), loyalty_disabled,
            insufficient_points or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /pos/sync-exceptions/{id}:discard:
    post:
      tags: [sales]
      operationId: discardPosSyncException
      summary: Discard a parked offline sale
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The discarded exception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosSyncException'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: sync_exception_closed.
          $ref: '#/components/responses/Error'
  /sales-returns:
    get:
      tags: [sales]
      operationId: listSalesReturns
      summary: Sales returns (TH), newest first
      parameters:
        - {name: sales_document_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: customer_id, in: query, required: false, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Returns without their lines.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SalesReturn'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [sales]
      operationId: postSalesReturn
      summary: Take goods back from a customer
      description: |
        Against a sales document each line returns at most what is left of what was sold, into the lot
        it was sold from at the cost it left at; without one the price is given and the cost is today's
        average. Goods go back sellable or into quarantine. The returned value first reduces what the
        customer owes; the rest is refunded at once with `refund_payment_method_id` (required for a
        walk-in customer) or stays due to the customer.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesReturnRequest'
      responses:
        '201':
          description: The return and its refund.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReturnPosted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: return_exceeds_sold, document_reversed, return_changed or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, idempotency_key_required, refund_required or payment_method_inactive.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /exchanges:
    get:
      tags: [sales]
      operationId: listExchanges
      summary: Exchanges (DH), newest first
      parameters:
        - {name: original_sales_document_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: customer_id, in: query, required: false, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Exchanges.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Exchange'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [sales]
      operationId: postExchange
      summary: Exchange goods with a return (TH) and a new sale (BH) in one document (DH)
      description: |
        Returns lines of the original sale and sells new ones; the difference is settled against the
        customer's debt first, then paid by the customer or refunded by the store. When the client sends
        the expected amounts from its preview and they no longer match, the exchange is refused with
        exchange_changed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '201':
          description: The exchange, its return, its new sale and the payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangePosted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            return_exceeds_sold, document_reversed, exchange_changed, insufficient_stock, exception_required
            (below the minimum price or over the credit limit; the owner confirms the exception and the
            request is retried with its exception_confirmation_ids), sale_changed (a combo recipe or a
            promotion changed the goods of the new sale while it posted; send it again) or an idempotency
            conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, idempotency_key_required, walk_in_must_pay_in_full or payment_method_inactive.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /exchanges/{id}:
    get:
      tags: [sales]
      operationId: getExchange
      summary: One exchange
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Exchange.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /exchanges:preview:
    post:
      tags: [sales]
      operationId: previewExchange
      summary: Price an exchange without posting it
      description: |
        Returns the split of the difference and the message for the customer, e.g. "Khách trả thêm 150
        000".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangePreviewRequest'
      responses:
        '200':
          description: The priced exchange.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangePreview'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only (a support session only reads). A read-only subscription may still preview.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: return_exceeds_sold or document_reversed.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /print/{docType}/{id}:
    get:
      tags: [sales]
      operationId: printSalesDocument
      summary: Print data of a document
      description: |
        The document's lines grouped by mix pack, its totals, payment state and related documents, ready
        for an A4 or receipt layout, with the store header and the internal-record label. Besides the
        sales documents it prints purchase orders (PO), receipts (PN), purchase returns (XT), stock
        counts (KK), stock adjustments (DC), debt statements (DS) and kit labels. Purchase documents
        keep their tax per document: their lines carry the tax rate with a zero `tax_amount`, and
        `totals.tax_amount` is the document's tax. A count line's `qty` is the variance between
        `system_qty` and `counted_qty`.
      parameters:
        - name: docType
          in: path
          required: true
          schema:
            type: string
            enum: [quote, invoice, stock_out, sales_document, sales_return, exchange, purchase_order, goods_receipt, purchase_return, stock_count,
          stock_adjustment, statement, kit_label]
        - $ref: '#/components/parameters/ID'
        - name: version
          in: query
          required: false
          description: |
            A sent version of an invoice or statement, printed from its frozen snapshot. Without it an
            invoice prints as it stands and a statement prints its sent version (else its current one).
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Print data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesPrintDoc'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (an unknown document type, or a version on a type without versions).
          $ref: '#/components/responses/Error'
  /kits:
    get:
      tags: [kits]
      operationId: listKits
      summary: Kits and combos with their latest recipe version, by name
      parameters:
        - {name: type, in: query, required: false, schema: {type: string, enum: [kit, combo]}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/ProductStatus'}}
        - {name: q, in: query, required: false, schema: {type: string}, description: Name or SKU code.}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Kits and combos.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/KitListItem'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [kits]
      operationId: createKit
      summary: Save a draft kit or combo with its first recipe version
      description: |
        Creates the kit's product and SKU as a draft and its recipe as draft version 1. A draft is
        neither sellable nor assemblable and stays out of the picker search and the POS until it is
        published. Its retail price applies at once (the preview prices the kit with it), but its price
        history starts when the kit is published.
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitRequest'
      responses:
        '201':
          description: Kit; `ETag` carries the version of its latest recipe.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kit'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: A SKU code or barcode already in use, idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or idempotency_key_invalid.
          $ref: '#/components/responses/Error'
  /kits/progress:
    get:
      tags: [kits]
      operationId: kitProgress
      summary: Assembly progress of each kit with open assembly orders
      description: Planned, completed and disassembled quantities of the open orders, stock on hand and invoice demand.
      responses:
        '200':
          description: Progress by kit.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/KitProgress'}}
        '401':
          $ref: '#/components/responses/Error'
  /kits/{id}:
    get:
      tags: [kits]
      operationId: getKit
      summary: One kit or combo with its latest recipe version
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Kit; `ETag` carries the version of its latest recipe.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kit'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [kits]
      operationId: updateKit
      summary: Rename a kit or edit its draft recipe version
      description: The recipe replaces the latest version's validity, packing cost and items; it must still be a draft.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitPatch'
      responses:
        '200':
          description: Updated kit; `ETag` carries the version of its latest recipe.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kit'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: recipe_not_draft.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
    delete:
      tags: [kits]
      operationId: deleteKit
      summary: Delete a draft kit that was never sold
      description: |
        The draft's retail price goes with it: a draft price has no history until the kit is published. A
        kit whose SKU has price history (its price was edited on a product screen) is archived (made
        inactive) instead, since the history is append-only.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Deleted, or archived when `archived` is true.
          content:
            application/json:
              schema:
                type: object
                required: [archived]
                properties:
                  archived: {type: boolean}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: kit_published or kit_sold.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /kits/{id}/preview:
    get:
      tags: [kits]
      operationId: previewKit
      summary: Economics of a kit's latest recipe version
      description: |
        Per component the sale price, the amount at sale price, the cost and the sellable stock; the
        kit's total cost, its price and margin, and how many kits the free stock can build.
      parameters:
