      responses:
        '200':
          description: Orders with `days_late` and their progress.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PurchaseOrder'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
  /receipts:
    get:
      tags: [procurement]
      operationId: listReceipts
      summary: Receipts (PN), newest first
      parameters:
        - {name: q, in: query, required: false, description: 'Words matched in the number and the supplier, accent-insensitive.', schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [posted, reversed]}}
        - {name: supplier_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: purchase_order_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Receipts without their lines.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ReceiptListItem'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [procurement]
      operationId: postReceipt
      summary: Post a receipt, against a purchase order or not
      description: |
        Receives every `accepted` and `excess` line into its lot (the color of the line), every
        `damaged` line into the quarantine twin of its lot, and records `wrong_item` lines for
        the supplier claim without stock. The unit cost of a line is its amount (tax included)
        per base unit and updates the average cost. Against an order, each line may receive at
        most what is pending unless its condition is `excess`; the order moves to
        partially_received or completed. The payable (CN) is the receipt total, due on
        `due_date` (default the supplier's payment terms) or split by `schedule`;
        `paid_now_amount` posts a payment (PC) settling it at once and `use_advances` applies
        earlier supplier advances.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
      responses:
        '201':
          description: Receipt with its lines, payable and payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            order_not_receivable, receipt_exceeds_order, purchase_order_changed (the order's
            lines changed while the receipt was being posted; reload the order and retry) or an
            idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, idempotency_key_required, color_required or lot_mismatch.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /receipts/{id}:
    get:
      tags: [procurement]
      operationId: getReceipt
      summary: One receipt with its lines, payable, payments, landed costs and attachments
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /receipts/{id}:reverse:
    post:
      tags: [procurement]
      operationId: reverseReceipt
      summary: Reverse a receipt (re-authentication required)
      description: |
        Posts a mirror receipt whose stock moves cancel the original ones and reverses its
        payable. Allowed only while the received stock is still on hand and no landed cost,
        purchase return, price adjustment or supplier document follows the receipt; correct
        later mistakes with a purchase return or a price adjustment instead.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '201':
          description: The reversal receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
