  /sales-documents/{id}:reverse:
    post:
      tags: [sales]
      operationId: reverseSalesDocument
      summary: Reverse a POS sale of a named customer (re-authentication required)
      description: |
        Puts the goods back at the cost they left at and reverses the receivable; what was paid becomes
        the customer's advance. A walk-in sale is undone with a return instead, and a sale something was
        returned from cannot be reversed.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        '201':
          description: The reversal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDocumentReversal'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            invalid_status_transition, document_reversed, document_has_returns, walk_in_reverse_needs_refund
            or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /pos/bootstrap:
    get:
      tags: [sales]
      operationId: posBootstrap
      summary: Everything the POS needs to start selling
      description: |
        The POS settings, the active payment methods, the open shift, and a tile per sellable SKU with
        its retail price and stock by color.
      responses:
        '200':
          description: POS start-up data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosBootstrap'
        '401':
          $ref: '#/components/responses/Error'
  /pos/checkout:
    post:
      tags: [sales]
      operationId: posCheckout
      summary: Sell at the counter and post the sales document (BH)
      description: |
        Opens the day's shift (CA) in the same posting when it is the first sale of the day, so a
        refused sale opens none; issues every line from stock (a colored SKU with one color in stock
        takes that color), including combo components and gifts; posts the payments (PT) and gives
        change for cash tendered above the cash part. A walk-in customer pays in full; a named customer
        may leave the rest as a receivable within the credit limit. Concurrent sales of the same SKU
        never take stock held by reservations or below zero.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosCheckoutRequest'
      responses:
        '201':
          description: The sale, its shift and payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosSale'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            insufficient_stock, exception_required (below the minimum price or over the credit limit; the
            owner confirms the exception and the request is retried with its exception_confirmation_ids),
            sale_changed (a combo recipe or a promotion changed the goods of the sale while it posted; send
            it again), shift_changed (the day's shift kept changing while the sale posted; nothing was kept,
            send it again under the same key), loyalty_disabled or insufficient_points (loyalty_points
            spent while the program is off or above the customer's balance) or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: |
            validation_failed (loyalty_points: must_be_positive_whole, customer_required, or
            exceeds_amount when the discount they are worth exceeds the sale), idempotency_key_required,
            color_required, walk_in_must_pay_in_full, payment_mismatch or payment_method_inactive.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /pos/carts:
    get:
      tags: [sales]
      operationId: listPosCarts
      summary: Parked POS carts, newest first
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [open, sold]}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Carts without their lines.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PosCart'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [sales]
      operationId: createPosCart
      summary: Park a cart to finish later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosCartRequest'
      responses:
        '201':
          description: Cart; `ETag` carries the version.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosCart'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /pos/carts/{id}:
    get:
      tags: [sales]
      operationId: getPosCart
      summary: One cart with its priced lines
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Cart; `ETag` carries the version.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosCart'
        '401':
          $ref: '#/components/responses/Error'
        '404':
