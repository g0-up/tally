        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/AttributeSetItemRequest'}}
      responses:
        '200':
          description: Set and the codes of attributes whose stored values are now hidden.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AttributeSet'
                  - type: object
                    required: [hidden_attributes]
                    properties:
                      hidden_attributes: {type: array, items: {type: string}}
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Category tree, flat (rebuild it from parent_id)
      responses:
        '200':
          description: Categories by sort order and name.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Category'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [catalog]
      operationId: createCategory
      summary: Add a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: name_taken (among siblings).
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or category_too_deep.
          $ref: '#/components/responses/Error'
  /categories/{id}:
    patch:
      tags: [catalog]
      operationId: updateCategory
      summary: Rename, move or (de)activate a category
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: name_taken.
          $ref: '#/components/responses/Error'
        '422':
