      operationId: deleteSku
      summary: Delete a SKU never used
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
