    get:
      tags: [sales]
      operationId: salesDocumentReturnableLines
      summary: What of a sales document can still be returned
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Lines with stock left to return.
          content:
