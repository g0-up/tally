        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignChecklistPatch'
      responses:
        '200':
          description: Checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignChecklist'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: campaign_closed.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /campaigns/{id}/demand:
    get:
      tags: [campaign]
      operationId: getCampaignDemand
      summary: Day-by-day demand, incoming stock and shortage of the campaign's SKUs
      description: |
        Projects sellable stock day by day over the range (the campaign's dates by default):
        confirmed undelivered invoice lines and other active reservations are demand, confirmed
        purchase orders still pending are incoming by their expected date. Rows are SKUs by code;
        `days` lists only the days with demand or expected receipts.
      parameters:
        - $ref: '#/components/parameters/ID'
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of demand rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDemand'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, range_too_long or invalid_cursor.
          $ref: '#/components/responses/Error'
  /campaigns/{id}:activate:
    post:
      tags: [campaign]
      operationId: activateCampaign
      summary: Start a planned campaign
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Campaign; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
