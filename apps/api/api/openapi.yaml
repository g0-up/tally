        - {name: status, in: query, required: false, schema: {type: string, enum: [draft, confirmed, partially_delivered, completed, cancelled_remaining]}}
        - {name: customer_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Invoices without their lines.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Invoice'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [sales]
      operationId: createInvoice
      summary: Create a draft invoice
      description: |
        Prices the lines like a quote. The payer defaults to the customer and the due date to the
        customer's payment terms. A draft holds no stock and no receivable.
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: Invoice; `ETag` carries the version.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid, validation_failed, sku_inactive, sku_not_sellable, combo_not_sellable or a mix pack code.
          $ref: '#/components/responses/Error'
  /invoices/{id}:
