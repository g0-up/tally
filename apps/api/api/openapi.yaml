          description: Adjustment with its lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePriceAdjustment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: receipt_not_posted or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
