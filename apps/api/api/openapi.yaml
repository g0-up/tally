            posted; send it again) or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
