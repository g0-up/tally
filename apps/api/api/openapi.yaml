        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: invoice_not_editable or nothing_changed.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
    delete:
      tags: [sales]
      operationId: deleteInvoice
      summary: Delete a draft invoice
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted.
        '401':
