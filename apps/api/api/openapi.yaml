          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: campaign_status_invalid.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /campaigns/{id}:close:
    post:
      tags: [campaign]
      operationId: closeCampaign
      summary: Close a campaign and report its checklist
      description: Closing never waits for the checklist; the answer lists the items still open.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Closed campaign and its checklist summary; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignClose'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: campaign_status_invalid.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /campaign-attributions:
    post:
      tags: [campaign]
      operationId: reattributeToCampaign
      summary: Move a document or line to a campaign
      description: |
        Role `primary` replaces the current primary campaign of the document's lines (a sales
        document without `doc_line_id` moves all its lines), so revenue is never counted under two
        campaigns. Role `tag` adds a filter tag that no revenue figure sums.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, doc_type, doc_id, role]
              properties:
                campaign_id: {type: string, format: uuid}
                doc_type: {$ref: '#/components/schemas/CampaignDocType'}
                doc_id: {type: string, format: uuid}
                doc_line_id: {type: [string, 'null'], format: uuid}
                role: {$ref: '#/components/schemas/CampaignAttributionRole'}
      responses:
        '200':
          description: The document's attributions after the move, with warnings (for example a line outside the campaign's dates).
          content:
            application/json:
              schema:
                type: object
                required: [attributions, warnings]
                properties:
                  attributions: {type: array, items: {$ref: '#/components/schemas/CampaignAttribution'}}
                  warnings: {type: array, items: {type: string}}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: campaign_closed.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /customers/last-season:
    get:
      tags: [crm]
      operationId: listLastSeasonCustomers
      summary: Customers who bought in a closed campaign, by name
      description: The campaign defaults to the latest closed one; walk-in sales are not listed.
      parameters:
        - {name: campaign_id, in: query, required: false, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of customers.
          content:
            application/json:
              schema:
                type: object
                required: [campaign_id, data, next_cursor]
                properties:
                  campaign_id: {type: string, format: uuid}
                  data: {type: array, items: {$ref: '#/components/schemas/LastSeasonCustomer'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, no_closed_campaign or invalid_cursor.
          $ref: '#/components/responses/Error'
  /customers/{id}/timeline:
    get:
      tags: [crm]
      operationId: getCustomerTimeline
      summary: A customer's purchases, returns, payments, notes and care calls, newest first
      parameters:
        - $ref: '#/components/parameters/ID'
        - {name: kind, in: query, required: false, schema: {$ref: '#/components/schemas/CustomerActivityKind'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of activities.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/CustomerActivity'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
  /customers/{id}/activities:
    post:
      tags: [crm]
      operationId: addCustomerActivity
      summary: Write a note or care call on a customer's timeline
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, summary]
              properties:
                kind: {type: string, enum: [note, care_call]}
                summary: {type: string, maxLength: 2000}
      responses:
        '201':
          description: Activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerActivity'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /customers/{id}/consents:
    get:
      tags: [crm]
      operationId: getCustomerConsents
      summary: A customer's contact consents, current and history
      description: Without a recorded consent a channel and purpose stay closed; reminders and campaigns skip the customer.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Current consent per channel and purpose, and every recorded change, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [current, history]
                properties:
                  current: {type: array, items: {$ref: '#/components/schemas/Consent'}}
                  history: {type: array, items: {$ref: '#/components/schemas/Consent'}}
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags: [crm]
      operationId: recordCustomerConsent
      summary: Record a consent grant or withdrawal
      description: |
        Consents are append-only; the latest record per channel and purpose is the current one.
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, purpose, granted, source]
              properties:
                channel: {$ref: '#/components/schemas/ConsentChannel'}
                purpose: {$ref: '#/components/schemas/ConsentPurpose'}
                granted: {type: boolean}
                source: {type: string, maxLength: 200, description: 'Where the consent was given (at the counter, by phone, a form).'}
                evidence: {type: [string, 'null'], maxLength: 2000}
      responses:
        '201':
          description: Consent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid or validation_failed.
          $ref: '#/components/responses/Error'
  /customers/{id}/reorder-drafts:
    post:
      tags: [crm]
      operationId: createCustomerReorderDraft
      summary: Draft an invoice repeating a customer's purchase
      description: |
        Copies the lines of the given sales document (the customer's latest by default) into a new
        draft invoice at today's prices. Lines that can no longer be sold are listed with a flag
        and not copied.
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sales_document_id: {type: [string, 'null'], format: uuid}
      responses:
        '201':
          description: The draft invoice and the lines it took.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderDraft'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: no_purchase, nothing_to_reorder, reorder_unavailable, idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid or validation_failed.
          $ref: '#/components/responses/Error'
  /customers/{id}/loyalty:
    get:
      tags: [crm]
      operationId: getCustomerLoyalty
      summary: A customer's point balance and point entries, newest first
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Balance and entries.
          content:
            application/json:
              schema:
                type: object
                required: [party_id, balance, entries]
                properties:
                  party_id: {type: string, format: uuid}
                  balance: {$ref: '#/components/schemas/Qty'}
                  entries: {type: array, items: {$ref: '#/components/schemas/LoyaltyEntry'}}
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /care-tasks:
    get:
      tags: [crm]
      operationId: listCareTasks
      summary: Customer care tasks, earliest due first
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/CareTaskStatus'}}
        - {name: party_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: due_before, in: query, required: false, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of care tasks.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/CareTask'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [crm]
      operationId: createCareTask
      summary: Plan a care call for a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party_id, due_on, title]
              properties:
                party_id: {type: string, format: uuid}
                due_on: {type: string, format: date}
                title: {type: string, maxLength: 300}
                source_campaign_id: {type: [string, 'null'], format: uuid}
      responses:
        '201':
          description: Care task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareTask'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /care-tasks/{id}:
    patch:
      tags: [crm]
      operationId: updateCareTask
      summary: Reschedule, rename, finish or skip a care task
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                due_on: {type: string, format: date}
                title: {type: string, maxLength: 300}
                status: {$ref: '#/components/schemas/CareTaskStatus'}
      responses:
        '200':
          description: Care task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareTask'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /loyalty/program:
    get:
      tags: [crm]
      operationId: getLoyaltyProgram
      summary: The store's loyalty program
      description: A store that never set one answers the disabled defaults with version 0 (`ETag` "0").
      responses:
        '200':
          description: Program; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProgram'
        '401':
          $ref: '#/components/responses/Error'
    put:
      tags: [crm]
      operationId: putLoyaltyProgram
      summary: Turn the loyalty program on or off and set its rates
      description: |
        Every save requires the version from the `ETag`, "0" for the first save; a missing header is 428
        and a stale version 412. A change applies to sales posted afterwards; points already earned stay.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Program version as returned in the `ETag` header ("0" while the program was never saved).
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, points_per_amount, point_value]
              properties:
                enabled: {type: boolean}
                points_per_amount: {$ref: '#/components/schemas/Money', description: Points earned per đồng of net revenue.}
                point_value: {$ref: '#/components/schemas/Money', description: The đồng a point is worth when redeemed as a discount.}
      responses:
        '200':
          description: Program; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProgram'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /loyalty/adjustments:
    post:
      tags: [crm]
      operationId: adjustLoyaltyPoints
      summary: Add or take away points by hand with a reason
      description: |
        Records the adjustment once per Idempotency-Key: a retry of the same request answers the
        stored entry with `Idempotent-Replay: true` and adds no points.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party_id, points, reason]
              properties:
                party_id: {type: string, format: uuid}
                points: {$ref: '#/components/schemas/Qty', description: 'Signed whole points, not zero; a negative adjustment cannot take the balance below zero.'}
                reason: {type: string, maxLength: 500}
      responses:
        '201':
          description: Point entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyEntry'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: insufficient_points, idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, idempotency_key_required or idempotency_key_invalid.
          $ref: '#/components/responses/Error'
  /notifications:
