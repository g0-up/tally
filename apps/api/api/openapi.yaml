    post:
      tags: [procurement]
      operationId: matchSupplierDocumentReceipts
      summary: Match more receipts to a supplier document
      description: |
        Adds the receipts to the ones already matched and recomputes the match. A receipt
        already matched to another document is refused (409 receipt_already_matched).
