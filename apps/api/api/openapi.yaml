        sales_document: {$ref: '#/components/schemas/SalesDocumentDetail'}
        shift: {$ref: '#/components/schemas/Shift'}
        payments: {type: array, items: {$ref: '#/components/schemas/SalesPayment'}}
        loyalty_redemption:
          type: object
          description: Present when the sale spent loyalty points.
          required: [points, amount]
          properties:
            points: {$ref: '#/components/schemas/Qty'}
            amount: {$ref: '#/components/schemas/Money', description: The order discount the points gave.}
    PosCart:
