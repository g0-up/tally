      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,39}$'}
                base_unit_id: {type: string, format: uuid}
                qty_scale: {type: integer, minimum: 0, maximum: 4}
                track_lot: {type: boolean}
                track_expiry: {type: boolean}
                ref_cost: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
                min_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
                min_stock: {$ref: '#/components/schemas/Qty'}
                tax_rate_id: {type: [string, 'null'], format: uuid}
                spec_text: {type: [string, 'null']}
                status: {type: string, enum: [active, inactive]}
      responses:
        '200':
          description: SKU.
          content:
