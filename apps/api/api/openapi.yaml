      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceListItemsRequest'
      responses:
        '200':
          description: The rows that remain after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PriceListItem'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: read_only.
          $ref: '#/components/responses/Error'
        '404':
