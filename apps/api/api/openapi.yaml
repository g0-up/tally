        - {name: status, in: query, required: false, schema: {type: string, enum: [posted, reversed, partially_reversed]}}
        - {name: customer_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: invoice_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: shift_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sales documents without their lines.
          content:
