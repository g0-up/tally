  /stock-outs/{id}:reverse:
    post:
      tags: [sales]
      operationId: reverseStockOut
      summary: Reverse a stock out (re-authentication required)
      description: |
        Puts the goods back at the cost they left at, reverses the sales document and its receivable
        (what was paid becomes the payer's advance), and the invoice lines hold the goods again (or
        count them cancelled when the invoice stopped delivering). Not allowed once anything was
        returned from the sale or credit notes settled its receivable.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        '201':
          description: The reversal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockOutReversal'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: stock_out_reversed, document_has_returns, obligation_has_credits or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
