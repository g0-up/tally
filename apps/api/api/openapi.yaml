        reason_id: {type: [string, 'null'], format: uuid}
        color_id: {type: [string, 'null'], format: uuid}
        color_code: {type: [string, 'null']}
        color_name: {type: [string, 'null']}
        color_hex: {type: [string, 'null']}
    StockCount:
      type: object
      required: [id, doc_no, scope, category_id, blind, status, business_date, started_at, counted_at, note, posted_at, posted_by,
        created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
        scope: {type: string, enum: [all, category, selection]}
        category_id: {type: [string, 'null'], format: uuid}
        blind: {type: boolean}
        status: {type: string, enum: [counting, pending_post, posted]}
        business_date: {type: string, format: date}
        started_at: {type: string, format: date-time, description: The cutoff of the system quantities.}
        counted_at: {type: [string, 'null'], format: date-time}
        note: {type: [string, 'null']}
        posted_at: {type: [string, 'null'], format: date-time}
        posted_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
        adjustment_id: {type: [string, 'null'], format: uuid, description: The count adjustment once posted with a variance.}
        adjustment_no: {type: [string, 'null']}
        lines:
          type: array
          description: Single count only.
          items: {$ref: '#/components/schemas/StockCountLine'}
        line_count: {type: integer, description: List only.}
        counted_lines: {type: integer}
        variance_lines: {type: integer, description: Absent on a blind count still counting.}
    CostRecalculation:
      type: object
      required: [id, sku_ids, from_date, status, impact, run_version, requested_by, confirmed_by, created_at, applied_at]
      properties:
        id: {type: string, format: uuid}
        sku_ids: {type: array, items: {type: string, format: uuid}}
        from_date: {type: string, format: date}
        status: {type: string, enum: [previewed, confirmed, applied, discarded]}
        impact:
          type: object
          required: [skus, stock_value_delta, cogs_delta]
          properties:
            skus:
              type: array
              items:
                type: object
                required: [sku_id, sku_code, old_avg_cost, new_avg_cost, old_stock_value, new_stock_value, stock_value_delta,
                  cogs_delta]
                properties:
                  sku_id: {type: string, format: uuid}
                  sku_code: {type: string}
                  old_avg_cost: {$ref: '#/components/schemas/Money'}
                  new_avg_cost: {$ref: '#/components/schemas/Money'}
                  old_stock_value: {$ref: '#/components/schemas/Money'}
                  new_stock_value: {$ref: '#/components/schemas/Money'}
                  stock_value_delta: {$ref: '#/components/schemas/Money'}
                  cogs_delta: {$ref: '#/components/schemas/Money'}
            stock_value_delta: {$ref: '#/components/schemas/Money'}
            cogs_delta: {$ref: '#/components/schemas/Money'}
        run_version: {type: integer}
        requested_by: {type: string, format: uuid}
        confirmed_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        applied_at: {type: [string, 'null'], format: date-time}
    PurchaseOrderStatus:
      type: string
      enum: [draft, confirmed, partially_received, completed, closed_short]
    PurchaseOrderLineRequest:
      type: object
      required: [qty, unit_price]
      properties:
        sku_id: {type: string, format: uuid, description: Required without new_product.}
        new_product: {$ref: '#/components/schemas/NewProductRequest'}
        unit_id: {type: [string, 'null'], format: uuid, description: Default the base unit.}
        qty: {$ref: '#/components/schemas/Qty'}
        color_id: {type: [string, 'null'], format: uuid, description: Required for a SKU sold by color.}
        unit_price: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money'}
        retail_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: Sets the retail list price of the SKU and unit.}
        spec_text: {type: [string, 'null'], maxLength: 500, description: Free "Quy cách" note; empty keeps the SKU's.}
    NewProductRequest:
      type: object
      description: |
        A product with one SKU created with the line, in the same transaction; the line then buys it
        in its purchase unit (else its base unit) and `unit_id` must be that unit or omitted. Prices
        are per base unit and are recorded as edited from the purchase order. Not allowed with
        `sku_id` (422 not_allowed_with_sku_id) nor, on a receipt, with an order line.
      required: [name, base_unit_id]
      properties:
        name: {type: string, maxLength: 200}
        category_id: {type: [string, 'null'], format: uuid}
        base_unit_id: {type: string, format: uuid}
        purchase_unit_id: {type: [string, 'null'], format: uuid}
        factor: {type: [string, 'null'], description: 'Base units per purchase unit, a positive decimal.'}
        track_lot: {type: boolean, description: Track lots and expiry dates.}
        retail_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        wholesale_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
    PurchaseOrderRequest:
      type: object
      required: [supplier_party_id, lines]
      properties:
        supplier_party_id: {type: string, format: uuid}
        order_date: {type: [string, 'null'], format: date, description: Default today.}
        expected_date: {type: [string, 'null'], format: date, description: Not before the order date.}
        note: {type: [string, 'null'], maxLength: 500}
        lines:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/PurchaseOrderLineRequest'}
    PurchaseOrderLine:
      type: object
      required: [id, line_no, sku_id, sku_code, name, variant_label, unit_id, unit_name, unit_factor, qty, base_qty, color_id, spec_text,
