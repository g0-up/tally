        id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
        customer_party_id: {type: [string, 'null'], format: uuid}
        label: {type: [string, 'null']}
        status: {type: string, enum: [open, sold]}
        total_amount: {$ref: '#/components/schemas/Money'}
        sales_document_id: {type: [string, 'null'], format: uuid}
        copied_from_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
        lines: {type: array, items: {$ref: '#/components/schemas/SalesLine'}}
    OfflineSession:
      type: object
      required: [offline_until]
      properties:
        offline_until: {type: string, format: date-time}
    OfflineSyncItem:
      type: object
      required: [offline_client_id, status]
      properties:
        offline_client_id: {type: string}
        status: {type: string, enum: [posted, replayed, exception, failed]}
        sales_document_id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
        sync_exception_id: {type: string, format: uuid}
        error_code: {type: string, description: Set on exception and failed items.}
        error_detail: {type: string}
    OfflineSyncResult:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OfflineSyncItem'}}
    PosSyncException:
      type: object
      required: [id, offline_client_id, device_session_id, payload, error_code, error_detail, status, resolution_doc_id, resolved_by,
        resolved_at, created_at]
      properties:
        id: {type: string, format: uuid}
        offline_client_id: {type: string}
        device_session_id: {type: [string, 'null'], format: uuid}
        payload: {}
        error_code: {type: string}
        error_detail: {type: [string, 'null']}
        status: {type: string, enum: [open, resolved, discarded]}
        resolution_doc_id: {type: [string, 'null'], format: uuid}
        resolved_by: {type: [string, 'null'], format: uuid}
        resolved_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    SalesReturnLine:
      type: object
      required: [id, sales_document_line_id, sku_id, sku_code, name, variant_label, unit_id, unit_name, unit_factor, qty, base_qty,
        color_id, spec_text, unit_price, line_amount, unit_cost, cost_source, restock_to, lot_id]
      properties:
        id: {type: string, format: uuid}
        sales_document_line_id: {type: [string, 'null'], format: uuid}
        sku_id: {type: string, format: uuid}
        sku_code: {type: string}
        name: {type: string}
        variant_label: {type: string}
        unit_id: {type: string, format: uuid}
        unit_name: {type: string}
        unit_factor: {$ref: '#/components/schemas/Decimal'}
        qty: {$ref: '#/components/schemas/Qty'}
        base_qty: {$ref: '#/components/schemas/Qty'}
        color_id: {type: [string, 'null'], format: uuid}
        spec_text: {type: [string, 'null']}
        unit_price: {$ref: '#/components/schemas/Money'}
        line_amount: {$ref: '#/components/schemas/Money'}
        unit_cost: {$ref: '#/components/schemas/Money'}
        cost_source: {type: string, enum: [original, current_average]}
        restock_to: {type: string, enum: [sellable, quarantine]}
        lot_id: {type: string, format: uuid}
    SalesReturn:
      type: object
      required: [id, doc_no, customer_party_id, sales_document_id, reason_id, business_date, total_amount, debt_reduction_amount,
        refund_due_amount, exchange_id, status, posted_at, posted_by]
      properties:
        id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
        customer_party_id: {type: [string, 'null'], format: uuid}
        sales_document_id: {type: [string, 'null'], format: uuid}
        reason_id: {type: string, format: uuid}
        business_date: {type: string, format: date}
        total_amount: {$ref: '#/components/schemas/Money'}
        debt_reduction_amount: {$ref: '#/components/schemas/Money'}
        refund_due_amount: {$ref: '#/components/schemas/Money'}
        exchange_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [posted, reversed]}
        posted_at: {type: string, format: date-time}
        posted_by: {type: string, format: uuid}
        lines: {type: array, items: {$ref: '#/components/schemas/SalesReturnLine'}}
    SalesReturnPosted:
      type: object
      required: [sales_return, refund]
      properties:
        sales_return: {$ref: '#/components/schemas/SalesReturn'}
        refund: {oneOf: [{$ref: '#/components/schemas/SalesPayment'}, {type: 'null'}]}
    Exchange:
      type: object
      required: [id, doc_no, customer_party_id, original_sales_document_id, sales_return_id, new_sales_document_id, returned_amount,
        taken_amount, debt_reduction_amount, customer_pays_amount, store_refunds_amount, fund_account_id, business_date, posted_at,
        posted_by, created_at]
      properties:
        id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
        customer_party_id: {type: [string, 'null'], format: uuid}
        original_sales_document_id: {type: string, format: uuid}
        sales_return_id: {type: string, format: uuid}
        new_sales_document_id: {type: string, format: uuid}
        returned_amount: {$ref: '#/components/schemas/Money'}
        taken_amount: {$ref: '#/components/schemas/Money'}
        debt_reduction_amount:
          $ref: '#/components/schemas/Money'
          description: |
            What the return settles of what was still owed on the original sale. The rest of the returned
            value pays the new sale and what is left is refunded: returned - debt_reduction - store_refunds +
            customer_pays = taken.
        customer_pays_amount: {$ref: '#/components/schemas/Money'}
        store_refunds_amount: {$ref: '#/components/schemas/Money'}
        fund_account_id: {type: [string, 'null'], format: uuid}
        business_date: {type: string, format: date}
        posted_at: {type: string, format: date-time}
        posted_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    ExchangePreview:
      type: object
      required: [returned_amount, taken_amount, debt_reduction_amount, customer_pays_amount, store_refunds_amount, message, return_lines,
        lines]
      properties:
        returned_amount: {$ref: '#/components/schemas/Money'}
        taken_amount: {$ref: '#/components/schemas/Money'}
        debt_reduction_amount:
          $ref: '#/components/schemas/Money'
          description: |
            What the return settles of what was still owed on the original sale. The rest of the returned
            value pays the new sale and what is left is refunded: returned - debt_reduction - store_refunds +
            customer_pays = taken.
        customer_pays_amount: {$ref: '#/components/schemas/Money'}
        store_refunds_amount: {$ref: '#/components/schemas/Money'}
        message: {type: string, description: 'What the cashier tells the customer, e.g. "Khách trả thêm 150 000".'}
        return_lines: {type: array, items: {$ref: '#/components/schemas/SalesReturnLine'}}
        lines: {type: array, items: {$ref: '#/components/schemas/SalesLine'}}
    ExchangePosted:
      type: object
      required: [exchange, sales_return, sales_document, payment]
      properties:
        exchange: {$ref: '#/components/schemas/Exchange'}
        sales_return: {$ref: '#/components/schemas/SalesReturn'}
        sales_document: {$ref: '#/components/schemas/SalesDocumentDetail'}
        payment: {oneOf: [{$ref: '#/components/schemas/SalesPayment'}, {type: 'null'}]}
    SalesTotals:
      type: object
      required: [goods_amount, discount_amount, tax_amount, total_amount]
      properties:
        goods_amount: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        total_amount: {$ref: '#/components/schemas/Money'}
    SalesPrintTenant:
      type: object
      required: [name, legal_name, tax_code, address, phone]
      properties:
        name: {type: string}
        legal_name: {type: string}
        tax_code: {type: [string, 'null']}
        address: {type: [string, 'null']}
        phone: {type: [string, 'null']}
    SalesPrintParty:
      type: object
      required: [id, name, phone, tax_code, address]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: [string, 'null']}
        tax_code: {type: [string, 'null']}
        address: {type: [string, 'null']}
    SalesPrintLine:
      type: object
      required: [line_no, line_kind, sku_code, name, variant_label, color, spec_text, unit_name, qty, unit_price, discount_amount,
        tax_amount, line_amount, tax_rate]
      properties:
        line_no: {type: integer}
        line_kind:
          type: string
          description: |
            Sales line kinds; `goods` on a purchase order, the receipt condition on a receipt, `return` on a
            purchase return, `count` on a stock count, `increase` or `decrease` on a stock adjustment.
          enum: [item, mix_pack, mix_flavor, combo, combo_component, gift, goods, accepted, damaged, wrong_item, excess, return, count,
            increase, decrease]
        sku_code: {type: [string, 'null']}
        name: {type: string}
        variant_label: {type: string}
        color: {type: [string, 'null']}
        spec_text: {type: [string, 'null']}
        unit_name: {type: string}
        qty: {$ref: '#/components/schemas/Qty'}
        unit_price:
          $ref: '#/components/schemas/Money'
          description: |
            On a mix_pack line, the flavors' amount before discounts over the packs (rounded), so qty ×
            unit_price matches that amount even for a short pack; it is not the full-pack average price.
        discount_amount: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        line_amount: {$ref: '#/components/schemas/Money'}
        tax_rate: {$ref: '#/components/schemas/Decimal'}
        lot_no: {type: [string, 'null'], description: 'Lot of a received, returned, counted or adjusted line.'}
        expiry_date: {type: [string, 'null'], format: date}
        system_qty: {$ref: '#/components/schemas/Qty', description: What a count line expected.}
        counted_qty: {$ref: '#/components/schemas/Qty', description: What a count line found.}
    SalesPrintGroup:
      type: object
      required: [mix_key, lines]
      properties:
        mix_key: {type: [string, 'null']}
        lines: {type: array, items: {$ref: '#/components/schemas/SalesPrintLine'}}
    SalesPrintAmount:
      type: object
      required: [code, label, amount]
      properties:
        code: {type: string}
        label: {type: string}
        amount: {$ref: '#/components/schemas/Money'}
    SalesPrintRelated:
      type: object
      required: [doc_type, id, doc_no]
      properties:
        doc_type:
          type: string
          enum: [quote, invoice, stock_out, sales_document, sales_return, exchange, purchase_order, goods_receipt, purchase_return, stock_count,
            stock_adjustment, statement, kit_label]
        id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
    SalesPrintDoc:
      type: object
      required: [label, doc_type, title, id, doc_no, date, status, tenant, customer, note, groups, totals, payment, amounts, related,
        printed_at]
      properties:
        label: {type: string}
        doc_type:
          type: string
          enum: [quote, invoice, stock_out, sales_document, sales_return, exchange, purchase_order, goods_receipt, purchase_return, stock_count,
            stock_adjustment, statement, kit_label]
        title: {type: string}
        id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
        date: {type: string, format: date}
        status: {type: string}
        tenant: {oneOf: [{$ref: '#/components/schemas/SalesPrintTenant'}, {type: 'null'}], description: Null when the reader may not see the store profile.}
        customer: {oneOf: [{$ref: '#/components/schemas/SalesPrintParty'}, {type: 'null'}]}
        note: {type: [string, 'null']}
        groups: {type: array, items: {$ref: '#/components/schemas/SalesPrintGroup'}}
        returned_lines: {type: array, items: {$ref: '#/components/schemas/SalesPrintLine'}}
        totals: {$ref: '#/components/schemas/SalesTotals'}
        payment: {oneOf: [{$ref: '#/components/schemas/SalesPaymentState'}, {type: 'null'}]}
        amounts: {type: array, items: {$ref: '#/components/schemas/SalesPrintAmount'}}
        related: {type: array, items: {$ref: '#/components/schemas/SalesPrintRelated'}}
        printed_at: {type: string, format: date-time}
        version: {type: integer, description: The sent version printed (invoices and statements).}
        sent_at: {type: [string, 'null'], format: date-time, description: When the printed statement version was sent.}
        supplier: {$ref: '#/components/schemas/SalesPrintParty', description: Supplier of a purchase document or payable statement.}
        statement: {$ref: '#/components/schemas/PrintStatement', description: The frozen content of a statement version.}
        kit_lots: {type: array, items: {$ref: '#/components/schemas/PrintKitLot'}, description: The kit lots of an assembly order's label.}
    SalesMixPart:
      type: object
      required: [sku_id, parts]
      properties:
        sku_id: {type: string, format: uuid}
        color_id: {type: string, format: uuid}
        parts: {type: integer, minimum: 1}
    SalesLineInput:
      type: object
      required: [qty]
      properties:
        id: {type: string, format: uuid}
        sku_id: {type: string, format: uuid}
        color_id: {type: string, format: uuid}
        unit_id: {type: string, format: uuid}
        qty: {$ref: '#/components/schemas/Qty'}
        unit_price: {$ref: '#/components/schemas/Money', description: A manual price; omitted prices come from the price list.}
        discount_amount: {$ref: '#/components/schemas/Money'}
        spec_text: {type: string}
        mix_group_id:
          type: string
          format: uuid
          description: |
            A mix pack line ("thùng mix vị") names its group instead of a SKU; `qty` is the whole
            number of packs (mix_pack_partial otherwise). Each flavor is priced for its own pieces.
        parts:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SalesMixPart'}
          description: |
            The parts of each flavor of a mix pack, at most 100 entries. They may leave the packs short (the line is
            priced by the parts chosen) but never hold more than qty × parts per pack
            (mix_parts_exceed_pack).
        component_colors:
          type: array
          maxItems: 100
          description: |
            On a combo line, the color chosen at the counter for each component whose color the
            combo's recipe leaves open; a stocked colored component without one is color_required.
          items:
            type: object
            required: [sku_id, color_id]
            properties:
              sku_id: {type: string, format: uuid}
              color_id: {type: string, format: uuid}
    SalesDraft:
      type: object
      required: [lines]
      properties:
        lines: {type: array, items: {$ref: '#/components/schemas/SalesLineInput'}}
        order_discount_amount: {$ref: '#/components/schemas/Money'}
        promotion_codes: {type: array, items: {type: string}}
    SalesQuoteRequest:
      type: object
      required: [customer_party_id, valid_until, lines]
      properties:
        customer_party_id: {type: string, format: uuid}
        quote_date: {type: string, format: date}
        valid_until: {type: string, format: date}
        note: {type: string}
        lines: {type: array, items: {$ref: '#/components/schemas/SalesLineInput'}}
        order_discount_amount: {$ref: '#/components/schemas/Money'}
        promotion_codes: {type: array, items: {type: string}}
    QuotePatch:
      type: object
      properties:
        customer_party_id: {type: string, format: uuid}
        quote_date: {type: string, format: date}
        valid_until: {type: string, format: date}
        note: {type: string}
        draft: {$ref: '#/components/schemas/SalesDraft', description: Replaces every line when present.}
    InvoiceRequest:
      type: object
      required: [customer_party_id, lines]
      properties:
        customer_party_id: {type: string, format: uuid}
        payer_party_id: {type: string, format: uuid}
        invoice_date: {type: string, format: date}
        due_date: {type: string, format: date}
        note: {type: string}
        lines: {type: array, items: {$ref: '#/components/schemas/SalesLineInput'}}
        order_discount_amount: {$ref: '#/components/schemas/Money'}
        promotion_codes: {type: array, items: {type: string}}
    InvoicePatch:
      type: object
      properties:
        customer_party_id: {type: string, format: uuid}
        payer_party_id: {type: string, format: uuid}
        invoice_date: {type: string, format: date}
        due_date: {type: string, format: date}
        note: {type: string}
    InvoiceReviseRequest:
      type: object
      required: [change_summary]
      properties:
        change_summary: {type: string}
        due_date: {type: string, format: date}
        note: {type: string}
        draft: {$ref: '#/components/schemas/SalesDraft', description: Replaces every line when present.}
        exception_confirmation_ids: {type: array, items: {type: string, format: uuid}}
    PaidAmountRequest:
      type: object
      required: [amount]
      properties:
        amount: {$ref: '#/components/schemas/Money'}
        payment_method_id: {type: string, format: uuid}
        note: {type: string}
    StockOutLineRequest:
      type: object
      required: [invoice_line_id, base_qty]
      properties:
        invoice_line_id: {type: string, format: uuid}
        base_qty: {$ref: '#/components/schemas/Qty'}
    StockOutRequest:
      type: object
      required: [lines]
      properties:
        lines: {type: array, items: {$ref: '#/components/schemas/StockOutLineRequest'}}
        note: {type: string}
    PosPayment:
      type: object
      required: [payment_method_id, amount]
      properties:
        payment_method_id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
    PosCheckoutRequest:
      type: object
      required: [lines]
      properties:
