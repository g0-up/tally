        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: assembly_order_status_invalid.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /assembly-orders/{id}/label:
    get:
