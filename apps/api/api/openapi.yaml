                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PriceChange'}}
                  next_cursor:
                    oneOf:
                      - $ref: '#/components/schemas/Cursor'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /price-changes:
    get:
      tags: [pricing]
      operationId: listPriceChanges
      summary: Price history of every SKU, newest first
      description: One row per price list entry changed; a retail and a wholesale edit made together share created_at.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Price changes.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PriceChange'}}
                  next_cursor:
                    oneOf:
                      - $ref: '#/components/schemas/Cursor'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /pricing/quote:
    post:
      tags: [pricing]
      operationId: quotePrices
      summary: Resolve list prices for sales lines
      description: |
        Resolves each line through the customer, group, season and base lists, preferring a color
        row over the general row, a unit row over the base price times the unit factor, and the
        highest quantity tier reached. A line without any list price comes back as manual with 0.
        Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: One resolved price per request line, in order.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ResolvedPrice'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /pricing/calculate:
    post:
      tags: [pricing]
      operationId: calculateDocument
      summary: Price, discount, tax and round a draft sales document
      description: |
        Runs the full calculation a sale posts with: list prices (unless typed), line discounts,
        automatic and coded promotions, the order discount allocated by line value, tax and the
        store's rounding mode. Lines below the minimum price are flagged; posting them needs a
        below_min_price confirmation. Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateRequest'
      responses:
        '200':
          description: Calculated document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculatedDocument'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /promotions:
    get:
      tags: [pricing]
      operationId: listPromotions
      summary: Promotions, newest first
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - {name: status, in: query, schema: {$ref: '#/components/schemas/PromotionStatus'}}
        - {name: q, in: query, description: Name or code words., schema: {type: string}}
      responses:
        '200':
          description: Promotions.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Promotion'}}
                  next_cursor:
                    oneOf:
                      - $ref: '#/components/schemas/Cursor'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags: [pricing]
      operationId: createPromotion
      summary: Add a promotion
      description: |
        A promotion without a code applies automatically; one with a code only when the code is
        entered. Gift promotions need gift items, combo prices combo components.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PromotionRequest'
                - {type: object, required: [name, kind, value, valid_from, valid_to]}
      responses:
        '201':
          description: Promotion; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: code_taken.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /promotions/validate-code:
    get:
      tags: [pricing]
      operationId: validatePromotionCode
      summary: Check a promotion code for a sale
      description: |
        Tells whether the code can be used for the buyer on the business date, and why not. Rate
        limited per client IP.
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: party_id, in: query, schema: {type: string, format: uuid}}
        - {name: customer_group_id, in: query, schema: {type: string, format: uuid}}
        - {name: business_date, in: query, description: Defaults to today in the store's time zone., schema: {type: string, format: date}}
      responses:
        '200':
          description: Code check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeCheck'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /promotions/{id}:
    get:
      tags: [pricing]
      operationId: getPromotion
      summary: One promotion
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Promotion; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [pricing]
      operationId: updatePromotion
      summary: Update a promotion
      description: Nullable fields take null to clear them; `items` replaces every item when present.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionRequest'
      responses:
        '200':
          description: Promotion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: code_taken.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /promotions/{id}:activate:
    post:
      tags: [pricing]
      operationId: activatePromotion
      summary: Start applying a promotion
      description: Idempotent.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Promotion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /promotions/{id}:deactivate:
    post:
      tags: [pricing]
      operationId: deactivatePromotion
      summary: Stop applying a promotion
      description: Idempotent; documents already priced keep their discount.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Promotion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /debts/parties:
    get:
      tags: [debt]
      operationId: listDebtParties
      summary: Parties with an open balance on one ledger
      description: |
        One row per party with open documents or an unallocated advance on the ledger, ordered by
        name. `open` is the sum of the open amounts of its documents and `overdue` the part of it
        past its due dates (installments oldest first); `advance` is the unallocated part of its
        confirmed payments, shown apart and never netted.
      parameters:
        - name: direction
          in: query
          required: true
          schema: {$ref: '#/components/schemas/DebtDirection'}
        - name: overdue
          in: query
          required: false
          description: Only parties with an overdue amount.
          schema: {type: boolean}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of party balances.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/DebtPartySummary'}}
                  next_cursor: {oneOf: [{$ref: '#/components/schemas/Cursor'}, {type: 'null'}]}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /debts/parties/{partyId}:
    get:
      tags: [debt]
      operationId: getDebtPartyLedger
      summary: Ledger of one party
      description: |
        Open documents of both ledgers with their installments and settlements, the unallocated
        advances, and the payments waiting for verification (which settle nothing yet).
      parameters:
        - name: partyId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Party ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtPartyLedger'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /debts/aging:
    get:
      tags: [debt]
      operationId: getDebtAging
      summary: Aging of one ledger as of a date
      description: |
        Replays the documents dated on or before `as_of` and their settlements dated on or before
        it, so a past date answers the same before and after later postings. The unpaid part of a
        document ages by its installments' due dates, oldest installment settled first.
      parameters:
        - name: direction
          in: query
          required: true
          schema: {$ref: '#/components/schemas/DebtDirection'}
        - name: as_of
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Aging report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtAging'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /debts/forecast:
    get:
      tags: [debt]
      operationId: getDebtForecast
      summary: Collections and payments due per day, apart from confirmed cash
      description: |
        Per day of the range (at most 366 days): open installments due on both ledgers and the
        amounts customers promised, next to the payments actually confirmed that day. Amounts
        already overdue at `from` are totalled separately.
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Forecast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtForecast'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /payments:
    get:
      tags: [debt]
      operationId: listPayments
      summary: Receipts PT and payments PC, newest posted first
      description: |
        `unallocated=true` keeps the confirmed payments that still hold an advance; `unallocated`
        is what is left of each. `doc_no` finds one document by its exact number.
      parameters:
        - {name: direction, in: query, schema: {type: string, enum: [in, out]}}
        - {name: party_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [pending_verification, confirmed, reversed]}}
        - {name: unallocated, in: query, schema: {type: boolean}}
        - {name: doc_no, in: query, description: Exact document number., schema: {type: string}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of payments.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PendingPayment'}}
                  next_cursor: {oneOf: [{$ref: '#/components/schemas/Cursor'}, {type: 'null'}]}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (direction, status, unallocated or party_id) or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [debt]
      operationId: postPayment
      summary: Record a receipt (PT) or a payment (PC)
      description: |
        The method decides the fund and whether the payment waits for verification: a bank
        transfer that requires verification is stored `pending_verification`, writes no cash entry
        and allocates nothing until confirmed (its `allocations` are kept as planned). A confirmed
        payment writes its cash entry and settles the listed documents; the rest stays an advance.
        A deposit earmarked to an invoice allocates to that invoice's documents automatically.
        `opening_advance` records an advance held at the opening cutoff (no cash entry).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment with the settlements it wrote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: |
            validation_failed, idempotency_key_required, allocation_exceeds_open,
            allocation_exceeds_payment, allocation_party_mismatch or allocation_direction_mismatch.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /payments/{id}:
    get:
      tags: [debt]
      operationId: getPayment
      summary: One receipt PT or payment PC with every settlement it wrote
      description: Settlements are oldest first, reversals included; `ETag` carries the version.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Payment.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /payments/{id}:confirm:
    post:
      tags: [debt]
      operationId: confirmPayment
      summary: Confirm a transfer waiting for verification
      description: Writes the cash entry and the planned allocations, once.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Confirmed payment with the settlements it wrote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: payment_not_pending, payment_changed or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: allocation_exceeds_open when a planned document was settled meanwhile.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /payments/{id}:reverse:
    post:
      tags: [debt]
      operationId: reversePayment
      summary: Reverse a payment (re-authentication required)
      description: |
        Writes a negative settlement for each of its settlements and a mirror cash entry, so every
        balance returns to its value before the payment. Blocked while a confirmed refund of its
        advance is not reversed.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Reversed payment with the reversal settlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: payment_reversed, payment_has_successor, payment_changed or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /payments/pending-verification:
    get:
      tags: [debt]
      operationId: listPendingPayments
      summary: Transfers waiting for verification
      responses:
        '200':
          description: Pending payments, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PendingPayment'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
  /allocations:
    post:
      tags: [debt]
      operationId: postAllocation
      summary: Allocate the advance of a confirmed payment to open documents
      description: |
        Each line settles at most the document's open amount; together they settle at most the
        payment's unallocated amount. Documents must belong to the payment's party and ledger.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, allocations]
              properties:
                payment_id: {type: string, format: uuid}
                allocations:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: {$ref: '#/components/schemas/AllocationLine'}
      responses:
        '201':
          description: Payment with the settlements this allocation wrote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: payment_reversed, payment_changed or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: |
            allocation_exceeds_open, allocation_exceeds_payment, allocation_party_mismatch,
            allocation_direction_mismatch, obligation_settled, obligation_not_found,
            payment_not_found, payment_pending_verification, payment_without_party or
            validation_failed.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /allocations:suggest:
    post:
      tags: [debt]
      operationId: suggestAllocation
      summary: Suggest an allocation, oldest due date first
      description: |
        Fills the party's open documents of the ledger by due date, oldest first, until the amount
        runs out; nothing is saved. Lines accepted as suggested are posted with mode
        `suggested_oldest_due`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party_id, direction, amount]
              properties:
                party_id: {type: string, format: uuid}
                direction: {$ref: '#/components/schemas/DebtDirection'}
                amount: {$ref: '#/components/schemas/Money'}
      responses:
        '200':
          description: Suggested lines; the amount left over stays an advance.
          content:
            application/json:
              schema:
                type: object
                required: [allocations]
                properties:
                  allocations: {type: array, items: {$ref: '#/components/schemas/Allocation'}}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /debt-adjustments:
    get:
      tags: [debt]
      operationId: listDebtAdjustments
      summary: Debt adjustments DN, newest posted first
      parameters:
        - {name: party_id, in: query, schema: {type: string, format: uuid}}
        - {name: doc_no, in: query, description: Exact document number; finds one document., schema: {type: string}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of documents, newest posted first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/DebtAdjustmentRow'}}
                  next_cursor: {oneOf: [{$ref: '#/components/schemas/Cursor'}, {type: 'null'}]}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (party_id) or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [debt]
      operationId: postDebtAdjustment
      summary: Post a debt adjustment DN (a write-off needs re-authentication and a debt_write_off confirmation)
      description: |
        `increase` and `opening_balance` create a document on the ledger (an opening balance is
        dated at its cutoff and creates no revenue or stock value); `decrease`, `write_off` and
        `dispute_settlement` settle `target_obligation_id`. Every kind needs a debt adjustment
        reason. A write-off answers 409 exception_required until retried with a debt_write_off
        confirmation whose payload hash covers this body without `exception_confirmation_id`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtAdjustmentRequest'
      responses:
        '201':
          description: Adjustment with the document it created or the settlement it wrote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtAdjustmentResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required (write-off), support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: exception_required, exception_confirmation_used or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: |
            allocation_exceeds_open, allocation_party_mismatch, allocation_direction_mismatch,
            obligation_settled, obligation_not_found, reason_invalid or validation_failed.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /debt-adjustments/{id}:
    get:
      tags: [debt]
      operationId: getDebtAdjustment
      summary: One debt adjustment DN
      description: With the document it opened (increase, opening balance) or the settlements it wrote (decrease, write-off, dispute settlement).
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtAdjustmentDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /debt-offsets:
    get:
      tags: [debt]
      operationId: listDebtOffsets
      summary: Debt offsets BT, newest posted first
      parameters:
        - {name: party_id, in: query, schema: {type: string, format: uuid}}
        - {name: doc_no, in: query, description: Exact document number; finds one document., schema: {type: string}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of documents, newest posted first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/DebtOffsetRow'}}
                  next_cursor: {oneOf: [{$ref: '#/components/schemas/Cursor'}, {type: 'null'}]}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (party_id) or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [debt]
      operationId: postDebtOffset
      summary: Offset a receivable against a payable of the same party BT (re-authentication required)
      description: |
        Settles both documents by the same amount with the signed agreement attached; both ledgers
        keep their entries. Nothing is netted without this explicit document.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party_id, receivable_obligation_id, payable_obligation_id, amount, attachment_id]
              properties:
                party_id: {type: string, format: uuid}
                receivable_obligation_id: {type: string, format: uuid}
                payable_obligation_id: {type: string, format: uuid}
                amount: {$ref: '#/components/schemas/Money'}
                attachment_id:
                  type: string
                  format: uuid
                  description: The signed agreement (biên bản), uploaded with owner_type party for party_id and completed.
                note: {type: string, maxLength: 1000}
      responses:
        '201':
          description: Offset with its two settlements, receivable first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtOffsetResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          description: |
            allocation_exceeds_open, allocation_party_mismatch, allocation_direction_mismatch,
            obligation_not_found, attachment_invalid or validation_failed. attachment_invalid
            (fields.attachment_id = invalid) when the attachment is missing, not completed yet
            (POST /attachments/{id}:complete), rejected, or not uploaded for the party of the offset.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /debt-offsets/{id}:
    get:
      tags: [debt]
      operationId: getDebtOffset
      summary: One debt offset BT with its settlements
      description: Both settlements, receivable first, and any reversal of them.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtOffsetDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /refunds:
    post:
      tags: [debt]
      operationId: postRefund
      summary: Pay out a refund due or refund an advance
      description: |
        With `obligation_id` the refund settles a refund due (left over from a credit note);
        with `payment_id` it refunds the unallocated advance of a confirmed payment
        (`advance_refund`), which then blocks reversing that payment until the refund is reversed.
        `amount` defaults to everything still due or unallocated.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method_id]
              properties:
                obligation_id: {type: [string, 'null'], format: uuid}
                payment_id: {type: [string, 'null'], format: uuid}
                payment_method_id: {type: string, format: uuid}
                amount: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
                reference: {type: string, maxLength: 100}
                note: {type: string, maxLength: 1000}
      responses:
        '201':
          description: Refund payment with the settlement it wrote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: payment_reversed or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: |
            insufficient_advance, obligation_settled, obligation_not_found, payment_not_found,
            payment_pending_verification, payment_without_party, payment_method_inactive,
            refund_not_due, refund_direction_mismatch, refund_party_mismatch, refund_must_settle
            or validation_failed.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /statements:
    get:
      tags: [debt]
      operationId: listStatements
      summary: Debt statements, newest first
      parameters:
        - name: party_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/StatementStatus'}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of statements.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/StatementRow'}}
                  next_cursor: {oneOf: [{$ref: '#/components/schemas/Cursor'}, {type: 'null'}]}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags: [debt]
      operationId: createStatement
      summary: Open a statement DS for a party and period
      description: |
        Creates the statement in draft with its first version (opening, transactions, closing).
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party_id, direction, period_from, period_to]
              properties:
                party_id: {type: string, format: uuid}
                direction: {$ref: '#/components/schemas/DebtDirection'}
                period_from: {type: string, format: date}
                period_to: {type: string, format: date}
      responses:
        '201':
          description: Statement; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid or validation_failed.
          $ref: '#/components/responses/Error'
  /statements/{id}:
    get:
      tags: [debt]
      operationId: getStatement
      summary: One statement with its party and current balances
      description: The `ETag` carries the version, for the If-Match of its commands.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Statement.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementRow'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /statements/{id}/versions/{n}:
    get:
      tags: [debt]
      operationId: getStatementVersion
      summary: One version of a statement
      description: |
        A version never changes once written; a version older than the current one answers
        `superseded`.
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: n
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Statement version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementVersion'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /statements/{id}:generate:
    post:
      tags: [debt]
      operationId: generateStatement
      summary: Regenerate a statement as a new version
      description: |
        Writes the next version from the current ledger; earlier versions stay as they were and
        become superseded. A confirmed statement cannot be regenerated.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Statement; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: statement_confirmed or statement_invalid_state.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /statements/{id}:send:
    post:
      tags: [debt]
      operationId: sendStatement
      summary: Mark the current version as sent to the party
      description: The sent version is frozen; later changes need a new version.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Statement; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: statement_confirmed or statement_invalid_state.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /statements/{id}:confirm:
    post:
      tags: [debt]
      operationId: confirmStatement
      summary: Record that the party confirmed the sent version
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Statement; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: statement_confirmed or statement_invalid_state.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /statements/{id}:dispute:
    post:
      tags: [debt]
      operationId: disputeStatement
      summary: Record that the party disputes the sent version
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: Statement; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: statement_confirmed or statement_invalid_state.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /parties/{id}/collection-notes:
    get:
      tags: [debt]
      operationId: listCollectionNotes
      summary: Collection notes, promises and reminders of a party, newest first
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of notes.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/CollectionNote'}}
                  next_cursor: {oneOf: [{$ref: '#/components/schemas/Cursor'}, {type: 'null'}]}
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags: [debt]
      operationId: addCollectionNote
      summary: Add a note, call log or payment promise
      description: |
        A promise needs `promised_date`; its amount, when given, feeds the forecast.
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                direction: {$ref: '#/components/schemas/DebtDirection'}
                kind: {type: string, enum: [note, call, promise]}
                body: {type: string, maxLength: 1000}
                promised_date: {type: [string, 'null'], format: date}
                promised_amount: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
                channel: {$ref: '#/components/schemas/ContactChannel'}
      responses:
        '201':
          description: Note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionNote'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid or validation_failed.
          $ref: '#/components/responses/Error'
  /parties/{id}/reminders:
    post:
      tags: [debt]
      operationId: remindParty
      summary: Build a payment reminder and log it once per channel and day
      description: |
        Returns the reminder text for the owner to copy and send; nothing is sent to third
        parties. On the email channel the reminder is mailed only when the party consented to debt
        reminders by email. A second reminder on the same channel the same day answers 200 with
        `duplicate: true` and is not logged again.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: {$ref: '#/components/schemas/ContactChannel'}
      responses:
        '201':
          description: Reminder logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '200':
          description: Already logged today on this channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: nothing_owed or validation_failed.
          $ref: '#/components/responses/Error'
  /funds:
    get:
      tags: [cash]
      operationId: listFunds
      summary: Fund accounts with their balances
      description: Balance = opening balance + the sum of the fund's cash entries.
      responses:
        '200':
          description: Funds.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/FundAccount'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
  /funds/{id}:
    patch:
      tags: [cash]
      operationId: updateFund
      summary: Rename a fund or set its opening balance
      description: |
        The opening balance and date can change only while the fund has no cash entry (409
        fund_has_entries otherwise); the opening balance is never revenue. Bank details apply to
        the bank fund only. Nullable fields take null to clear them.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                bank_name: {type: [string, 'null'], maxLength: 100}
                account_no: {type: [string, 'null'], maxLength: 100}
                opening_balance: {$ref: '#/components/schemas/Money'}
                opening_date: {type: [string, 'null'], format: date}
      responses:
        '200':
          description: Fund; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundAccount'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: fund_has_entries.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /payment-methods:
    get:
      tags: [cash]
      operationId: listPaymentMethods
      summary: Payment methods and the fund each pays into
      responses:
        '200':
          description: Payment methods.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PaymentMethod'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
  /stock:
    get:
      tags: [inventory]
      operationId: listStock
      summary: Stock list by SKU with the split per color
      description: |
        On hand = sellable + quarantine + expired. Available = sellable − reserved. `low` is
        on hand below the minimum stock, `over` above the maximum. Ordered by SKU code.
        `uncolored=true` with `color_id` or `colored_only=true` is rejected with a
        `conflicts_with_uncolored` field error.
      parameters:
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}, description: 'Code, name or barcode.'}
        - {name: category_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: color_id, in: query, required: false, schema: {type: string, format: uuid}, description: SKUs holding that color.}
        - {name: colored_only, in: query, required: false, schema: {type: boolean}, description: SKUs that hold stock by color.}
        - name: uncolored
          in: query
          required: false
          schema: {type: boolean}
          description: SKUs that do not hold stock by color (Không màu); conflicts with color_id and colored_only.
        - {name: below_min, in: query, required: false, schema: {type: boolean}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stock rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/StockRow'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
  /stock/{skuId}:
    get:
      tags: [inventory]
      operationId: getStock
      summary: One SKU's stock with its colors and lots
      parameters:
        - {name: skuId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Stock of the SKU; `lots` lists the lots holding stock, first to expire first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /stock-card:
    get:
      tags: [inventory]
      operationId: getStockCard
      summary: Stock card (thẻ kho) of one SKU, optionally one color
      description: |
        Opening + in − out = closing over the period, row by row in posting order. `reconciled`
        is true when the SKU's projections agree with its moves and, for a period ending today,
        the closing equals the on-hand stock. `unit_mode=auto` writes each quantity in the largest
        whole units (e.g. "2 thùng 5 hộp"); `fixed` writes it in `unit_id`.
      parameters:
        - {name: sku_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: color_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: uncolored, in: query, required: false, schema: {type: boolean}, description: Only the stock with no color.}
        - {name: from, in: query, required: false, schema: {type: string, format: date}, description: Default the first day of the month.}
        - {name: to, in: query, required: false, schema: {type: string, format: date}, description: Default today.}
        - {name: unit_mode, in: query, required: false, schema: {type: string, enum: [auto, fixed], default: auto}}
        - {name: unit_id, in: query, required: false, schema: {type: string, format: uuid}, description: Required with unit_mode=fixed.}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stock card; the totals cover the whole period, the rows one page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCard'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
  /lots:
    get:
      tags: [inventory]
      operationId: listLots
      summary: Lots holding stock, first to expire first
      parameters:
        - {name: sku_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: state, in: query, required: false, schema: {type: string, enum: [all, normal, expiring, expired, quarantine], default: all}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [kit]}, description: Only assembled kits.}
        - {name: expiring_within, in: query, required: false, schema: {type: integer, minimum: 0}, description: Days.}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lots.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Lot'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
  /lots/{id}/trace:
    get:
      tags: [inventory]
      operationId: traceLot
      summary: Every move of one lot, in posting order
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The lot and one page of its moves.
          content:
            application/json:
              schema:
                type: object
                required: [lot, moves, next_cursor]
                properties:
                  lot: {$ref: '#/components/schemas/Lot'}
                  moves: {type: array, items: {$ref: '#/components/schemas/StockMove'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: invalid_cursor.
          $ref: '#/components/responses/Error'
  /reservations:
    get:
      tags: [inventory]
      operationId: listReservations
      summary: Stock reservations, newest first
      parameters:
        - {name: sku_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, consumed, released]}}
        - {name: source_type, in: query, required: false, schema: {type: string}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reservations.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Reservation'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [inventory]
      operationId: createReservation
      summary: Hold stock by hand
      description: The SKU's sellable stock minus what is already reserved must cover the quantity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku_id, qty]
              properties:
                sku_id: {type: string, format: uuid}
                qty: {$ref: '#/components/schemas/Qty'}
                expires_at: {type: [string, 'null'], format: date-time}
                note: {type: [string, 'null'], maxLength: 500}
      responses:
        '201':
          description: Reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: insufficient_sellable, with the available quantity in `fields`.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or sku_not_stockable.
          $ref: '#/components/responses/Error'
  /reservations/{id}:release:
    post:
      tags: [inventory]
      operationId: releaseReservation
      summary: Release all or part of an open reservation
      description: The reason is stored on the reservation (release_reason) and in the audit log.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                qty:
                  $ref: '#/components/schemas/Qty'
                  description: At most the open quantity; omitted releases all of it.
                reason: {type: string, minLength: 1, maxLength: 500, description: Why the hold is released.}
      responses:
        '200':
          description: Reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: reservation_not_active or reservation_not_manual (the hold belongs to an invoice or an assembly order).
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (`reason` required or too_long, `qty` invalid).
          $ref: '#/components/responses/Error'
  /stock-adjustments:
    get:
      tags: [inventory]
      operationId: listStockAdjustments
      summary: Stock adjustments (DC), newest first
      parameters:
        - {name: kind, in: query, required: false, schema: {$ref: '#/components/schemas/StockAdjustmentKind'}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [posted, reversed]}}
        - {name: sku_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: doc_no, in: query, required: false, schema: {type: string, maxLength: 50}, description: Exact document number.}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Adjustments with a summary of their lines instead of the lines.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/StockAdjustment'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [inventory]
      operationId: postStockAdjustment
      summary: Post a stock adjustment (disposal and quarantine release need re-authentication)
      description: |
        Increases (`increase`, `opening`) receive into a lot at `unit_cost` (default the average
        cost); every other kind issues at the average cost, first to expire first unless a lot is
        named. `quarantine_in` and `quarantine_release` move stock between sellable and
        quarantined lots of the same SKU. `disposal` and `quarantine_release` need recent
        re-authentication and an owner's exception confirmation (`stock_disposal`,
        `quarantine_release`) bound to this exact body; without it the answer is 409
        exception_required. A `decrease` or `quarantine_in` citing a reason of kind `disposal`
        is a disposal too and needs the same (`stock_disposal`). An issue never substitutes
        another color.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
      responses:
        '201':
          description: Adjustment with its lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: |
            insufficient_stock (available quantity per color in `fields`), expired_lot_blocked,
            lot_quarantined, exception_required, exception_confirmation_used or an idempotency
            conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, idempotency_key_required, color_required, lot_mismatch or sku_not_stockable.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /stock-adjustments/{id}:
    get:
      tags: [inventory]
      operationId: getStockAdjustment
      summary: One stock adjustment with its lines
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustment'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /stock-adjustments/{id}:reverse:
    post:
      tags: [inventory]
      operationId: reverseStockAdjustment
      summary: Reverse a stock adjustment (re-authentication required)
      description: |
        Posts a mirror adjustment whose moves cancel the original ones, lot by lot and at the
        original cost. Blocked when the stock the adjustment received was issued meanwhile.
        Reversing a `quarantine_in` puts the stock back on sale, so it needs an owner's
        `quarantine_release` exception confirmation bound to the adjustment and this exact
        body; without it the answer is 409 exception_required.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                exception_confirmation_id: {type: [string, 'null'], format: uuid}
      responses:
        '201':
          description: The reversal adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            already_reversed, insufficient_stock, exception_required, exception_confirmation_used
            or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /stock-counts:
    get:
      tags: [inventory]
      operationId: listStockCounts
      summary: Stock counts (KK), newest first
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [counting, pending_post, posted]}}
        - {name: doc_no, in: query, required: false, schema: {type: string, maxLength: 50}, description: Exact document number.}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Counts with a summary of their sheet instead of the lines.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/StockCount'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [inventory]
      operationId: startStockCount
      summary: Start a stock count
      description: |
        Snapshots the system quantity of every line (SKU × color, or lot for lot-tracked SKUs) at
        the cutoff. Moves posted after the cutoff are tracked per line and the variance is
        counted − (system + moved since start). A blind count hides the system side until it is
        finished. With an Idempotency-Key a retry returns the count it started (200).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: {type: string, enum: [all, category, selection]}
                category_id: {type: [string, 'null'], format: uuid, description: Required with scope=category.}
                sku_ids: {type: array, items: {type: string, format: uuid}, description: Required with scope=selection.}
                blind: {type: boolean, default: false}
                note: {type: [string, 'null'], maxLength: 500}
      responses:
        '201':
          description: Count with its sheet; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCount'
        '200':
          description: The count an earlier request with the same Idempotency-Key started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /stock-counts/{id}:
    get:
      tags: [inventory]
      operationId: getStockCount
      summary: One stock count with its sheet
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Count; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /stock-counts/{id}/lines:
    put:
      tags: [inventory]
      operationId: updateStockCountLines
      summary: Record counted quantities
      description: |
        Each entry updates a line (`line_id`) or adds an SKU × color found on the shelf
        (`sku_id`, `color_id`). A null `counted_qty` clears the line. A line without a lot of a
        SKU tracking lots or expiry may carry `lot_no` and `expiry_date`: a gain on it is booked
        into that new lot.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      line_id: {type: [string, 'null'], format: uuid}
                      sku_id: {type: [string, 'null'], format: uuid}
                      color_id: {type: [string, 'null'], format: uuid}
                      counted_qty: {oneOf: [{$ref: '#/components/schemas/Qty'}, {type: 'null'}]}
                      reason_id: {type: [string, 'null'], format: uuid}
                      lot_no: {type: [string, 'null'], maxLength: 64}
                      expiry_date: {type: [string, 'null'], format: date}
      responses:
        '200':
          description: Count; `ETag` carries the new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: count_not_counting.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /stock-counts/{id}:finish:
    post:
      tags: [inventory]
      operationId: finishStockCount
      summary: Finish counting; the variances become visible
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Count in `pending_post`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: count_not_counting.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '422':
          description: |
            count_incomplete (a line has no counted quantity) or count_lot_required (a gain on a
            SKU tracking lots or expiry has no lot to go into: set `lot_no`/`expiry_date` on the
            line, keyed `lines.<line id>.lot_no` or `.expiry_date` in `fields`).
          $ref: '#/components/responses/Error'
  /stock-counts/{id}:recount:
    post:
      tags: [inventory]
      operationId: recountStockCount
      summary: Send lines back to counting
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line_ids]
              properties:
                line_ids: {type: array, minItems: 1, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Count back in `counting`, the listed lines cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: count_not_finished.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /stock-counts/{id}:post:
    post:
      tags: [inventory]
      operationId: postStockCount
      summary: Post the variances as a count adjustment
      description: |
        Writes one adjustment (kind `count`) with a gain or loss move per line that differs. A
        count with any variance needs an owner's `count_variance` exception confirmation bound to
        the count, its version and this body; without it the answer is 409 exception_required.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                exception_confirmation_id: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: Posted count with `adjustment_id` and `adjustment_no`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            count_not_finished, count_already_posted, insufficient_stock, exception_required,
            exception_confirmation_used or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or count_lot_required (as on finish).
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /cost-recalculations:
    get:
      tags: [inventory]
      operationId: listCostRecalculations
      summary: Backdate cost recalculations, newest first
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [previewed, confirmed, applied, discarded]}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recalculation runs.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/CostRecalculation'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [inventory]
      operationId: previewCostRecalculation
      summary: Preview the moving-average replay of SKUs from a date
      description: |
        Replays every move of the SKUs from `from_date` and stores the impact on the average
        cost, stock value and cost of goods sold. Nothing changes until the run is confirmed.
        Answers 204 when the replay changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku_ids, from_date]
              properties:
                sku_ids: {type: array, minItems: 1, maxItems: 200, items: {type: string, format: uuid}}
                from_date: {type: string, format: date}
      responses:
        '201':
          description: Previewed run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostRecalculation'
        '204':
          description: Nothing to correct.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /cost-recalculations/{id}:
    get:
      tags: [inventory]
      operationId: getCostRecalculation
      summary: One cost recalculation run
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostRecalculation'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /cost-recalculations/{id}:confirm:
    post:
      tags: [inventory]
      operationId: confirmCostRecalculation
      summary: Apply a previewed recalculation (re-authentication required)
      description: |
        Writes one cost adjustment move per SKU whose stock value changes and updates the average
        cost. A move posted on the SKUs after the preview makes the run stale (409 recost_stale);
        preview again.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Applied run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostRecalculation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: recost_not_pending, recost_stale or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /cost-recalculations/{id}:discard:
    post:
      tags: [inventory]
      operationId: discardCostRecalculation
      summary: Discard a previewed recalculation
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Discarded run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostRecalculation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: recost_not_pending.
          $ref: '#/components/responses/Error'
  /purchase-orders:
    get:
      tags: [procurement]
      operationId: listPurchaseOrders
      summary: Purchase orders (PO), newest first, with their progress in base units
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/PurchaseOrderStatus'}}
        - {name: supplier_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: q, in: query, required: false, description: Document number or supplier name., schema: {type: string, maxLength: 200}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Orders without their lines.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PurchaseOrder'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [procurement]
      operationId: createPurchaseOrder
      summary: Create a draft purchase order
      description: |
        A draft has no effect on stock or debt. Lines are priced in purchase mode (typed price,
        tax per line, no promotions). `retail_price` sets the SKU's retail list price at once
        (source purchase_order).
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
      responses:
        '201':
          description: Draft order with its lines; `ETag` carries the version.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: pricing_mismatch, idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid or validation_failed (an unknown or inactive supplier, SKU, unit or color in `fields`).
          $ref: '#/components/responses/Error'
  /purchase-orders/{id}:
