          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: order_not_draft.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
    delete:
      tags: [procurement]
      operationId: deletePurchaseOrder
      summary: Delete a draft purchase order
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
