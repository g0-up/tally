      operationId: createAssemblyOrder
      summary: Plan an assembly order from a kit's active recipe
      description: |
        Plans each component's quantity, colors included; planning holds and consumes nothing.
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssemblyOrderRequest'
      responses:
        '201':
          description: Assembly order; `ETag` carries the version.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyOrderDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid, validation_failed or not_a_kit (only a published pre-packed kit is assembled).
          $ref: '#/components/responses/Error'
  /assembly-orders:preview:
    post:
      tags: [kits]
