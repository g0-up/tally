      responses:
        '200':
          description: Cost view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitCostView'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /kits/{id}/recipes:
