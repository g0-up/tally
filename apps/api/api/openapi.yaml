                  data: {type: array, items: {$ref: '#/components/schemas/PurchasePriceAdjustment'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [procurement]
      operationId: postPurchasePriceAdjustment
      summary: Change the purchase price of received lines (final price or post-purchase discount)
      description: |
        The difference per line is split between the stock still on hand (a cost adjustment that
        moves the average cost) and the part already sold (cost of goods sold). The payable
        changes by the total difference: an increase records an extra payable, a decrease a
        credit note on the receipt's payable. Matched supplier documents are compared again.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
