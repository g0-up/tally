            application/json:
              schema:
                $ref: '#/components/schemas/AttributeSet'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: name_taken.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /attribute-sets/{id}:
    get:
      tags: [catalog]
      operationId: getAttributeSet
