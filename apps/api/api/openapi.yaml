      description: The removal is written to the price history with the given source screen.
      parameters:
        - $ref: '#/components/parameters/ID'
        - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: source, in: query, description: Defaults to price_list., schema: {$ref: '#/components/schemas/PriceChangeSource'}}
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Error'
        '403':
