      tags: [sales]
      operationId: getSalesDocument
      summary: One sales document with its lines and payment state
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Sales document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDocumentDetail'
        '401':
