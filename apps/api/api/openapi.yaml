      properties:
        id: {type: string, format: uuid}
        line_no: {type: integer}
        sku_id: {type: string, format: uuid}
        sku_code: {type: string}
        name: {type: string}
        variant_label: {type: string}
        unit_id: {type: string, format: uuid}
        unit_name: {type: string}
        unit_factor: {$ref: '#/components/schemas/Decimal'}
        qty: {$ref: '#/components/schemas/Qty'}
        base_qty: {$ref: '#/components/schemas/Qty'}
        color_id: {type: [string, 'null'], format: uuid}
        spec_text: {type: [string, 'null']}
        unit_price: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money'}
        tax_rate: {$ref: '#/components/schemas/Decimal'}
        line_amount: {$ref: '#/components/schemas/Money'}
        retail_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        received_base_qty: {$ref: '#/components/schemas/Qty'}
        returned_base_qty: {$ref: '#/components/schemas/Qty'}
        pending_base_qty: {$ref: '#/components/schemas/Qty', description: 'Ordered minus received, never below zero.'}
    PurchaseOrder:
      type: object
      required: [id, doc_no, supplier_party_id, supplier_name, order_date, expected_date, status, goods_amount, discount_amount, tax_amount,
        total_amount, note, close_reason_id, closed_at, confirmed_at, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
        supplier_party_id: {type: string, format: uuid}
        supplier_name: {type: string}
        order_date: {type: string, format: date}
        expected_date: {type: [string, 'null'], format: date}
        status: {$ref: '#/components/schemas/PurchaseOrderStatus'}
        goods_amount: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        total_amount: {$ref: '#/components/schemas/Money'}
        note: {type: [string, 'null']}
        close_reason_id: {type: [string, 'null'], format: uuid}
        closed_at: {type: [string, 'null'], format: date-time}
        confirmed_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
        ordered_base_qty: {$ref: '#/components/schemas/Qty', description: Lists only.}
        received_base_qty: {$ref: '#/components/schemas/Qty', description: Lists only.}
        pending_base_qty: {$ref: '#/components/schemas/Qty', description: Lists only.}
        days_late: {type: integer, description: Late orders only.}
        lines:
          type: array
          description: Single order only.
          items: {$ref: '#/components/schemas/PurchaseOrderLine'}
    ReceiptCondition:
      type: string
      enum: [accepted, damaged, wrong_item, excess]
    ReceiptRequest:
      type: object
      required: [lines]
      properties:
        supplier_party_id: {type: [string, 'null'], format: uuid, description: Required without a purchase order.}
        purchase_order_id: {type: [string, 'null'], format: uuid}
        business_date: {type: [string, 'null'], format: date, description: Default today; never in the future.}
        due_date: {type: [string, 'null'], format: date, description: Default the business date plus the supplier's payment terms.}
        note: {type: [string, 'null'], maxLength: 500}
        paid_now_amount: {$ref: '#/components/schemas/Money'}
        payment_method_id: {type: [string, 'null'], format: uuid, description: Required with a positive paid_now_amount.}
        schedule:
          type: array
          description: Installments of what stays open after paid_now_amount; they must add up to it.
          items:
            type: object
            required: [due_date, amount]
            properties:
              due_date: {type: string, format: date}
              amount: {$ref: '#/components/schemas/Money'}
        use_advances:
          type: array
          description: Earlier supplier advances (open outgoing payments) to settle the payable with.
          items:
            type: object
            required: [payment_id, amount]
            properties:
              payment_id: {type: string, format: uuid}
              amount: {$ref: '#/components/schemas/Money'}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [qty]
            properties:
              purchase_order_line_id: {type: [string, 'null'], format: uuid, description: 'Takes the SKU, unit, color and price of the order line.'}
              sku_id: {type: string, format: uuid, description: Required without an order line or new_product.}
              new_product: {$ref: '#/components/schemas/NewProductRequest'}
              unit_id: {type: [string, 'null'], format: uuid}
              qty: {$ref: '#/components/schemas/Qty'}
              color_id: {type: [string, 'null'], format: uuid}
              condition: {$ref: '#/components/schemas/ReceiptCondition'}
              lot_no: {type: string, maxLength: 64}
              expiry_date: {type: [string, 'null'], format: date}
              unit_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
              discount_amount: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
              spec_text: {type: [string, 'null'], maxLength: 500, description: 'Free "Quy cách" note; empty keeps the order line''s, else the SKU''s.'}
    ReceiptLine:
      type: object
      required: [id, line_no, purchase_order_line_id, sku_id, sku_code, name, variant_label, unit_id, unit_name, unit_factor, qty, base_qty,
        color_id, spec_text, condition, lot_no, expiry_date, lot_id, unit_price, discount_amount, tax_rate, line_amount,
        landed_cost_amount, unit_cost, returned_base_qty, returnable_base_qty]
      properties:
        id: {type: string, format: uuid}
        line_no: {type: integer}
        purchase_order_line_id: {type: [string, 'null'], format: uuid}
        sku_id: {type: string, format: uuid}
        sku_code: {type: string}
        name: {type: string}
        variant_label: {type: string}
        unit_id: {type: string, format: uuid}
        unit_name: {type: string}
        unit_factor: {$ref: '#/components/schemas/Decimal'}
        qty: {$ref: '#/components/schemas/Qty'}
        base_qty: {$ref: '#/components/schemas/Qty'}
        color_id: {type: [string, 'null'], format: uuid}
        spec_text: {type: [string, 'null']}
        condition: {$ref: '#/components/schemas/ReceiptCondition'}
        lot_no: {type: string}
        expiry_date: {type: [string, 'null'], format: date}
        lot_id: {type: [string, 'null'], format: uuid, description: Null for a wrong_item line.}
        unit_price: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money'}
        tax_rate: {$ref: '#/components/schemas/Decimal'}
        line_amount: {$ref: '#/components/schemas/Money'}
        landed_cost_amount: {$ref: '#/components/schemas/Money'}
        unit_cost: {$ref: '#/components/schemas/Money', description: 'Cost per base unit, tax and landed cost included.'}
        returned_base_qty: {$ref: '#/components/schemas/Qty'}
        returnable_base_qty: {$ref: '#/components/schemas/Qty', description: What a purchase return may still take from the line.}
    Payable:
      type: object
      required: [id, amount, settled_amount, open_amount, due_date, status, reversed_on, schedule]
      properties:
        id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        settled_amount: {$ref: '#/components/schemas/Money'}
        open_amount: {$ref: '#/components/schemas/Money'}
        due_date: {type: string, format: date}
        status: {type: string}
        reversed_on: {type: [string, 'null'], format: date}
        schedule:
          type: array
          items:
            type: object
            required: [due_date, amount]
            properties:
              due_date: {type: string, format: date}
              amount: {$ref: '#/components/schemas/Money'}
    ProcurementAttachment:
      type: object
      required: [id, file_name, content_type, size_bytes, scan_status, created_at]
      properties:
        id: {type: string, format: uuid}
        file_name: {type: string}
        content_type: {type: string}
        size_bytes: {type: integer}
        scan_status: {type: string}
        created_at: {type: string, format: date-time}
    ReceiptListItem:
      allOf:
        - $ref: '#/components/schemas/Receipt'
        - type: object
          required: [supplier_document_id, supplier_document_no, open_amount]
          properties:
            supplier_document_id: {type: [string, 'null'], format: uuid, description: The latest supplier invoice matched to the receipt.}
            supplier_document_no: {type: [string, 'null']}
            open_amount: {$ref: '#/components/schemas/Money', description: What is still owed on the receipt's payable.}
    Receipt:
      type: object
      required: [id, doc_no, warehouse_id, supplier_party_id, supplier_name, purchase_order_id, business_date, goods_amount, discount_amount,
        tax_amount, landed_cost_amount, total_amount, paid_now_amount, due_date, status, note, reversal_of, posted_at, posted_by]
      properties:
        id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
        warehouse_id: {type: string, format: uuid}
        supplier_party_id: {type: string, format: uuid}
        supplier_name: {type: string}
        purchase_order_id: {type: [string, 'null'], format: uuid}
        purchase_order_doc_no: {type: [string, 'null'], description: Single receipt and lists.}
        business_date: {type: string, format: date}
        goods_amount: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        landed_cost_amount: {$ref: '#/components/schemas/Money'}
        total_amount: {$ref: '#/components/schemas/Money'}
        paid_now_amount: {$ref: '#/components/schemas/Money'}
        due_date: {type: [string, 'null'], format: date}
        status: {type: string, enum: [posted, reversed]}
        note: {type: [string, 'null']}
        reversal_of: {type: [string, 'null'], format: uuid, description: Set on a reversal receipt.}
        reversal_doc_no: {type: [string, 'null'], description: The reversal of a reversed receipt (single receipt only).}
        posted_at: {type: string, format: date-time}
        posted_by: {type: string, format: uuid}
        lines: {type: array, description: Single receipt only., items: {$ref: '#/components/schemas/ReceiptLine'}}
        payable: {$ref: '#/components/schemas/Payable'}
        payments:
          type: array
          items:
            type: object
            required: [id, doc_no, amount, business_date, status]
            properties:
              id: {type: string, format: uuid}
              doc_no: {$ref: '#/components/schemas/DocNo'}
              amount: {$ref: '#/components/schemas/Money'}
              business_date: {type: string, format: date}
              status: {type: string}
        landed_costs: {type: array, items: {$ref: '#/components/schemas/LandedCost'}}
        attachments: {type: array, items: {$ref: '#/components/schemas/ProcurementAttachment'}}
    LandedCostRequest:
      type: object
      required: [cost_type, amount]
      properties:
        cost_type: {type: string, enum: [shipping, loading, other]}
        description: {type: [string, 'null'], maxLength: 500}
        amount: {$ref: '#/components/schemas/Money'}
        method: {type: string, enum: [by_value, by_qty], default: by_value}
        payee_party_id: {type: [string, 'null'], format: uuid, description: The carrier owed the cost; none when it was paid outside.}
        due_date: {type: [string, 'null'], format: date, description: Needs a payee.}
        paid_now_amount: {$ref: '#/components/schemas/Money'}
        payment_method_id: {type: [string, 'null'], format: uuid}
    LandedCost:
      type: object
      required: [id, receipt_id, cost_type, description, amount, method, payee_party_id, business_date, posted_at]
      properties:
        id: {type: string, format: uuid}
        receipt_id: {type: string, format: uuid}
        cost_type: {type: string, enum: [shipping, loading, other]}
        description: {type: [string, 'null']}
        amount: {$ref: '#/components/schemas/Money'}
        method: {type: string, enum: [by_value, by_qty]}
        payee_party_id: {type: [string, 'null'], format: uuid}
        business_date: {type: string, format: date}
        posted_at: {type: string, format: date-time}
        lines:
          type: array
          items:
            type: object
            required: [receipt_line_id, amount, on_hand_amount, sold_amount]
            properties:
              receipt_line_id: {type: string, format: uuid}
              amount: {$ref: '#/components/schemas/Money'}
              on_hand_amount: {$ref: '#/components/schemas/Money'}
              sold_amount: {$ref: '#/components/schemas/Money'}
    SupplierDocumentRequest:
      type: object
      required: [supplier_party_id, document_no, document_date, goods_amount]
      properties:
        supplier_party_id: {type: string, format: uuid}
        document_no: {type: string, minLength: 1, maxLength: 64}
        document_date: {type: string, format: date}
        goods_amount: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        total_amount: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: Default goods plus tax; must equal it.}
        note: {type: [string, 'null'], maxLength: 500}
        receipt_ids: {type: array, maxItems: 500, uniqueItems: true, items: {type: string, format: uuid}}
    SupplierDocument:
      type: object
      required: [id, supplier_party_id, supplier_name, document_no, document_date, goods_amount, tax_amount, total_amount, match_status,
        variance_amount, note, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        supplier_party_id: {type: string, format: uuid}
        supplier_name: {type: string}
        document_no: {type: string}
        document_date: {type: string, format: date}
        goods_amount: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        total_amount: {$ref: '#/components/schemas/Money'}
        match_status: {type: string, enum: [unmatched, matched, variance]}
        variance_amount: {$ref: '#/components/schemas/Money', description: Document total minus the matched receipt totals.}
        note: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
        receipts:
          type: array
          items:
            type: object
            required: [receipt_id, doc_no, business_date, matched_amount]
            properties:
              receipt_id: {type: string, format: uuid}
              doc_no: {$ref: '#/components/schemas/DocNo'}
              business_date: {type: string, format: date}
              matched_amount:
                $ref: '#/components/schemas/Money'
                description: >-
                  What the store owes for the receipt: its total moved by its price adjustments. Purchase returns are not
                  subtracted; the supplier invoices them separately, against the return's credit note.
        attachments: {type: array, items: {$ref: '#/components/schemas/ProcurementAttachment'}}
    PurchaseReturnRequest:
      type: object
      required: [receipt_id, reason_id, settlement, lines]
      properties:
        receipt_id: {type: string, format: uuid}
        reason_id: {type: string, format: uuid, description: An active purchase_return reason.}
        settlement:
          type: string
          enum: [credit_payable, refund, replacement]
          description: >-
            Every settlement records a credit note for the returned amount. credit_payable applies it to the receipt's
            payable; refund leaves the payable as it is and the credit note is what the supplier pays back; replacement
            applies it to the receipt's payable now, and the replacement goods arrive on a new receipt at the original
            price, which records a new payable, so the total owed to the supplier ends where it was.
        business_date: {type: [string, 'null'], format: date}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
