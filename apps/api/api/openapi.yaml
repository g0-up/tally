                  count: {type: integer, minimum: 0}
        '401':
          $ref: '#/components/responses/Error'
  /notifications/{id}:read:
    post:
      tags: [notifications]
      operationId: readNotification
      summary: Mark a notification as read
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /notifications/{id}:resolve:
    post:
      tags: [notifications]
      operationId: resolveNotification
      summary: Resolve a notification
      description: A notification the owner resolved stays resolved while its condition holds.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /notifications/{id}:snooze:
    post:
      tags: [notifications]
      operationId: snoozeNotification
      summary: Hide a notification until a time within the next 30 days
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: {type: string, format: date-time}
      responses:
        '200':
          description: Notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: notification_resolved.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /reports:
    get:
      tags: [reporting]
      operationId: listReports
      summary: The report catalogue
      description: Every report with its range kind, group-bys, filters and columns, so a client can build its controls.
      responses:
        '200':
          description: Reports.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ReportSpec'}}
        '401':
          $ref: '#/components/responses/Error'
  /reports/dashboard:
    get:
      tags: [reporting]
      operationId: getDashboard
      summary: Cash and debt dashboard for a period
      description: |
        Cash in and out by fund, receivables and payables with the top parties, a series by
        sub-period and the period's cash entries, each beside the previous period. Opening
        declarations and opening debt balances are not period movements; a walk-in sale has no
        customer and never appears as debt.
      parameters:
        - {name: period, in: query, required: false, schema: {type: string, enum: [day, 7d, month, year], default: month}}
        - {name: date, in: query, required: false, schema: {type: string, format: date}, description: A day inside the period; today by default.}
      responses:
        '200':
          description: Dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /reports/suggestions/{kind}:
    get:
      tags: [reporting]
      operationId: getReportSuggestions
      summary: Buy or clearance suggestions
      description: The same table as `/reports/buy_suggestions` or `/reports/clearance_suggestions`.
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [buy, clearance]}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Report table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTable'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: report_unknown.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
  /reports/{reportKey}:
    get:
      tags: [reporting]
      operationId: runReport
      summary: Run a report
      description: |
        Runs one report of the catalogue (`GET /reports`); the key may be written with hyphens
        (`cash-forecast`). Report parameters are query parameters: `from`/`to` for a period report,
        `as_of` for a balance report, `days` for a forecast, `group_by`, `columns` (comma separated)
        and the report's filters (for example `customer_ids`, a comma-separated list of up to 100
        customers, on revenue). Every cell is a decimal or date string, or null. Revenue counts
        posted sales documents net of returns, never order or invoice totals; gross margin is
        labelled provisional while a cost recalculation is pending.
      parameters:
        - {name: reportKey, in: path, required: true, schema: {type: string}, description: 'A key of the catalogue, written with underscores or hyphens.'}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: as_of, in: query, required: false, schema: {type: string, format: date}}
        - {name: days, in: query, required: false, schema: {type: integer, minimum: 1}}
        - {name: group_by, in: query, required: false, schema: {type: string}}
        - {name: columns, in: query, required: false, schema: {type: string}, description: Comma-separated column keys.}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Report table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTable'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: report_unknown.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, range_too_long or invalid_cursor.
          $ref: '#/components/responses/Error'
  /saved-reports:
    get:
      tags: [reporting]
      operationId: listSavedReports
      summary: Saved report layouts, by name
      parameters:
        - {name: report_key, in: query, required: false, schema: {$ref: '#/components/schemas/ReportKey'}}
      responses:
        '200':
          description: Saved layouts.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SavedReport'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags: [reporting]
      operationId: createSavedReport
      summary: Save a report layout under a name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_key, name]
              properties:
                report_key: {$ref: '#/components/schemas/ReportKey'}
                name: {type: string, maxLength: 120}
                config: {$ref: '#/components/schemas/ReportConfig'}
      responses:
        '201':
          description: Saved layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          description: report_unknown.
          $ref: '#/components/responses/Error'
        '409':
          description: saved_report_name_taken.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /saved-reports/{id}:
    patch:
      tags: [reporting]
      operationId: updateSavedReport
      summary: Rename a saved layout or change its configuration
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 120}
                config: {$ref: '#/components/schemas/ReportConfig'}
      responses:
        '200':
          description: Saved layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: saved_report_name_taken.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags: [reporting]
      operationId: deleteSavedReport
      summary: Delete a saved layout
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /export-jobs:
    get:
      tags: [reporting]
      operationId: listExportJobs
      summary: The signed-in user's export jobs, newest first
      description: Report CSVs and full data exports alike, so a screen can find a job again after a reload.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of export jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ExportJob'}}
                  next_cursor: {oneOf: [{$ref: '#/components/schemas/Cursor'}, {type: 'null'}]}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [reporting]
      operationId: createExportJob
      summary: Export a report to a spreadsheet in the background
      description: |
        Queues an export of the whole report (every page) with the given parameters, checked like a
        report run. When it finishes, an `export_ready` notification links to the download, which
        stays available for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_key]
              properties:
                report_key: {$ref: '#/components/schemas/ReportKey'}
                params: {type: object, additionalProperties: {type: string}}
      responses:
        '202':
          description: Queued export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          description: report_unknown.
          $ref: '#/components/responses/Error'
        '409':
          description: export_queue_full.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or range_too_long.
          $ref: '#/components/responses/Error'
  /export-jobs/{id}:
    get:
      tags: [reporting]
      operationId: getExportJob
      summary: One export and its state
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Export; `download_path` is set while the file can be downloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /export-jobs/{id}/download:
    get:
      tags: [reporting]
      operationId: downloadExportJob
      summary: Redirect to a short-lived link of the export file
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '302':
          description: Redirect to the file.
          headers:
            Location:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, const: no-store}
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: export_not_ready.
          $ref: '#/components/responses/Error'
        '410':
          description: export_expired.
          $ref: '#/components/responses/Error'
  /export-jobs/{id}:cancel:
    post:
      tags: [reporting]
      operationId: cancelExportJob
      summary: Cancel a queued or running export
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Cancelled export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: export_status_invalid.
          $ref: '#/components/responses/Error'
  /analytics/questions:
    get:
      tags: [analytics]
      operationId: listAnalyticsQuestions
      summary: Questions asked of the assistant, newest first
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of questions with their answers.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AnalyticsQuery'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [analytics]
      operationId: askAnalyticsQuestion
      summary: Ask the assistant a question about the store's figures
      description: |
        The assistant answers only from the report catalogue, reading reports under the same rules
        as `GET /reports/{reportKey}`; it never sees customer names or phones. Each answer cites the
        reports it read with their parameters and the document numbers it names. Needs the AI
        feature on the store's plan and its own setting turned on; that is checked before the
        question itself. One question may take at most 45 seconds; past that the question is
        logged unanswered and the call fails with 504 `ai_timeout`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string, minLength: 1, maxLength: 500}
      responses:
        '201':
          description: The question with its answer and citations; `answer` is null when the assistant could not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsQuery'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: feature_disabled (the plan, the setting or the provider is off), support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_question.
          $ref: '#/components/responses/Error'
        '504':
          description: ai_timeout, the assistant did not answer in time.
          $ref: '#/components/responses/Error'
  /plans:
    get:
      tags: [billing]
      operationId: listPlans
      summary: Plans a store can subscribe to
      responses:
        '200':
          description: Active plans with their modules, limits and published terms.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Plan'}}
        '401':
          $ref: '#/components/responses/Error'
  /subscription:
    get:
      tags: [billing]
      operationId: getSubscription
      summary: The store's subscription, its plan and what it allows today
      description: |
        `subscription` and `plan` are null for a store without a subscription (a sandbox, or a store
        created before billing), which is unrestricted. The status shown is the one in effect today,
        even before the daily lifecycle job has stored it. `addons` lists the paid add-ons whose
        period holds the store's business day (in the store's time zone), from the same records that
        enable their modules in `entitlements`; it is empty for a store without a subscription, and
        an add-on whose invoice is not paid yet is not in it.
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionView'
        '401':
          $ref: '#/components/responses/Error'
  /entitlements:
    get:
      tags: [billing]
      operationId: getEntitlements
      summary: Modules, limits and posting rights of the store today
      description: |
        Hiding a module in the client is cosmetic: the server answers 403 module_not_in_plan to a
        module route the plan does not include, 403 subscription_read_only to a posting while the
        store is read-only and 409 plan_limit_reached past a limit.
      responses:
        '200':
          description: Entitlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401':
          $ref: '#/components/responses/Error'
  /subscription:preview-change:
    post:
      tags: [billing]
      operationId: previewSubscriptionChange
      summary: Price a move to another plan without changing anything
      description: |
        A move within the current period is prorated by the days left, the change day included; a
        lapsed subscription is priced for a new period starting today. An add-on plan (kind
        `addon`) is quoted with purpose `addon` for its own period, apart from the subscription: a
        period of that add-on running through today or later is extended, so the new period starts
        the day after it ends; otherwise it starts today. The quote carries the terms the owner
        accepts with `POST /subscription:change`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChangeRequest'
      responses:
        '200':
          description: Quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangeQuote'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: subscription_missing, subscription_state_invalid or sandbox_not_billable.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (`plan_id` unknown, inactive or a trial).
          $ref: '#/components/responses/Error'
  /subscription:change:
    post:
      tags: [billing]
      operationId: changeSubscription
      summary: Ask for another plan; issues the invoice of the change
      description: |
        Issues an open service invoice priced as `POST /subscription:preview-change` quotes it,
        voiding the store's other open plan invoice, or for an add-on its open invoice of the same
        add-on (open invoices of other add-ons stay payable). The plan changes when the invoice is
        paid; a free invoice is paid at once. Buying an add-on plan (kind `addon`) issues an invoice
        with purpose `addon` that, once paid, enables the add-on's modules for its period without
        touching the subscription; the period starts the day after the add-on's period live on the
        payment day ends, or on the payment day when none is. A read-only store may change plan
        and pay. Needs a password re-entered within 5 minutes (`POST /auth/reauth`).
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`
        and issues nothing.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChangeRequest'
      responses:
        '201':
          description: Invoice of the change; open, or paid when free.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaasInvoice'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required or support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: >-
            subscription_missing, subscription_state_invalid, sandbox_not_billable, tenant_closed,
            idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid, validation_failed or terms_not_accepted.
          $ref: '#/components/responses/Error'
  /saas-invoices:
    get:
      tags: [billing]
      operationId: listSaasInvoices
      summary: Service invoices of the store, newest first
      responses:
        '200':
          description: Invoices.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SaasInvoice'}}
        '401':
          $ref: '#/components/responses/Error'
  /saas-invoices/{id}:
    get:
      tags: [billing]
      operationId: getSaasInvoice
      summary: One service invoice
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaasInvoice'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /saas-invoices/{id}:pay:
    post:
      tags: [billing]
      operationId: paySaasInvoice
      summary: Payment instructions of an open invoice
      description: |
        Changes nothing: the invoice is paid when the provider calls back
        (`POST /webhooks/saas-payments/{provider}`) or an operator records a bank transfer. The body
        is optional; the provider defaults to the manual bank transfer.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: {type: string, maxLength: 40, examples: [manual_transfer]}
      responses:
        '200':
          description: Instructions.
          content:
            application/json:
              schema:
                type: object
                required: [invoice, provider, instructions]
                properties:
                  invoice: {$ref: '#/components/schemas/SaasInvoice'}
                  provider: {type: string}
                  instructions: {type: string}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: invoice_not_open.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (`provider` unknown).
          $ref: '#/components/responses/Error'
  /data-exports:
    post:
      tags: [billing]
      operationId: requestDataExport
      summary: Export every record of the store (re-authentication required)
      description: |
        Queues a zip with one CSV per store table (UTF-8 with BOM) and a README. It is followed with
        `GET /export-jobs/{id}` and downloaded from `GET /export-jobs/{id}/download` for 7 days. A
        read-only store may still export; a closed store may not. Needs a password re-entered within
        5 minutes (`POST /auth/reauth`). A retry with the same Idempotency-Key answers the first
        response with `Idempotent-Replay: true` and queues nothing.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: Queued export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only or export_not_allowed.
          $ref: '#/components/responses/Error'
        '409':
          description: export_queue_full, idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid, or invalid_json for a body that is not JSON.
          $ref: '#/components/responses/Error'
  /account-closure:
    get:
      tags: [billing]
      operationId: getAccountClosure
      summary: The latest closure request and its export
      responses:
        '200':
          description: Closure state; both fields are null when the store never asked to close.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountClosureView'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [billing]
      operationId: requestAccountClosure
      summary: Ask to close the store (re-authentication required)
      description: |
        E-mails the owner a one-time link (`/settings/account-closure?token=`). Asking again while a
        request waits for its link re-sends it; a verified request must be cancelled first.
      responses:
        '202':
          description: Request waiting for its e-mailed link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountClosureRequest'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: closure_state_invalid or sandbox_not_billable.
          $ref: '#/components/responses/Error'
  /account-closure:verify:
    post:
      tags: [billing]
      operationId: verifyAccountClosure
      summary: Confirm the closure with the e-mailed token (re-authentication required)
      description: |
        Queues the full data export and starts the 30-day wait (`waiting_until`); the store keeps
        working and may cancel until then. Within about an hour after the wait ends (unless the
        store is under legal hold) the closure moves to `exporting`: the store only reads (403
        `subscription_read_only` on postings), it can no longer be cancelled, and a final export is
        queued (`export.final`). A failed final export is queued again until three of them failed
        (`export.failed_attempts`); the closure then stops at `export_failed`, still read-only, until
        an operator retries it. Once the final export succeeded the store closes (`completed`) and
        the owner is e-mailed a link (`GET /account-closure/export`) that downloads it, without
        signing in, until the export's `expires_at`. No data is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, maxLength: 200}
      responses:
        '200':
          description: Waiting request with its export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountClosureRequest'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: closure_state_invalid.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or token_invalid.
          $ref: '#/components/responses/Error'
  /account-closure:cancel:
    post:
      tags: [billing]
      operationId: cancelAccountClosure
      summary: Cancel the closure before it takes its final export
      responses:
        '200':
          description: Cancelled request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountClosureRequest'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: closure_state_invalid.
          $ref: '#/components/responses/Error'
  /account-closure/export:
    get:
      tags: [billing]
      operationId: downloadAccountClosureExport
      summary: Download the final export of a closed store with its e-mailed link
      description: |
        Opened from the link mailed when the store closed (or re-sent by an operator); needs no
        session, since a closed store has none. The link works on its store's host, as often as
        needed, until the export's `expires_at`; a re-sent link replaces the earlier ones. Answers
        a short-lived redirect to the file. Rate limited per client address.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string, maxLength: 200}
      responses:
        '302':
          description: Redirect to the file.
          headers:
            Location:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, const: no-store}
        '404':
          description: closure_link_not_found (unknown, replaced or expired link, or another store's host).
          $ref: '#/components/responses/Error'
        '409':
          description: export_not_ready (the export is no longer available).
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /webhooks/saas-payments/{provider}:
    post:
      tags: [billing]
      operationId: receiveSaasPayment
      summary: Payment callback of a payment provider (root host)
      description: |
        Authenticated by the `X-Tally-Signature` header, `sha256=` and the hex HMAC-SHA256 of the raw
        body with the provider's shared secret; no session or CSRF token. Each event applies once:
        a repeated `event_id` answers 200 with `duplicate: true` and changes nothing, so the
        provider stops retrying. A payment marks the invoice paid and extends the period once; another
        event for an invoice already paid is a second payment and is refused like a payment of a void
        invoice.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string}
        - name: X-Tally-Signature
          in: header
          required: true
          schema: {type: string, pattern: '^sha256=[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, invoice_number, amount]
              properties:
                event_id: {type: string, maxLength: 200}
                invoice_number: {type: string}
                amount: {$ref: '#/components/schemas/Money'}
                reference: {type: string}
      responses:
        '200':
          description: Applied, or a repeated event.
          content:
            application/json:
              schema:
                type: object
                required: [duplicate]
                properties:
                  duplicate: {type: boolean}
        '403':
          description: signature_invalid.
          $ref: '#/components/responses/Error'
        '404':
          description: provider_unknown, or no invoice has the number.
          $ref: '#/components/responses/Error'
        '409':
          description: invoice_not_open (the invoice is void, for instance by a completed closure, or already paid by another event; the refused payment is recorded for operators to refund), amount_mismatch or tenant_closed.
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (the body is not a valid event).
          $ref: '#/components/responses/Error'
  /support-tickets:
    get:
      tags: [support]
      operationId: listSupportTickets
      summary: Support tickets of the store, newest first
      responses:
        '200':
          description: Tickets.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SupportTicket'}}
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [support]
      operationId: createSupportTicket
      summary: Ask the support team for help
      description: |
        Support never asks for a password or a one-time code: a message that looks like one is
        refused with 422 possible_password unless `acknowledge_warning` is true. Files are added
        with later messages (`POST /attachments` with owner_type support_ticket). A read-only store
        can still open tickets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: {type: string, maxLength: 200}
                body: {type: string, maxLength: 10000}
                priority: {type: string, enum: [low, normal, high, urgent], default: normal}
                acknowledge_warning: {type: boolean, default: false}
      responses:
        '201':
          description: The ticket with its first message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketView'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: forbidden (only the owner) or support_read_only.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or possible_password.
          $ref: '#/components/responses/Error'
  /support-tickets/{id}:
    get:
      tags: [support]
      operationId: getSupportTicket
      summary: One support ticket with its messages
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketView'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /support-tickets/{id}/messages:
    post:
      tags: [support]
      operationId: addSupportTicketMessage
      summary: Reply on a support ticket
      description: |
        `attachment_ids` are completed attachments of the ticket (owner_type support_ticket). The
        password check of `POST /support-tickets` applies.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 10000}
                attachment_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}}
                acknowledge_warning: {type: boolean, default: false}
      responses:
        '201':
          description: Message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketMessage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: forbidden (only the owner) or support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: ticket_closed.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (`attachment_ids` not completed files of the ticket) or possible_password.
          $ref: '#/components/responses/Error'
  /support-sessions:
    get:
      tags: [support]
      operationId: listSupportSessions
      summary: Support sessions the owner granted, newest first
      responses:
        '200':
          description: Sessions with their state now.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SupportSession'}}
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [support]
      operationId: grantSupportSession
      summary: Let the ticket's support agent read chosen modules (re-authentication required)
      description: |
        The admin assigned to the ticket may read, never change, the chosen modules until the
        session expires (2 hours by default, at most 8) or the owner revokes it. Files, the
        notification inbox and the AI assistant are never part of a support view. Every page the
        agent opens lands in the store's audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_id, modules]
              properties:
                ticket_id: {type: string, format: uuid}
                modules:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {$ref: '#/components/schemas/SupportViewModule'}
                hours: {type: integer, minimum: 1, maximum: 8, default: 2}
      responses:
        '201':
          description: Active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSession'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required, forbidden (only the owner) or support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          description: The ticket is not the store's.
          $ref: '#/components/responses/Error'
        '409':
          description: ticket_closed or ticket_not_assigned.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed.
          $ref: '#/components/responses/Error'
  /support-sessions/{id}:revoke:
    post:
      tags: [support]
      operationId: revokeSupportSession
      summary: End a support session now
      description: Revoking an ended session changes nothing.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSession'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: forbidden (only the owner) or support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /onboarding:
    get:
      tags: [onboarding]
      operationId: getOnboarding
      summary: The set-up checklist, its progress and the opening totals to confirm
      description: |
        `totals` is set once the opening cutoff date is set in the store settings; those are the
        stock, debt, advances and fund balances at the end of that day.
      responses:
        '200':
          description: Checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding'
        '401':
          $ref: '#/components/responses/Error'
  /onboarding/steps/{stepKey}:complete:
    post:
      tags: [onboarding]
      operationId: completeOnboardingStep
      summary: Complete a checklist step (re-authentication required for confirm_opening_balances)
      description: |
        first_sale completes with the store's first POS sale and cannot be completed by hand.
        confirm_opening_balances needs the opening stock, debt and cash steps done and a recent
        password: it confirms the totals and locks every period up to the cutoff date, so nothing
        can be posted on or before it (423 period_locked). The lock only moves forward. Completing a
        completed step changes nothing.
      parameters:
        - $ref: '#/components/parameters/OnboardingStepKey'
      responses:
        '200':
          description: Step; confirm_opening_balances also returns the confirmed `totals`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStep'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required (confirm_opening_balances), support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          description: Unknown step.
          $ref: '#/components/responses/Error'
        '409':
          description: confirmation_required, step_not_manual or onboarding_steps_pending.
          $ref: '#/components/responses/Error'
        '422':
          description: opening_cutoff_required or opening_cutoff_in_future.
          $ref: '#/components/responses/Error'
  /onboarding/steps/{stepKey}:skip:
    post:
      tags: [onboarding]
      operationId: skipOnboardingStep
      summary: Skip a step that may be skipped (catalog_setup, first_sale)
      parameters:
        - $ref: '#/components/parameters/OnboardingStepKey'
      responses:
        '200':
          description: Step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStep'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          description: Unknown step.
          $ref: '#/components/responses/Error'
        '409':
          description: step_not_skippable.
          $ref: '#/components/responses/Error'
  /feedback:
    post:
      tags: [service]
      operationId: submitFeedback
      summary: Send product feedback (owner)
      description: |
        Holds the kind, score, text and screen path only; the query and fragment of `page_path` are
        dropped since they may carry search terms or record ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [idea, bug, praise, nps]}
                score: {type: [integer, 'null'], minimum: 0, maximum: 10, description: Required for nps.}
                body: {type: string, maxLength: 2000, description: Required except for nps.}
                page_path: {type: string, maxLength: 300, examples: [/pos]}
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed.
          $ref: '#/components/responses/Error'
  /status:
    get:
      tags: [service]
      operationId: getServiceStatus
      summary: Public service status and current incidents
      description: Open incidents and those resolved in the last 7 days. Cached for 30 seconds.
      security: []
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tally_session
      description: Session cookie (`tally_session` in plain-http development).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit token equal to the `__Host-tally_csrf` cookie; required on unsafe methods.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes a create safe to retry. The first request with a key creates and stores its response;
        a retry with the same key and body answers that response with `Idempotent-Replay: true`, and
        the same key with another body is refused (409 idempotency_key_reused). Without the header
        each request creates.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    OnboardingStepKey:
      name: stepKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OnboardingStepKey'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Resource version as returned in the `ETag` header.
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable snake_case machine code, e.g. `credit_limit_exceeded`.
          examples: [validation_failed]
        message:
          type: string
          description: Human-readable message, safe to display.
        fields:
          type: object
          description: Field path to reason code, for validation errors.
          additionalProperties:
            type: string
        exception_kind:
          type: string
          description: Set on 409 exception_required; the owner may confirm the exception and retry.
    Money:
      type: string
      description: Amount in VND as a plain decimal string, at most 4 fractional digits.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      examples: ['15000', '12500.5']
    Qty:
      type: string
      description: Quantity as a plain decimal string, at most 4 fractional digits.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      examples: ['12', '0.5']
    Cursor:
      type: string
      description: Opaque pagination cursor returned as `next_cursor`.
    DocNo:
      type: string
      description: Gap-free document number, prefix plus sequence.
      pattern: '^[A-Z]{2,3}-[0-9]{4,}$'
      examples: [PN-0001, HD-0042]
    ColorCode:
      type: string
      description: Code of one of the seven fixed colors; an uncolored item has no color code.
      enum: [xanh, do, tim, vang, nau, den, trang]
    HostContext:
      type: object
      required: [kind, root_url, csrf_token]
      properties:
        kind: {type: string, enum: [root, tenant, admin]}
        root_url: {type: string, format: uri}
        admin_url: {type: string, format: uri, description: Only on the admin host.}
        csrf_token: {type: string}
    SignupRequest:
      type: object
      required: [email, password, full_name, store_name, slug]
      properties:
        email: {type: string, format: email, maxLength: 254}
        phone:
          type: string
          maxLength: 30
          description: Optional Vietnamese phone number of the owner; it can then be used to sign in. Stored as 0xxxxxxxxx.
        password: {type: string, minLength: 8, maxLength: 256}
        full_name: {type: string, maxLength: 200}
        store_name: {type: string, maxLength: 200}
        slug:
          type: string
          description: Store address, lowercase ASCII letters, digits and single hyphens, 3 to 30 characters.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 30
        referral_code:
          type: string
          maxLength: 40
          description: Partner code of the sign-up link, if any; an unknown code is ignored.
    SlugCheck:
      type: object
      required: [available, reason, suggestion]
      properties:
        available: {type: boolean}
        reason: {type: [string, 'null'], enum: [invalid, reserved, taken, null]}
        suggestion: {type: [string, 'null'], description: A free address close to the input.}
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    TokenPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string, maxLength: 128}
        password: {type: string, minLength: 8, maxLength: 256}
    CSRFToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: {type: string, description: 'New token, also stored in the CSRF cookie.'}
    AuthResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [signed_in, mfa_required]}
        challenge: {type: string, description: With mfa_required; valid 5 minutes.}
        csrf_token: {type: string, description: With signed_in; bound to the new session.}
        expires_at: {type: string, format: date-time, description: With signed_in; absolute session expiry.}
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Ten one-time codes, shown only once.
          items: {type: string}
    Session:
      type: object
      required: [id, device_label, ip, created_at, last_seen_at, expires_at, mfa_verified, reauthenticated_at, current]
      properties:
        id: {type: string, format: uuid}
        device_label: {type: string, examples: [Chrome trên Windows]}
        ip: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        mfa_verified: {type: boolean}
        reauthenticated_at: {type: [string, 'null'], format: date-time}
        current: {type: boolean}
    Me:
      type: object
      required: [user, tenant, session, server_time]
      properties:
        user:
          type: object
          required: [id, email, full_name, phone, status, mfa_enabled, email_verified_at, last_login_at]
          properties:
            id: {type: string, format: uuid}
            email: {type: string, format: email}
            full_name: {type: string}
            phone: {type: [string, 'null']}
            status: {type: string, enum: [pending, active, disabled]}
            mfa_enabled: {type: boolean}
            email_verified_at: {type: [string, 'null'], format: date-time}
            last_login_at: {type: [string, 'null'], format: date-time}
        tenant:
          type: object
          required: [id, slug, display_name, status, is_sandbox, sandbox_of]
          properties:
            id: {type: string, format: uuid}
            slug: {type: string}
            display_name: {type: string}
            status: {type: string}
            is_sandbox: {type: boolean}
            sandbox_of: {type: [string, 'null'], format: uuid}
        session:
          $ref: '#/components/schemas/Session'
        server_time:
          type: string
          format: date-time
          description: The server's clock in the store's time zone, for screens that must not trust the device clock.
    Tenant:
      type: object
      required: [id, slug, legal_name, display_name, tax_code, address, phone, currency, timezone, date_format,
        status, is_sandbox, sandbox_of, opening_cutoff_date, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        legal_name: {type: string}
        display_name: {type: string}
        tax_code: {type: [string, 'null']}
        address: {type: [string, 'null']}
        phone: {type: [string, 'null']}
        currency: {type: string, const: VND}
        timezone: {type: string, examples: [Asia/Saigon]}
        date_format: {type: string, examples: [dd/MM/yyyy]}
        status: {type: string}
        is_sandbox: {type: boolean}
        sandbox_of: {type: [string, 'null'], format: uuid}
        opening_cutoff_date: {type: [string, 'null'], format: date}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    Settings:
      type: object
      required: [prices_include_tax, rounding_mode, default_payment_terms_days, block_expired_lot_sale, expiry_warning_days,
        offline_pos_enabled, offline_pos_max_amount, offline_pos_max_hours, analytics_ai_enabled, product_analytics_enabled,
        updated_at, version]
      properties:
        prices_include_tax: {type: boolean}
        rounding_mode: {type: string}
        default_payment_terms_days: {type: integer}
        block_expired_lot_sale: {type: boolean}
        expiry_warning_days: {type: integer}
        offline_pos_enabled: {type: boolean}
        offline_pos_max_amount: {$ref: '#/components/schemas/Money'}
        offline_pos_max_hours: {type: integer}
        analytics_ai_enabled: {type: boolean}
        product_analytics_enabled: {type: boolean}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    PeriodLockEvent:
      type: object
      required: [id, action, locked_through, reason, actor_id, created_at]
      properties:
        id: {type: string, format: uuid}
        action: {type: string, enum: [lock, reopen]}
        locked_through:
          type: [string, 'null']
          format: date
          description: Null only on a reopen that removed the lock entirely.
        reason: {type: [string, 'null']}
        actor_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    ExceptionKind:
      type: string
      enum: [credit_limit_exceeded, below_min_price, stock_disposal, count_variance, debt_write_off, expired_lot_sale,
        quarantine_release, period_reopen]
    ExceptionConfirmation:
      type: object
      required: [id, kind, doc_type, doc_id, doc_version, payload_hash, impact, note, confirmed_by, confirmed_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/ExceptionKind'}
        doc_type: {type: string}
        doc_id: {type: string, format: uuid}
        doc_version: {type: integer}
        payload_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        impact: {type: [object, 'null']}
        note: {type: [string, 'null']}
        confirmed_by: {type: string, format: uuid}
        confirmed_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    AuditEvent:
      type: object
      required: [id, actor_type, actor_id, action, entity_type, entity_id, doc_no, before, after, source, request_id, ip, created_at]
      properties:
        id: {type: string, format: uuid}
        actor_type: {type: string, enum: [owner, support, system, platform_admin]}
        actor_id: {type: [string, 'null'], format: uuid}
        action: {type: string, examples: [session.create, tenant.transfer_owner, period.reopen]}
        entity_type: {type: string}
        entity_id: {type: [string, 'null'], format: uuid}
        doc_no: {type: [string, 'null']}
        before: {type: [object, 'null']}
        after: {type: [object, 'null']}
        source: {type: string}
        request_id: {type: [string, 'null']}
        ip: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    Attachment:
      type: object
      required: [id, owner_type, owner_id, file_name, content_type, size_bytes, sha256, scan_status, version_no, uploaded_by, created_at]
      properties:
        id: {type: string, format: uuid}
        owner_type: {type: string}
        owner_id: {type: string, format: uuid}
        file_name: {type: string}
        content_type: {type: string}
        size_bytes: {type: integer}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        scan_status: {type: string}
        version_no: {type: integer}
        uploaded_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    Decimal:
      type: string
      description: Factor or percent as a plain decimal string.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      examples: ['24', '8', '0.5']
    ReasonKind:
      type: string
      enum: [sales_return, purchase_return, damage, loss, gift, internal_use, count_variance, disposal, write_off, close_short,
        price_adjustment, debt_adjustment, reopen, return_without_source]
    Reason:
      type: object
      required: [id, kind, name, is_system, active, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/ReasonKind'}
        name: {type: string}
        is_system: {type: boolean, description: Built-in; can be renamed or deactivated but not deleted.}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
    Color:
      type: object
      required: [id, code, name, hex, sort_order, is_system, active]
      properties:
        id: {type: string, format: uuid}
        code: {$ref: '#/components/schemas/ColorCode'}
        name: {type: string}
        hex: {type: string, pattern: '^#[0-9A-Fa-f]{6}$'}
        sort_order: {type: integer}
        is_system: {type: boolean}
        active: {type: boolean}
    Unit:
      type: object
      required: [id, name, active, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
    UnitRequest:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        active: {type: boolean}
    TaxRate:
      type: object
      required: [id, name, rate_percent, active, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        rate_percent: {$ref: '#/components/schemas/Decimal'}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
    TaxRateRequest:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        rate_percent: {$ref: '#/components/schemas/Decimal'}
        active: {type: boolean}
    AttributeDataType:
      type: string
      enum: [text, number, boolean, date, select, multiselect]
    AttributeOption:
      type: object
      required: [id, attribute_id, label, sort_order, active]
      properties:
        id: {type: string, format: uuid}
        attribute_id: {type: string, format: uuid}
        label: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
    AttributeOptionRequest:
      type: object
      properties:
        label: {type: string, maxLength: 100}
        sort_order: {type: integer, minimum: 0}
        active: {type: boolean}
    Attribute:
      type: object
      required: [id, code, name, data_type, unit_label, is_filterable, is_searchable, status, options, created_at, updated_at,
        version]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        data_type: {$ref: '#/components/schemas/AttributeDataType'}
        unit_label: {type: [string, 'null']}
        is_filterable: {type: boolean}
        is_searchable: {type: boolean}
        status: {type: string, enum: [active, inactive]}
        options: {type: array, items: {$ref: '#/components/schemas/AttributeOption'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    AttributeResult:
      allOf:
        - $ref: '#/components/schemas/Attribute'
        - type: object
          required: [warnings]
          properties:
            warnings: {type: array, items: {type: string}, description: 'Consequences the owner should know, e.g. a filter removed.'}
    AttributeRequest:
      type: object
      description: On create `code`, `name` and `data_type` are required; the code never changes afterwards.
      properties:
        code: {type: string, pattern: '^[a-z][a-z0-9_]{0,39}$'}
        name: {type: string, maxLength: 100}
        data_type: {$ref: '#/components/schemas/AttributeDataType'}
        unit_label: {type: [string, 'null']}
        is_filterable: {type: boolean}
        is_searchable: {type: boolean}
        status: {type: string, enum: [active, inactive]}
        options: {type: array, items: {type: string}, description: First option labels (create only).}
    AttributeSetItem:
      type: object
      required: [attribute_id, attribute_code, attribute_name, is_required, sort_order]
      properties:
        attribute_id: {type: string, format: uuid}
        attribute_code: {type: string}
        attribute_name: {type: string}
        is_required: {type: boolean}
        sort_order: {type: integer}
    AttributeSetItemRequest:
      type: object
      required: [attribute_id]
      properties:
        attribute_id: {type: string, format: uuid}
        is_required: {type: boolean}
        sort_order: {type: integer, minimum: 0}
    AttributeSet:
      type: object
      required: [id, name, active, items, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        active: {type: boolean}
        items: {type: array, items: {$ref: '#/components/schemas/AttributeSetItem'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AttributeSetRequest:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        active: {type: boolean}
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/AttributeSetItemRequest'}}
    Category:
      type: object
      required: [id, parent_id, name, attribute_set_id, sort_order, active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
        attribute_set_id: {type: [string, 'null'], format: uuid}
        sort_order: {type: integer}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CategoryRequest:
      type: object
      description: The tree has at most four levels. Nullable fields take null to clear them.
      properties:
        name: {type: string, maxLength: 100}
        parent_id: {type: [string, 'null'], format: uuid}
        attribute_set_id: {type: [string, 'null'], format: uuid}
        sort_order: {type: integer, minimum: 0}
        active: {type: boolean}
    ProductType:
      type: string
      enum: [goods, material, kit, combo]
    ProductStatus:
      type: string
      enum: [draft, active, inactive]
    Product:
      type: object
      required: [id, type, name, category_id, attribute_set_id, attributes, description, status, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/ProductType'}
        name: {type: string}
        category_id: {type: [string, 'null'], format: uuid}
        attribute_set_id: {type: [string, 'null'], format: uuid}
        attributes: {type: object, description: Attribute code to value.}
        description: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/ProductStatus'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [variant_axes, skus, images]
          properties:
            variant_axes: {type: array, items: {$ref: '#/components/schemas/VariantAxis'}}
            skus: {type: array, items: {$ref: '#/components/schemas/SkuDetail'}}
            images: {type: array, items: {$ref: '#/components/schemas/ProductImage'}}
    ProductImage:
      type: object
      required: [id, product_id, sku_id, attachment_id, sort_order, created_at]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        sku_id: {type: [string, 'null'], format: uuid}
        attachment_id: {type: string, format: uuid}
        sort_order: {type: integer}
        created_at: {type: string, format: date-time}
    VariantAxis:
      type: object
      required: [position, attribute]
      properties:
        position: {type: integer, minimum: 1, maximum: 3}
        attribute: {$ref: '#/components/schemas/Attribute'}
    SkuFields:
      type: object
      required: [base_unit_id]
      properties:
        base_unit_id: {type: string, format: uuid}
        qty_scale: {type: integer, minimum: 0, maximum: 4, description: Decimals allowed in quantities.}
        track_lot: {type: boolean}
        track_expiry: {type: boolean}
        ref_cost: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        min_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        min_stock: {$ref: '#/components/schemas/Qty'}
        tax_rate_id: {type: [string, 'null'], format: uuid}
        spec_text: {type: [string, 'null'], maxLength: 200}
        status: {type: string, enum: [active, inactive]}
    VariantRequest:
      type: object
      required: [option_ids]
      properties:
        option_ids: {type: array, items: {type: string, format: uuid}, description: Chosen options of the axes.}
        code_prefix: {type: string, description: Prefix of generated SKU codes.}
        codes:
          type: object
          description: Variant key to an explicit SKU code.
          additionalProperties: {type: string}
        defaults: {$ref: '#/components/schemas/SkuFields'}
    VariantRow:
      type: object
      required: [variant_key, variant_label, display_name, option_ids, code, sku_id, exists]
      properties:
        variant_key: {type: string}
        variant_label: {type: string}
        display_name: {type: string}
        option_ids: {type: array, items: {type: string, format: uuid}}
        code: {type: string}
        sku_id: {type: [string, 'null'], format: uuid}
        exists: {type: boolean}
    VariantResult:
      type: object
      required: [created, existing]
      properties:
        created: {type: array, items: {$ref: '#/components/schemas/SkuDetail'}}
        existing: {type: integer, description: Rows of the matrix that already had a SKU.}
    Sku:
      type: object
      required: [id, product_id, code, variant_key, display_name, variant_label, base_unit_id, qty_scale, track_lot, track_expiry,
        ref_cost, min_price, min_stock, tax_rate_id, spec_text, status, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        code: {type: string}
        variant_key: {type: string}
        display_name: {type: string}
        variant_label: {type: string}
        base_unit_id: {type: string, format: uuid}
        qty_scale: {type: integer}
        track_lot: {type: boolean}
        track_expiry: {type: boolean}
        ref_cost: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        min_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        min_stock: {$ref: '#/components/schemas/Qty'}
        tax_rate_id: {type: [string, 'null'], format: uuid}
        spec_text: {type: [string, 'null']}
        status: {type: string, enum: [active, inactive]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    SkuListItem:
      description: |
        A SKU row of the product and purchasing lists. Prices are the base-unit retail and wholesale
        prices; stock and cost are summed over the tenant's warehouses.
      allOf:
        - $ref: '#/components/schemas/Sku'
        - type: object
          required: [product_type, category_id, category_name, units, barcode, retail_price, wholesale_price,
            has_color_prices, on_hand, sellable, avg_cost, last_purchase_price, in_mix_group, on_hand_by_color]
          properties:
            product_type: {$ref: '#/components/schemas/ProductType'}
            category_id: {type: [string, 'null'], format: uuid}
            category_name: {type: [string, 'null']}
            units: {type: array, items: {$ref: '#/components/schemas/SkuUnit'}}
            barcode: {type: [string, 'null'], description: The first barcode.}
            retail_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
            wholesale_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
            has_color_prices: {type: boolean, description: Some color has its own retail or wholesale price.}
            on_hand: {$ref: '#/components/schemas/Qty'}
            sellable: {$ref: '#/components/schemas/Qty'}
            avg_cost: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
            last_purchase_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: Unit price per base unit of the latest posted receipt line.}
            in_mix_group: {type: boolean}
            on_hand_by_color:
              type: array
              items:
                type: object
                required: [color_id, qty]
                properties:
                  color_id: {type: [string, 'null'], format: uuid}
                  qty: {$ref: '#/components/schemas/Qty'}
    SkuDetail:
      allOf:
        - $ref: '#/components/schemas/Sku'
        - type: object
          required: [units, barcodes, option_ids]
          properties:
            units: {type: array, items: {$ref: '#/components/schemas/SkuUnit'}}
            barcodes: {type: array, items: {$ref: '#/components/schemas/Barcode'}}
            option_ids: {type: array, items: {type: string, format: uuid}}
    SkuUnit:
      type: object
      required: [unit_id, unit_name, factor, is_base, active, is_default_sale, is_default_purchase]
      properties:
        unit_id: {type: string, format: uuid}
        unit_name: {type: string}
        factor: {$ref: '#/components/schemas/Decimal'}
        is_base: {type: boolean}
        active: {type: boolean}
        is_default_sale: {type: boolean}
        is_default_purchase: {type: boolean}
    SkuUnitRequest:
      type: object
      properties:
        factor: {type: string, description: 'Base units in one of this unit, a positive decimal.'}
        active: {type: boolean}
        is_default_sale: {type: boolean}
        is_default_purchase: {type: boolean}
    Barcode:
      type: object
      required: [id, unit_id, code, created_at]
      properties:
        id: {type: string, format: uuid}
        unit_id: {type: string, format: uuid}
        code: {type: string}
        created_at: {type: string, format: date-time}
    MixGroupItem:
      type: object
      required: [sku_id, sku_code, sku_name, flavor_label, sort_order, active]
      properties:
        sku_id: {type: string, format: uuid}
        sku_code: {type: string}
        sku_name: {type: string}
        flavor_label: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
    MixGroup:
      type: object
      required: [id, name, pack_unit_id, units_per_pack, part_unit_id, units_per_part, piece_unit_id, source_product_id, status,
        items, usage, used_sku_ids, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        pack_unit_id: {type: string, format: uuid}
        units_per_pack: {type: integer}
        part_unit_id: {type: string, format: uuid}
        units_per_part: {type: integer}
        piece_unit_id: {type: string, format: uuid}
        source_product_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [active, inactive]}
        items: {type: array, items: {$ref: '#/components/schemas/MixGroupItem'}}
        usage:
          type: array
          description: Documents that use the group, per kind ("hóa đơn", "báo giá" …). Once used, the pack spec is fixed.
          items:
            type: object
            required: [label, count]
            properties:
              label: {type: string}
              count: {type: integer}
        used_sku_ids:
          type: array
          description: Flavors documents already used; they cannot be removed from the group.
          items: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    MixGroupRequest:
      type: object
      required: [name, pack_unit_id, units_per_pack, part_unit_id, units_per_part, items]
      properties:
        name: {type: string, maxLength: 200}
        pack_unit_id: {type: string, format: uuid}
        units_per_pack: {type: integer, minimum: 1}
        part_unit_id: {type: string, format: uuid}
        units_per_part: {type: integer, minimum: 1}
        source_product_id: {type: [string, 'null'], format: uuid}
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [sku_id, flavor_label]
            properties:
              sku_id: {type: string, format: uuid}
              flavor_label: {type: string}
              active: {type: boolean, default: true}
    SearchItem:
      type: object
      required: [kind, id, code, label, sublabel, unit, price_hint, on_hand_by_color]
      properties:
        kind: {type: string, enum: [sku, customer, supplier]}
        id: {type: string, format: uuid}
        code: {type: string, description: 'SKU code, or the tax code of a customer or supplier (empty when none).'}
        label: {type: string}
        sublabel: {type: [string, 'null'], description: Spec text of a SKU; phone or address of a partner.}
        unit: {type: [string, 'null']}
        price_hint: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        on_hand_by_color:
          type: array
          items:
            type: object
            required: [color_id, qty]
            properties:
              color_id: {type: [string, 'null'], format: uuid}
              qty: {$ref: '#/components/schemas/Qty'}
    PartyKind:
      type: string
      enum: [person, organization]
    Party:
      type: object
      required: [id, kind, name, phone, email, tax_code, address, note, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid, description: The partner; a customer and a supplier may share it.}
        kind: {$ref: '#/components/schemas/PartyKind'}
        name: {type: string}
        phone: {type: [string, 'null']}
        email: {type: [string, 'null']}
        tax_code: {type: [string, 'null']}
        address: {type: [string, 'null']}
        note: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    PartyRequest:
      type: object
      description: Nullable texts take null to clear them.
      properties:
        kind: {$ref: '#/components/schemas/PartyKind'}
        name: {type: string, maxLength: 200}
        phone: {type: [string, 'null'], maxLength: 30}
        email: {type: [string, 'null'], format: email, maxLength: 254}
        tax_code: {type: [string, 'null'], pattern: '^[0-9]{10}(-[0-9]{3})?$'}
        address: {type: [string, 'null'], maxLength: 500}
        note: {type: [string, 'null'], maxLength: 2000}
    DuplicateWarning:
      type: object
      required: [party_id, name, matches, is_customer, is_supplier]
      properties:
        party_id: {type: string, format: uuid}
        name: {type: string}
        matches: {type: array, items: {type: string, enum: [phone, tax_code, name]}}
        is_customer: {type: boolean}
        is_supplier: {type: boolean}
    Customer:
      allOf:
        - $ref: '#/components/schemas/Party'
        - type: object
          required: [customer_group_id, customer_group_name, credit_limit, payment_terms_days, status, is_supplier]
          properties:
            customer_group_id: {type: string, format: uuid}
            customer_group_name: {type: string}
            credit_limit: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: Null means no limit.}
            payment_terms_days: {type: integer}
            status: {type: string, enum: [active, inactive]}
            is_supplier: {type: boolean}
    CustomerListItem:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          required: [last_purchase_at, consents]
          properties:
            last_purchase_at:
              type: [string, 'null']
              format: date-time
              description: When the latest sales document of the customer that is not reversed was posted.
            consents:
              type: array
              description: The current consent per channel and purpose; a pair never recorded is closed and absent.
              items:
                type: object
                required: [channel, purpose, granted, recorded_at]
                properties:
                  channel: {$ref: '#/components/schemas/ConsentChannel'}
                  purpose: {$ref: '#/components/schemas/ConsentPurpose'}
                  granted: {type: boolean}
                  recorded_at: {type: string, format: date-time}
    CustomerResult:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          required: [duplicate_warnings]
          properties:
            duplicate_warnings: {type: array, items: {$ref: '#/components/schemas/DuplicateWarning'}}
    CustomerRequest:
      allOf:
        - $ref: '#/components/schemas/PartyRequest'
        - type: object
          properties:
            party_id: {type: string, format: uuid, description: Create only; reuse an existing supplier.}
            customer_group_id: {type: string, format: uuid, description: Defaults to the retail group.}
            credit_limit: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
            payment_terms_days: {type: integer, minimum: 0}
            status: {type: string, enum: [active, inactive]}
    Supplier:
      allOf:
        - $ref: '#/components/schemas/Party'
        - type: object
          required: [payment_terms_days, supplied_goods_note, status, is_customer]
          properties:
            payment_terms_days: {type: integer}
            supplied_goods_note: {type: [string, 'null']}
            status: {type: string, enum: [active, inactive]}
            is_customer: {type: boolean}
    SupplierListItem:
      description: A supplier row of the supplier list with its trading activity.
      allOf:
        - $ref: '#/components/schemas/Supplier'
        - type: object
          required: [contact_name, order_count, last_receipt_date, payable_open, can_stop, can_delete]
          properties:
            contact_name: {type: [string, 'null'], description: 'The primary contact, else the first one.'}
            order_count: {type: integer, description: Purchase orders of any status.}
            last_receipt_date: {type: [string, 'null'], format: date, description: Business date of the latest receipt not reversed.}
            payable_open: {$ref: '#/components/schemas/Money'}
            can_stop: {type: boolean, description: No purchase order is confirmed or partially received.}
            can_delete: {type: boolean, description: No document references the supplier.}
    SupplierResult:
      allOf:
        - $ref: '#/components/schemas/Supplier'
        - type: object
          required: [duplicate_warnings]
          properties:
            duplicate_warnings: {type: array, items: {$ref: '#/components/schemas/DuplicateWarning'}}
    SupplierRequest:
      allOf:
        - $ref: '#/components/schemas/PartyRequest'
        - type: object
          properties:
            party_id: {type: string, format: uuid, description: Create only; reuse an existing customer.}
            payment_terms_days: {type: integer, minimum: 0}
            supplied_goods_note: {type: [string, 'null']}
    CustomerGroup:
      type: object
      required: [id, name, base_price_kind, is_system, active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        base_price_kind: {type: string, enum: [retail, wholesale]}
        is_system: {type: boolean}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CustomerGroupRequest:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        base_price_kind: {type: string, enum: [retail, wholesale]}
        active: {type: boolean}
    Contact:
      type: object
      required: [id, party_id, name, phone, email, role_title, is_primary, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        party_id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: [string, 'null']}
        email: {type: [string, 'null']}
        role_title: {type: [string, 'null']}
        is_primary: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ContactRequest:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        phone: {type: [string, 'null'], maxLength: 30}
        email: {type: [string, 'null'], format: email, maxLength: 254}
        role_title: {type: [string, 'null'], maxLength: 100}
        is_primary: {type: boolean}
    Address:
      type: object
      required: [id, party_id, label, address_line, is_default, created_at]
      properties:
        id: {type: string, format: uuid}
        party_id: {type: string, format: uuid}
        label: {type: string}
        address_line: {type: string}
        is_default: {type: boolean}
        created_at: {type: string, format: date-time}
    AddressRequest:
      type: object
      properties:
        label: {type: string, maxLength: 100}
        address_line: {type: string, maxLength: 500}
        is_default: {type: boolean}
    PriceListKind:
      type: string
      description: retail and wholesale are the base lists; a customer group's base_price_kind picks one.
      enum: [retail, wholesale, group, customer, season]
    PriceList:
      type: object
      required: [id, name, kind, customer_group_id, party_id, campaign_id, priority, valid_from, valid_to, active,
        item_count, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {$ref: '#/components/schemas/PriceListKind'}
        customer_group_id: {type: [string, 'null'], format: uuid}
        party_id: {type: [string, 'null'], format: uuid}
        campaign_id: {type: [string, 'null'], format: uuid}
        priority: {type: integer, description: Lower wins among lists of the same level.}
        valid_from: {type: [string, 'null'], format: date}
        valid_to: {type: [string, 'null'], format: date, description: Last day the list applies.}
        active: {type: boolean}
        item_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    PriceListRequest:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        kind:
          allOf: [{$ref: '#/components/schemas/PriceListKind'}]
          description: Create only; a base kind only recreates a missing base list.
        customer_group_id: {type: string, format: uuid, description: Create only; required for a group list.}
        party_id: {type: string, format: uuid, description: Create only; the customer of a customer list.}
        priority: {type: integer, minimum: 0, maximum: 10000}
        valid_from: {type: [string, 'null'], format: date}
        valid_to: {type: [string, 'null'], format: date}
        active: {type: boolean}
    PriceListItem:
      type: object
      required: [id, price_list_id, sku_id, sku_code, sku_name, color_id, color_name, unit_id, unit_name, min_qty, price,
        created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        price_list_id: {type: string, format: uuid}
        sku_id: {type: string, format: uuid}
        sku_code: {type: string}
        sku_name: {type: string}
        color_id: {type: [string, 'null'], format: uuid, description: Null for the general price of every color.}
        color_name: {type: [string, 'null']}
        unit_id: {type: [string, 'null'], format: uuid, description: Null for the base unit.}
        unit_name: {type: [string, 'null']}
        min_qty: {$ref: '#/components/schemas/Qty'}
        price: {$ref: '#/components/schemas/Money'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PriceListItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [sku_id, price]
            properties:
              sku_id: {type: string, format: uuid}
              color_id: {type: [string, 'null'], format: uuid}
              unit_id: {type: [string, 'null'], format: uuid}
              min_qty: {$ref: '#/components/schemas/Qty'}
              price:
                description: Null removes the row.
                oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]
    PriceChangeSource:
      type: string
      description: Screen a price was changed from.
      enum: [catalog, purchase_order, product_list, inventory, price_list]
    SalePriceRequest:
      type: object
      required: [kind, price, source]
      properties:
        kind: {type: string, enum: [retail, wholesale]}
        color_id: {type: [string, 'null'], format: uuid}
        unit_id: {type: [string, 'null'], format: uuid, description: Defaults to the base unit.}
        apply_all_colors: {type: boolean, description: Not allowed with color_id.}
        price:
          description: Null removes the price of color_id.
          oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]
        source: {$ref: '#/components/schemas/PriceChangeSource'}
        source_doc_id: {type: [string, 'null'], format: uuid}
    PriceChange:
      type: object
      required: [id, price_list_id, price_list_name, price_list_kind, sku_id, sku_code, sku_name, color_id, color_name, scope_label, unit_id,
        unit_name, min_qty, old_price, new_price, source, source_doc_id, actor_id, actor_name, created_at]
      properties:
        id: {type: string, format: uuid}
        price_list_id: {type: string, format: uuid}
        price_list_name: {type: string}
        price_list_kind: {$ref: '#/components/schemas/PriceListKind'}
        sku_id: {type: string, format: uuid}
        sku_code: {type: string}
        sku_name: {type: string}
        color_id: {type: [string, 'null'], format: uuid}
        color_name: {type: [string, 'null']}
        scope_label: {type: string, description: 'The color name, or the general-price label.'}
        unit_id: {type: [string, 'null'], format: uuid}
        unit_name: {type: [string, 'null']}
        min_qty: {$ref: '#/components/schemas/Qty'}
        old_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        new_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        source: {$ref: '#/components/schemas/PriceChangeSource'}
        source_doc_id: {type: [string, 'null'], format: uuid}
        actor_id: {type: string, format: uuid}
        actor_name: {type: [string, 'null'], description: Full name of the user who made the change.}
        created_at: {type: string, format: date-time}
    AppliedPromotion:
      type: object
      required: [id, code, name, kind, amount]
      properties:
        id: {type: string, format: uuid}
        code: {type: [string, 'null']}
        name: {type: string}
        kind: {$ref: '#/components/schemas/PromotionKind'}
        amount: {$ref: '#/components/schemas/Money'}
    PriceSource:
      type: object
      description: Where a line price came from; snapshotted on the document line.
      required: [kind, price_list_id, price_list_name, color_id, unit_id, min_qty, promotions]
      properties:
        kind: {type: string, enum: [customer_list, group_list, season_list, base_list, manual]}
        price_list_id: {type: [string, 'null'], format: uuid}
        price_list_name: {type: [string, 'null']}
        color_id: {type: [string, 'null'], format: uuid, description: Color of the matched row; null for the general row.}
        unit_id: {type: [string, 'null'], format: uuid, description: Unit of the matched row; null for the base unit.}
        min_qty: {oneOf: [{$ref: '#/components/schemas/Qty'}, {type: 'null'}]}
        promotions: {type: array, items: {$ref: '#/components/schemas/AppliedPromotion'}}
    ResolvedPrice:
      type: object
      required: [amount, unit_id, unit_factor, base_qty, price_source]
      properties:
        amount: {$ref: '#/components/schemas/Money'}
        unit_id: {type: string, format: uuid}
        unit_factor: {$ref: '#/components/schemas/Decimal'}
        base_qty: {$ref: '#/components/schemas/Qty'}
        price_source: {$ref: '#/components/schemas/PriceSource'}
    QuoteRequest:
      type: object
      required: [lines]
      properties:
        party_id: {type: [string, 'null'], format: uuid, description: Null for a walk-in buyer.}
        customer_group_id: {type: [string, 'null'], format: uuid, description: Used when there is no party.}
        business_date: {type: [string, 'null'], format: date, description: Defaults to today in the store's time zone.}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [sku_id, qty]
            properties:
              sku_id: {type: string, format: uuid}
              color_id: {type: [string, 'null'], format: uuid}
              unit_id: {type: [string, 'null'], format: uuid, description: Defaults to the base unit.}
              qty: {$ref: '#/components/schemas/Qty'}
    CalculateRequest:
      type: object
      required: [lines]
      properties:
        party_id: {type: [string, 'null'], format: uuid}
        customer_group_id: {type: [string, 'null'], format: uuid}
        business_date: {type: [string, 'null'], format: date}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [sku_id, qty]
            properties:
              sku_id: {type: string, format: uuid}
              color_id: {type: [string, 'null'], format: uuid}
              unit_id: {type: [string, 'null'], format: uuid}
              qty: {$ref: '#/components/schemas/Qty'}
              unit_price:
                description: A typed price; null resolves the list price.
                oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]
              discount_amount:
                description: Line discount in money.
                oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]
        order_discount:
          description: Order discount in money, allocated to lines by value.
          oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]
        promotion_codes: {type: [array, 'null'], maxItems: 10, items: {type: string}}
    CalculatedLine:
      type: object
      required: [draft_index, line_kind, sku_id, color_id, unit_id, unit_factor, qty, base_qty, unit_price, gross_amount,
        discount_amount, order_discount_alloc, tax_rate_snap, tax_amount, line_amount, net_unit_price, min_price_snap,
        below_min_price, price_source]
      properties:
        draft_index: {type: [integer, 'null'], description: The request line priced; null for a gift line.}
        line_kind: {type: string, enum: [item, gift]}
        sku_id: {type: string, format: uuid}
        color_id: {type: [string, 'null'], format: uuid}
        unit_id: {type: string, format: uuid}
        unit_factor: {$ref: '#/components/schemas/Decimal'}
        qty: {$ref: '#/components/schemas/Qty'}
        base_qty: {$ref: '#/components/schemas/Qty'}
        unit_price: {$ref: '#/components/schemas/Money'}
        gross_amount: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money', description: Line discount plus line promotions.}
        order_discount_alloc: {$ref: '#/components/schemas/Money'}
        tax_rate_snap: {$ref: '#/components/schemas/Decimal'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        line_amount: {$ref: '#/components/schemas/Money'}
        net_unit_price: {$ref: '#/components/schemas/Money'}
        min_price_snap: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        below_min_price: {type: boolean}
        price_source: {$ref: '#/components/schemas/PriceSource'}
    SkippedPromotion:
      type: object
      required: [id, code, name, kind, reason]
      properties:
        id: {type: string, format: uuid}
        code: {type: [string, 'null']}
        name: {type: string}
        kind: {$ref: '#/components/schemas/PromotionKind'}
        reason:
          type: string
          enum: [not_stackable, lower_benefit, below_min_order, no_eligible_lines, no_benefit, max_discount_too_low,
            customer_group, usage_limit_reached, inactive, not_started, expired]
    CalculatedDocument:
      type: object
      required: [business_date, prices_include_tax, rounding_mode, lines, goods_amount, discount_amount, tax_amount,
        total_amount, promotions, skipped_promotions]
      properties:
        business_date: {type: string, format: date}
        prices_include_tax: {type: boolean}
        rounding_mode: {type: string, enum: [line, document]}
        lines: {type: array, items: {$ref: '#/components/schemas/CalculatedLine'}}
        goods_amount: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        total_amount: {$ref: '#/components/schemas/Money'}
        promotions: {type: array, items: {$ref: '#/components/schemas/AppliedPromotion'}}
        skipped_promotions: {type: array, items: {$ref: '#/components/schemas/SkippedPromotion'}}
    PromotionKind:
      type: string
      enum: [line_percent, line_amount, order_percent, order_amount, gift, combo_price]
    PromotionStatus:
      type: string
      enum: [draft, active, inactive]
    PromotionItem:
      type: object
      required: [id, role, sku_id, sku_code, sku_name, qty]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [eligible, gift, combo_component]}
        sku_id: {type: string, format: uuid}
        sku_code: {type: string}
        sku_name: {type: string}
        qty: {$ref: '#/components/schemas/Qty'}
    Promotion:
      type: object
      required: [id, code, name, kind, value, max_discount, min_order_amount, stackable, customer_group_id, campaign_id,
        valid_from, valid_to, usage_limit, used_count, status, items, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        code: {type: [string, 'null'], description: Null for an automatic promotion.}
        name: {type: string}
        kind: {$ref: '#/components/schemas/PromotionKind'}
        value: {$ref: '#/components/schemas/Money', description: 'Percent, amount or combo price by kind.'}
        max_discount: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        min_order_amount: {$ref: '#/components/schemas/Money'}
        stackable: {type: boolean}
        customer_group_id: {type: [string, 'null'], format: uuid}
        campaign_id: {type: [string, 'null'], format: uuid}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date}
        usage_limit: {type: [integer, 'null']}
        used_count: {type: integer}
        status: {$ref: '#/components/schemas/PromotionStatus'}
        items: {type: array, items: {$ref: '#/components/schemas/PromotionItem'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    PromotionRequest:
      type: object
      properties:
        code: {type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{3,32}$', description: Stored upper-case.}
        name: {type: string, maxLength: 100}
        kind: {$ref: '#/components/schemas/PromotionKind'}
        value: {$ref: '#/components/schemas/Money'}
        max_discount: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        min_order_amount: {$ref: '#/components/schemas/Money'}
        stackable: {type: boolean}
        customer_group_id: {type: [string, 'null'], format: uuid}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date}
        usage_limit: {type: [integer, 'null'], minimum: 1}
        status: {$ref: '#/components/schemas/PromotionStatus'}
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [role, sku_id]
            properties:
              role: {type: string, enum: [eligible, gift, combo_component]}
              sku_id: {type: string, format: uuid}
              qty: {$ref: '#/components/schemas/Qty'}
    CodeCheck:
      type: object
      required: [code, valid, reason, promotion]
      properties:
        code: {type: string, description: The normalized code.}
        valid: {type: boolean}
        reason:
          type: string
          description: Empty for a usable code.
          enum: ['', not_found, inactive, not_started, expired, usage_limit_reached, customer_group]
        promotion:
          description: Set only for a usable code.
          oneOf: [{$ref: '#/components/schemas/Promotion'}, {type: 'null'}]
    DebtDirection:
      type: string
      description: receivable (the party owes the store) or payable (the store owes the party).
      enum: [receivable, payable]
    ContactChannel:
      type: string
      enum: [phone, sms, zalo, email, in_person]
    AllocationMode:
      type: string
      description: auto_earmarked is set by the system for deposits earmarked to an invoice.
      enum: [manual, suggested_oldest_due, auto_earmarked]
    AllocationLine:
      type: object
      required: [obligation_id, amount]
      properties:
        obligation_id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        mode:
          type: string
          enum: [manual, suggested_oldest_due]
          default: manual
    Allocation:
      type: object
      required: [obligation_id, amount, mode]
      properties:
        obligation_id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        mode: {$ref: '#/components/schemas/AllocationMode'}
    Settlement:
      type: object
      description: Append-only; a reversal is a negative row pointing at the row it reverses.
      required: [id, obligation_id, settled_by_type, settled_by_id, amount, business_date, allocation_mode, reversal_of, posted_at]
      properties:
        id: {type: string, format: uuid}
        obligation_id: {type: string, format: uuid}
        settled_by_type: {type: string, enum: [payment, credit_note, debt_offset, debt_adjustment, obligation_reversal]}
        settled_by_id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        business_date: {type: string, format: date}
        allocation_mode: {$ref: '#/components/schemas/AllocationMode'}
        reversal_of: {type: [string, 'null'], format: uuid}
        posted_at: {type: string, format: date-time}
    PaymentPurpose:
      type: string
      enum: [settlement, advance, deposit, refund, advance_refund, opening_advance]
    PaymentRequest:
      type: object
      required: [direction, purpose, payment_method_id, amount]
      properties:
        direction: {type: string, enum: [in, out], description: 'in is a receipt PT, out a payment PC.'}
        party_id: {type: [string, 'null'], format: uuid}
        purpose: {$ref: '#/components/schemas/PaymentPurpose'}
        payment_method_id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        source_type: {type: string, enum: [pos, invoice, debt, sales_return, exchange, purchase, landed_cost]}
        source_id: {type: [string, 'null'], format: uuid}
        earmarked_invoice_id: {type: [string, 'null'], format: uuid}
        reference: {type: string, maxLength: 100}
        note: {type: string, maxLength: 1000}
        allocations:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/AllocationLine'}
        opening_date:
          type: [string, 'null']
          format: date
          description: Cutoff date of an opening advance (default the store's opening cutoff).
    Payment:
      type: object
      required: [id, doc_no, direction, party_id, purpose, fund_account_id, payment_method_id, amount, allocated_amount, unallocated, status, business_date, posted_at, version]
      properties:
        id: {type: string, format: uuid}
        doc_no: {$ref: '#/components/schemas/DocNo'}
        direction: {type: string, enum: [in, out]}
        party_id: {type: [string, 'null'], format: uuid}
        purpose: {$ref: '#/components/schemas/PaymentPurpose'}
        fund_account_id: {type: string, format: uuid}
        payment_method_id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        allocated_amount: {$ref: '#/components/schemas/Money'}
        unallocated:
          $ref: '#/components/schemas/Money'
          description: The advance left on a confirmed payment.
        status: {type: string, enum: [pending_verification, confirmed, reversed]}
        earmarked_invoice_id: {type: [string, 'null'], format: uuid}
        source_type: {type: [string, 'null']}
        source_id: {type: [string, 'null'], format: uuid}
        business_date: {type: string, format: date}
        reference: {type: [string, 'null']}
        note: {type: [string, 'null']}
        refund_of: {type: [string, 'null'], format: uuid}
        planned_allocations:
          type: array
          description: Allocations a pending payment applies when confirmed.
          items: {$ref: '#/components/schemas/Allocation'}
        posted_at: {type: string, format: date-time}
        confirmed_at: {type: [string, 'null'], format: date-time}
        reversed_on: {type: [string, 'null'], format: date}
        version: {type: integer}
    PaymentResult:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required: [settlements]
          properties:
            settlements: {type: array, items: {$ref: '#/components/schemas/Settlement'}}
    PendingPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required: [party_name, method_name]
          properties:
            party_name: {type: [string, 'null']}
            method_name: {type: string}
    DocumentSettlement:
      allOf:
        - $ref: '#/components/schemas/Settlement'
        - type: object
          required: [obligation_doc_no]
          properties:
            obligation_doc_no: {type: string, description: Number of the document the settlement settled.}
    PaymentDetail:
      allOf:
        - $ref: '#/components/schemas/PendingPayment'
        - type: object
          required: [settlements]
          properties:
            settlements: {type: array, items: {$ref: '#/components/schemas/DocumentSettlement'}}
    Installment:
      type: object
      required: [installment_no, due_date, amount]
      properties:
        installment_no: {type: integer, minimum: 1}
        due_date: {type: string, format: date}
        amount: {$ref: '#/components/schemas/Money'}
    Obligation:
      type: object
      required: [id, party_id, direction, source_type, source_id, source_doc_no, business_date, due_date, amount, settled_amount, open, status, reversed_on, reversal_reason, reversal_doc_no, version]
      properties:
        id: {type: string, format: uuid}
        party_id: {type: string, format: uuid}
        direction: {$ref: '#/components/schemas/DebtDirection'}
        source_type:
          type: string
          enum: [sales_document, receipt, landed_cost_allocation, purchase_price_adjustment, debt_adjustment, opening_balance, refund_due, debt_offset]
        source_id: {type: string, format: uuid}
        source_doc_no: {type: string}
        business_date: {type: string, format: date}
        due_date: {type: string, format: date}
        amount: {$ref: '#/components/schemas/Money'}
        settled_amount:
          $ref: '#/components/schemas/Money'
          description: Sum of the document's settlements.
        open:
          $ref: '#/components/schemas/Money'
          description: amount − settled_amount.
        status: {type: string, enum: [open, settled]}
        reversed_on:
          type: [string, 'null']
          format: date
          description: Set when the source document was reversed; the obligation is then closed by an obligation_reversal settlement and the payments that settled it are advances again.
        reversal_reason: {type: [string, 'null']}
        reversal_doc_no: {type: [string, 'null'], description: 'Number of the reversing document, when it has one.'}
        version: {type: integer}
    LedgerDocument:
      allOf:
        - $ref: '#/components/schemas/Obligation'
        - type: object
          required: [next_due, overdue, installments, settlements]
          properties:
            next_due: {type: string, format: date, description: Due date of the oldest unpaid installment.}
            overdue: {$ref: '#/components/schemas/Money'}
            installments: {type: array, items: {$ref: '#/components/schemas/Installment'}}
            settlements: {type: array, items: {$ref: '#/components/schemas/Settlement'}}
    DebtPartySummary:
      type: object
      required: [party_id, name, phone, direction, open, overdue, oldest_overdue_due, open_documents, advance]
      properties:
        party_id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: [string, 'null']}
        direction: {$ref: '#/components/schemas/DebtDirection'}
        open: {$ref: '#/components/schemas/Money'}
        overdue: {$ref: '#/components/schemas/Money'}
        oldest_overdue_due: {type: [string, 'null'], format: date}
        open_documents: {type: integer}
        advance:
          $ref: '#/components/schemas/Money'
