          $ref: '#/components/responses/Error'
  /products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Products by name
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - {name: q, in: query, description: 'Words matched in the name, accent-insensitive.', schema: {type: string}}
        - {name: category_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ProductStatus'}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/ProductType'}}
        - name: attributes
          in: query
          description: JSON object of attribute code to value; products whose values contain it match.
          schema: {type: string, examples: ['{"flavor":"dau-xanh"}']}
      responses:
        '200':
          description: Products with their SKU count.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Product'
                        - type: object
                          required: [sku_count]
                          properties:
                            sku_count: {type: integer}
                  next_cursor:
                    oneOf:
                      - $ref: '#/components/schemas/Cursor'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Add a product, optionally with its single SKU
      description: Attribute values are checked against the registry and the product's attribute set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type: {$ref: '#/components/schemas/ProductType'}
                name: {type: string, maxLength: 200}
                category_id: {type: [string, 'null'], format: uuid}
                attribute_set_id:
                  type: [string, 'null']
                  format: uuid
                  description: Omitted takes the category's set; null means none.
                attributes: {type: object, description: Attribute code to value.}
                description: {type: [string, 'null']}
                status:
                  allOf:
                    - $ref: '#/components/schemas/ProductStatus'
                  description: Defaults to active, and to draft for a kit or combo, which only publishing its recipe activates.
                sku:
                  allOf:
                    - $ref: '#/components/schemas/SkuFields'
                    - type: object
                      required: [code]
                      properties:
                        code: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,39}$'}
                        barcode: {type: [string, 'null']}
                        purchase_unit_id:
                          type: [string, 'null']
                          format: uuid
                          description: Default purchase unit; the base unit or null adds none.
                        factor: {type: [string, 'null'], description: 'Base units per purchase unit, a positive decimal.'}
                        retail_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: Retail price per base unit.}
                        wholesale_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: Wholesale price per base unit.}
      responses:
        '201':
          description: Product; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: product_name_taken, sku_code_taken, barcode_taken or plan_limit_reached (`fields.limit` skus).
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (status set_by_recipe for a kit or combo not created as a draft), code_and_name_required or factor_not_positive.
          $ref: '#/components/responses/Error'
  /products:quick-create:
    post:
      tags: [catalog]
      operationId: quickCreateProduct
      summary: Create a product with one SKU from a document line
      description: |
        Used from purchase and sales forms. The code is generated when omitted; a purchase unit
        with its factor and an opening barcode are optional. The sale price is kept only once
        pricing is available (`sale_price_saved`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_unit_id]
              properties:
                name: {type: string, maxLength: 200}
                code: {type: [string, 'null'], pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,39}$'}
                category_id: {type: [string, 'null'], format: uuid}
                base_unit_id: {type: string, format: uuid}
                purchase_unit_id: {type: [string, 'null'], format: uuid}
                factor: {type: [string, 'null'], description: 'Base units per purchase unit, a positive decimal.'}
                purchase_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
                sale_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: Retail price per base unit.}
                wholesale_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: Wholesale price per base unit.}
                track_lot: {type: boolean, description: Track lots and expiry dates.}
                barcode: {type: [string, 'null']}
      responses:
        '201':
          description: Product and whether the sale price was stored.
          content:
            application/json:
              schema:
                type: object
                required: [product, sale_price_saved]
                properties:
                  product: {$ref: '#/components/schemas/ProductDetail'}
                  sale_price_saved: {type: boolean}
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: product_name_taken, sku_code_taken, barcode_taken or plan_limit_reached (`fields.limit` skus).
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, code_and_name_required or factor_not_positive.
          $ref: '#/components/responses/Error'
