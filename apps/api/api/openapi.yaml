    get:
      tags: [procurement]
      operationId: listPurchaseReturns
      summary: Purchase returns (XT), newest first
      parameters:
        - {name: q, in: query, required: false, description: 'Words matched in the number, the receipt number and the supplier, accent-insensitive.', schema: {type: string}}
        - {name: supplier_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: receipt_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [posted, reversed]}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Returns with their lines and how their credit settled.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PurchaseReturnListItem'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [procurement]
      operationId: postPurchaseReturn
      summary: Return goods of a receipt to the supplier
      description: |
        Issues each line from exactly the lot (and so the color) its receipt line received into,
        never another color. A line may return at most what the receipt line still keeps (409
        return_exceeds_received). Each line leaves at the cost it carries in stock, landed cost
        included; the credit is its purchase price after discount, tax and price adjustments,
        landed cost excluded (paid to others). `credit_payable` credits the receipt's
        payable, `refund` books a credit the supplier pays back, `replacement` credits the
        receipt's payable now and the replacement goods come on a new receipt at the original
        price (see PurchaseReturnRequest.settlement).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseReturnRequest'
      responses:
        '201':
          description: Return with its lines and credit note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReturn'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: return_exceeds_received, receipt_not_posted, insufficient_stock or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
