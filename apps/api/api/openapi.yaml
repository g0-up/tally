      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: cart_sold.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /pos/carts/{id}:copy:
