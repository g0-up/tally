            application/json:
              schema:
                $ref: '#/components/schemas/Kit'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: recipe_draft_exists.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /kits/{id}/recipes/{version}:
    get:
      tags: [kits]
      operationId: getKitRecipeVersion
      summary: One recipe version of a kit
      parameters:
        - $ref: '#/components/parameters/ID'
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Recipe version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitRecipe'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /kits/{id}:publish:
    post:
      tags: [kits]
      operationId: publishKit
      summary: Publish a kit's draft recipe version
      description: |
        The draft becomes the active version, the version it replaces is superseded and the kit's
        product becomes active: a combo is then sellable and a pre-packed kit assemblable. The price
        history of the kit's draft retail price starts with its first row (added from the catalog).
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Published kit; `ETag` carries the version of its latest recipe.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kit'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: recipe_not_draft, idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid or validation_failed (an inactive component at items.N.sku_id, items.N.mix_group_id or items.N.flavors).
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /kits:suggest:
    post:
      tags: [kits]
      operationId: suggestKit
      summary: Suggest a kit composition within a budget
      description: |
        Fills the budget, at today's retail prices, with the candidates' minimum quantities, then
        with the candidates of best unit margin within their free stock; the packing cost counts in
        the margin. It saves nothing and never changes a confirmed invoice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitSuggestRequest'
      responses:
        '200':
          description: Suggested composition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitSuggestion'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /kits:preview:
    post:
      tags: [kits]
      operationId: previewKitRecipe
      summary: Economics of an unsaved recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitRecipePreviewRequest'
      responses:
        '200':
          description: Cost view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitCostView'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /assembly-orders:
    get:
      tags: [kits]
      operationId: listAssemblyOrders
      summary: Assembly orders (LD), newest first
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/AssemblyOrderStatus'}}
        - {name: product_id, in: query, required: false, schema: {type: string, format: uuid}}
