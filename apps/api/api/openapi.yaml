openapi: 3.1.0
info:
  title: Tally API
  version: 0.1.0
  description: |
    Store API served on tenant hosts (`<slug>.<root host>`) and, for sign-up and login, on the
    root host. Every route registered in the Go server must appear here and every path here must
    be served (enforced by the OpenAPI contract test).

    Conventions:
    - Money, quantities, factors and percents travel as JSON strings holding a plain decimal
      (`"15000"`, `"0.5"`); JSON numbers are rejected.
    - Lists use cursor pagination (`?cursor=&limit=`, limit at most 200) and answer
      `{data, next_cursor}`.
    - Custom methods use `POST /<resource>/{id}:<verb>` and `POST /<resource>:<verb>`.
    - Posting commands require an `Idempotency-Key` header; updates require `If-Match` with the
      resource version (stale versions answer 412).
    - Unsafe methods on authenticated routes require the `X-CSRF-Token` header matching the
      CSRF cookie.

    Error contract (body is always `ErrorResponse`; clients branch on `error.code`):
    - 401 `unauthenticated`: no valid session; sign in again.
    - 403 `csrf_failed`: missing or stale CSRF token; call `GET /host-context` and retry once.
    - 403 `reauth_required`: the action needs a password re-entered within 5 minutes; call
      `POST /auth/reauth` and retry. Every route marked "re-authentication required" may answer it.
    - 403 `invalid_password` (re-authentication) and `not_sandbox` (sandbox reset).
    - 403 `forbidden`: the session may not do this (a support session on an owner-only account
      route).
    - 409 `exception_required` with `exception_kind`: confirm via `POST /exception-confirmations`
      and retry with the confirmation id.
    - 412 `precondition_failed`: `If-Match` does not match the current version; reload and retry.
    - 428 `precondition_required`: `If-Match` is missing on a route that requires it.
    - 422 `validation_failed` with `fields`, or a domain-specific code listed on the route.
    - 423 `period_locked`: the document date falls on or before the lock date.
    - 403 `subscription_read_only`: the store's subscription is read-only, or its closure is taking
      its final export (closure `exporting` or `export_failed`); postings are refused while reads,
      exports, payment and support stay open.
    - 423 `tenant_maintenance`: an operator holds the store while a restore runs; every unsafe
      method is refused (postings, settings, billing, support, onboarding, feedback, exports and
      closure) and reads stay open. Securing the account (re-authentication, password, two-step
      verification, sessions, ownership transfer) keeps working. Retry once the store is released.
    - 403 `module_not_in_plan`: the route belongs to a module the store's plan does not include.
    - 409 `plan_limit_reached` with `fields.limit` (`skus`, `storage_mb`): the plan limit is used up.
    - 429 `rate_limited` with a `Retry-After` header (per-address request limits and the
      failed-login lock alike).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
    csrfHeader: []
tags:
  - name: identity
    description: Sign-up, sign-in, sessions, two-step verification and ownership.
  - name: organization
    description: Store profile and settings, period locks, exception confirmations, audit log, attachments and reasons.
  - name: catalog
    description: Units, tax rates, attributes, categories, products, SKUs, mixed-pack groups and picker search.
  - name: partners
    description: Customers, suppliers, customer groups, contacts and addresses.
  - name: pricing
    description: Price lists, base sale prices and their history, price quotes, document calculation and promotions.
  - name: debt
    description: |
      Receivables and payables by party and document, aging and forecast, payments (PT/PC) and
      their verification queue, allocations, debt adjustments (DN), offsets (BT), refunds,
      statements (DS) and collection notes. Balances are never typed: a document's open amount is
      its amount minus the sum of its settlements; nothing is netted automatically.
  - name: cash
    description: Fund accounts (cash on hand, bank account) and the payment methods that pay into them.
  - name: inventory
    description: |
      Stock by SKU, color and lot, the stock card, lot trace, reservations, stock adjustments (DC),
      stock counts (KK) and backdate cost recalculations. Stock is never typed: every quantity is
      the sum of the append-only stock moves, and no issue may take a balance below zero.
  - name: procurement
    description: |
      Purchase orders (PO), receipts (PN) with or without an order, landed costs, supplier
      documents matched to receipts, purchase returns (XT) and purchase price adjustments (DG).
      Receipts and returns move stock lot by lot and color by color; payables are debt documents
      and are settled only by payments, credits and allocations.
  - name: sales
    description: |
      Quotes (BG), invoices (HD) with their reservations and versions, stock outs (PX), sales
      documents (BH), the POS (checkout, parked carts, shifts and offline sync), sales returns (TH),
      exchanges (DH) and print data. Every sale issues stock by color and lot at the average cost;
      receivables are debt documents and are settled only by payments, credits and allocations.
  - name: kits
    description: |
      Kits and combos with their versioned recipes (draft, publish, preview, delete), budget
      suggestions, assembly orders (LD) with reservations, substitutions and batches, disassemblies
      (TG), kit labels and lot genealogy. A pre-packed kit holds its own stock made by balanced
      assembly postings; a combo holds none and is expanded into its components at sale.
  - name: campaign
    description: |
      Seasonal campaigns with their price lists, promotions and checklist, demand tracking, and the
      attribution of documents to a campaign. A sales line counts under at most one primary campaign.
  - name: crm
    description: |
      Customer timeline, contact consents, care tasks, last-season customers, re-order drafts and the
      loyalty program with its point ledger. Reminders and campaigns reach a customer only through a
      consented channel.
  - name: notifications
    description: |
      The in-app notification centre: one notification per condition (overdue debt, expiring lots,
      stock below minimum, finished exports...), resolved by the system when the condition clears.
  - name: reporting
    description: |
      The report catalogue (NXT, lot stock, revenue, gross margin, debt aging and schedule, cash flow,
      kits, season, buy and clearance suggestions, cash forecast), the dashboard, saved layouts and
      background exports. Revenue is posted sales net of returns, never order or invoice totals; a
      walk-in sale has no customer and so never appears as debt.
  - name: analytics
    description: Questions about the store's figures answered by an assistant from the report catalogue, with citations.
  - name: billing
    description: |
      Plans, the store's own subscription and entitlements, service invoices and their payment
      callbacks, the full data export and account closure. These routes stay open while the store is
      read-only, so it can still pay, export and leave.
  - name: support
    description: |
      Support tickets with the support team and the consented, read-only, expiring support sessions
      that let the ticket's agent look at chosen parts of the store.
  - name: onboarding
    description: The set-up checklist, ending with the confirmation of the opening balances and the period lock up to the cutoff.
  - name: service
    description: Public service status and product feedback.
paths:
  /host-context:
    get:
      tags: [identity]
      operationId: getHostContext
      summary: Host kind and a CSRF token
      description: |
        Served on the root, tenant and admin hosts. Issues a CSRF token bound to the current
        session, or to the signed-out state of the host, and stores it in the host's CSRF cookie
        (`__Host-tally_admin_csrf` on the admin host). An unknown store host answers like a real
        one. Clients call it on start-up and again after a 403 csrf_failed.
      security: []
      responses:
        '200':
          description: Host context.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostContext'
  /auth/signup:
    post:
      tags: [identity]
      operationId: signup
      summary: Create a store and its owner (root host)
      description: |
        Always answers 202 with the store address once the input is valid. When the e-mail
        already has an account no store is created and the address receives an "account exists"
        e-mail instead of a verification link. Rate limited per client address.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '202':
          description: Accepted; a verification e-mail is on its way.
          content:
            application/json:
              schema:
                type: object
                required: [store_url]
                properties:
                  store_url: {type: string, format: uri}
        '422':
          description: validation_failed, slug_invalid, slug_reserved or slug_taken.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /signup/slug-check:
    get:
      tags: [identity]
      operationId: checkSlug
      summary: Whether a store address is free (root host)
      description: Rate limited per client address, separately from the credential endpoints.
      security: []
      parameters:
        - name: slug
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Availability with a free suggestion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugCheck'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /store-lookup:
    post:
      tags: [identity]
      operationId: storeLookup
      summary: E-mail the store address of an account (root host)
      description: Always 202 for a well-formed address; nothing is sent when no account matches.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted.
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/verify:
    post:
      tags: [identity]
      operationId: verifyEmail
      summary: Confirm the owner's e-mail with the link token
      description: |
        `password` is required when the account was created without one (operator-created
        stores). Tokens work once and expire.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, maxLength: 128}
                password: {type: string, minLength: 8, maxLength: 256}
      responses:
        '204':
          description: Verified.
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
        '422':
          description: token_invalid (unknown, used or expired) or validation_failed.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      tags: [identity]
      operationId: login
      summary: Sign in to the store of the host
      description: |
        `login` is the owner's e-mail or Vietnamese phone number (with or without +84, spaces,
        dots or dashes). Wrong password, unknown e-mail or phone and the owner of another store
        all answer the same 401 invalid_credentials. Repeated failures with one identifier lock it
        out for the client address (429 rate_limited with Retry-After). With two-step
        verification on, the answer is `mfa_required` with a challenge for
        `POST /auth/mfa/totp/verify`. A login that races a reset of its demo store answers 409
        sandbox_replaced; signing in again reaches the new sandbox.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string, maxLength: 254, description: E-mail address or phone number.}
                password: {type: string, maxLength: 256}
      responses:
        '200':
          description: Signed in (session and CSRF cookies set) or MFA required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: email_not_verified or account_locked.
          $ref: '#/components/responses/Error'
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags: [identity]
      operationId: logout
      summary: Sign out
      description: Ends the session when there is one and always clears the session cookie.
      security:
        - csrfHeader: []
      responses:
        '200':
          description: Signed out; the new CSRF token is bound to the signed-out host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFToken'
  /auth/password-reset:
    post:
      tags: [identity]
      operationId: requestPasswordReset
      summary: E-mail a password reset link
      description: Always 202 for a well-formed address, unless the demo store is reset meanwhile (409).
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted.
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/password-reset/confirm:
    post:
      tags: [identity]
      operationId: resetPassword
      summary: Set a new password with the reset token
      description: Signs out every session of the owner.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPasswordRequest'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFToken'
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
        '422':
          description: token_invalid or validation_failed.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/mfa/totp/verify:
    post:
      tags: [identity]
      operationId: verifyTOTP
      summary: Complete an MFA login, or confirm a TOTP enrolment
      description: |
        With `challenge` (from login) and `code` or `recovery_code`, completes the login. Without
        a challenge, a signed-in owner confirms the pending enrolment with `code` and receives
        ten one-time recovery codes; every other session of the owner is signed out.
      security:
        - csrfHeader: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge: {type: string, maxLength: 512}
                code: {type: string, maxLength: 16}
                recovery_code: {type: string, maxLength: 32}
      responses:
        '200':
          description: Signed in, or the recovery codes of a confirmed enrolment.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResult'
                  - $ref: '#/components/schemas/RecoveryCodes'
        '401':
          description: challenge_invalid, invalid_code or unauthenticated.
          $ref: '#/components/responses/Error'
        '409':
          description: mfa_already_enabled, mfa_not_enrolled or sandbox_replaced.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /owner-transfer/accept:
    post:
      tags: [identity]
      operationId: acceptOwnerTransfer
      summary: Accept a store handed over by its owner
      description: |
        Creates the new owner account with `password`; the previous owner is disabled and signed
        out. Existing records keep the previous owner as their actor.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPasswordRequest'
      responses:
        '200':
          description: Transferred; sign in as the new owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFToken'
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
        '422':
          description: token_invalid, email_in_use or validation_failed.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/reauth:
    post:
      tags: [identity]
      operationId: reauthenticate
      summary: Confirm the password before a sensitive action
      description: |
        Sensitive actions answer 403 reauth_required until this succeeds (valid 5 minutes). A
        wrong password is audited and counts towards the failed-login lock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, maxLength: 256}
      responses:
        '200':
          description: Re-authenticated; the session cookie is rotated.
          content:
            application/json:
              schema:
                type: object
                required: [reauthenticated_until]
                properties:
                  reauthenticated_until: {type: string, format: date-time}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: invalid_password.
          $ref: '#/components/responses/Error'
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/password:
    post:
      tags: [identity]
      operationId: changePassword
      summary: Change the owner's password (re-authentication required)
      description: Every other session of the owner is signed out; the current one stays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, minLength: 8, maxLength: 256}
      responses:
        '200':
          description: Changed; the number of other sessions signed out.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: {type: integer, minimum: 0}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required or forbidden.
          $ref: '#/components/responses/Error'
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /auth/mfa/totp:
    post:
      tags: [identity]
      operationId: enrolTOTP
      summary: Start a TOTP enrolment (re-authentication required)
      responses:
        '200':
          description: Secret to add to an authenticator app; confirm with a code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: {type: string, description: Base32 secret for manual entry.}
                  otpauth_uri: {type: string, description: otpauth:// URI for a QR code.}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required.
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      tags: [identity]
      operationId: disableTOTP
      summary: Turn two-step verification off (re-authentication required)
      responses:
        '204':
          description: Turned off; secret and recovery codes deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required.
          $ref: '#/components/responses/Error'
        '409':
          description: mfa_not_enabled or sandbox_replaced.
          $ref: '#/components/responses/Error'
  /me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The signed-in owner, store and session
      responses:
        '200':
          description: Current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Error'
  /sessions:
    get:
      tags: [identity]
      operationId: listSessions
      summary: Open sessions of the owner
      responses:
        '200':
          description: Sessions, most recent activity first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
  /sessions/{id}:
    delete:
      tags: [identity]
      operationId: revokeSession
      summary: Sign out one session
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Revoked; revoking the current session also clears its cookie.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
  /sessions:revoke-all:
    post:
      tags: [identity]
      operationId: revokeOtherSessions
      summary: Sign out every other session
      description: Takes effect on the next request of those sessions.
      responses:
        '200':
          description: Number of sessions signed out.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: {type: integer, minimum: 0}
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
  /owner-transfer:
    post:
      tags: [identity]
      operationId: requestOwnerTransfer
      summary: Hand the store over to someone else (re-authentication required)
      description: E-mails the new owner an acceptance link valid 72 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name]
              properties:
                email: {type: string, format: email, maxLength: 254}
                full_name: {type: string, maxLength: 200}
      responses:
        '202':
          description: Acceptance link sent.
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: sandbox_replaced (the demo store was reset while the request ran).
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required.
          $ref: '#/components/responses/Error'
        '422':
          description: email_in_use or validation_failed.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /tenant:
    get:
      tags: [organization]
      operationId: getTenant
      summary: Store profile
      responses:
        '200':
          description: Profile; `ETag` carries the version.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Error'
    patch:
      tags: [organization]
      operationId: updateTenant
      summary: Update the store profile
      description: The address (slug) never changes.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_name: {type: string, maxLength: 200}
                display_name: {type: string, maxLength: 200}
                tax_code: {type: [string, 'null'], pattern: '^[0-9]{10}(-[0-9]{3})?$'}
                address: {type: [string, 'null']}
                phone: {type: [string, 'null']}
                timezone: {type: string, examples: [Asia/Saigon]}
                opening_cutoff_date:
                  type: [string, 'null']
                  description: |
                    Onboarding cutoff the opening balances are stated at (YYYY-MM-DD); an empty string
                    clears it. It may not be after today and cannot change once the opening balances are
                    confirmed (409 opening_balances_confirmed).
                  examples: ['2026-03-14']
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /tenant/settings:
    get:
      tags: [organization]
      operationId: getSettings
      summary: Store settings
      responses:
        '200':
          description: Settings; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Error'
    patch:
      tags: [organization]
      operationId: updateSettings
      summary: Update store settings
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices_include_tax: {type: boolean}
                rounding_mode: {type: string}
                default_payment_terms_days: {type: integer, minimum: 0}
                block_expired_lot_sale: {type: boolean}
                expiry_warning_days: {type: integer, minimum: 0}
                offline_pos_enabled: {type: boolean}
                offline_pos_max_amount: {$ref: '#/components/schemas/Money'}
                offline_pos_max_hours: {type: integer, minimum: 1}
                analytics_ai_enabled: {type: boolean}
                product_analytics_enabled: {type: boolean}
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /tenant/sandbox/reset:
    post:
      tags: [organization]
      operationId: resetSandbox
      summary: Replace the demo store with a new one holding fresh sample data (re-authentication required)
      description: |
        Only on a sandbox store; any other store answers 403 not_sandbox. The current demo data is
        replaced with fresh sample data: a new sandbox tenant (new id) takes over the store address
        and gets the default and sample data, and the owner account moves to it with every session
        (the caller stays signed in). The old data is archived, not deleted: the old tenant is kept
        with status `replaced` and can no longer be reached, and its undelivered background events
        are closed. A request still acting for an already replaced sandbox answers 409
        sandbox_not_active; a reset that keeps colliding with another write to the account answers
        409 sandbox_busy and can be tried again. A sandbox can be reset once it is 10 minutes old; a younger one answers
        429 sandbox_reset_too_soon with `Retry-After`, which also turns a retried reset into a
        refusal instead of a second reset. No `Idempotency-Key` is used.
      responses:
        '200':
          description: The new sandbox tenant; `ETag` carries its version.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: not_sandbox or reauth_required.
          $ref: '#/components/responses/Error'
        '409':
          description: sandbox_not_active or sandbox_busy.
          $ref: '#/components/responses/Error'
        '429':
          description: sandbox_reset_too_soon; `Retry-After` gives the seconds until the sandbox can be reset.
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /store:
    get:
      tags: [organization]
      operationId: getStore
      summary: The single store and warehouse
      responses:
        '200':
          description: Store and warehouse.
          content:
            application/json:
              schema:
                type: object
                required: [store, warehouse]
                properties:
                  store:
                    type: object
                    required: [id, name, address, phone]
                    properties:
                      id: {type: string, format: uuid}
                      name: {type: string}
                      address: {type: [string, 'null']}
                      phone: {type: [string, 'null']}
                  warehouse:
                    type: object
                    required: [id, name]
                    properties:
                      id: {type: string, format: uuid}
                      name: {type: string}
        '401':
          $ref: '#/components/responses/Error'
  /period-locks:
    get:
      tags: [organization]
      operationId: listPeriodLocks
      summary: Current lock date and its history
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lock date (null when nothing is locked) and lock/reopen events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [locked_through, version, data, next_cursor]
                properties:
                  locked_through: {type: [string, 'null'], format: date}
                  version: {type: integer}
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeriodLockEvent'
                  next_cursor:
                    oneOf:
                      - $ref: '#/components/schemas/Cursor'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [organization]
      operationId: lockPeriod
      summary: Lock postings up to a date
      description: The lock only moves forward and never past today (Asia/Saigon).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked_through]
              properties:
                locked_through: {type: string, format: date}
      responses:
        '201':
          description: Locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodLockEvent'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: lock_date_in_future, lock_not_forward or validation_failed.
          $ref: '#/components/responses/Error'
  /period-locks/reopen:
    post:
      tags: [organization]
      operationId: reopenPeriod
      summary: Move the lock date back (re-authentication and a period_reopen confirmation required)
      description: |
        `locked_through: null` reopens everything (no lock date); the field must be present.
        The confirmation's payload hash covers this request body as sent, without
        `exception_confirmation_id`; it is consumed by this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked_through, reason, exception_confirmation_id]
              properties:
                locked_through: {type: [string, 'null'], format: date}
                reason: {type: string, maxLength: 500}
                exception_confirmation_id: {type: string, format: uuid}
      responses:
        '201':
          description: Reopened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodLockEvent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: reauth_required.
          $ref: '#/components/responses/Error'
        '409':
          description: exception_required, exception_confirmation_used or period_not_locked.
          $ref: '#/components/responses/Error'
        '422':
          description: reopen_not_backward or validation_failed.
          $ref: '#/components/responses/Error'
  /exception-confirmations:
    post:
      tags: [organization]
      operationId: confirmException
      summary: Confirm an exception before retrying a command
      description: |
        The confirmation is bound to the document, its version and the SHA-256 of the retried
        payload, expires after 30 minutes and works once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, doc_type, doc_id, doc_version, payload_hash]
              properties:
                kind: {$ref: '#/components/schemas/ExceptionKind'}
                doc_type: {type: string}
                doc_id: {type: string, format: uuid}
                doc_version: {type: integer, minimum: 0}
                payload_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
                impact: {type: object}
                note: {type: string, maxLength: 1000}
      responses:
        '201':
          description: Confirmation to pass as `exception_confirmation_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionConfirmation'
        '401':
