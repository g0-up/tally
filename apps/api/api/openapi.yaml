  /price-lists:
    get:
      tags: [pricing]
      operationId: listPriceLists
      summary: Price lists by level and priority
      description: Base lists first, then group, customer and season lists by priority (lower wins).
      parameters:
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/PriceListKind'}}
        - {name: active, in: query, description: Only active lists when true., schema: {type: boolean}}
      responses:
        '200':
          description: Price lists.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PriceList'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags: [pricing]
      operationId: createPriceList
      summary: Add a group, customer or season price list
      description: |
        A group list needs `customer_group_id`, a customer list `party_id`, a season list a validity
        range. Each store has exactly one retail and one wholesale base list, created with the store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PriceListRequest'
                - {type: object, required: [name, kind]}
      responses:
        '201':
          description: Price list; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: name_taken or base_price_list_exists.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /price-lists/{id}:
    get:
      tags: [pricing]
      operationId: getPriceList
