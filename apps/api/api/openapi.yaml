            out: {$ref: '#/components/schemas/Money'}
            net: {$ref: '#/components/schemas/Money'}
            balance: {$ref: '#/components/schemas/Money'}
            prev_in: {$ref: '#/components/schemas/Money'}
            prev_out: {$ref: '#/components/schemas/Money'}
            prev_net: {$ref: '#/components/schemas/Money'}
            prev_balance: {$ref: '#/components/schemas/Money'}
            funds:
              type: array
              items:
                type: object
                required: [id, name, kind, balance]
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  kind: {type: string}
                  balance: {$ref: '#/components/schemas/Money'}
            by_category:
              type: array
              description: Money in and out of the whole period by kind (Theo loại), largest first; opening declarations excluded.
              items:
                type: object
                required: [category, label, in, out]
                properties:
                  category: {type: string, description: 'Cash entry category, for example sales, debt_collection or supplier_payment.'}
                  label: {type: string}
                  in: {$ref: '#/components/schemas/Money'}
                  out: {$ref: '#/components/schemas/Money'}
            link: {type: string}
        debt:
          type: object
          required: [receivable, payable, due_link]
          properties:
            receivable: {$ref: '#/components/schemas/DashboardDebtSide'}
            payable: {$ref: '#/components/schemas/DashboardDebtSide'}
            due_link: {type: string}
        series:
          type: array
          items:
            type: object
            required: [label, from, to, in, out]
            properties:
              label: {type: string}
              from: {type: string, format: date}
              to: {type: string, format: date}
              in: {$ref: '#/components/schemas/Money'}
              out: {$ref: '#/components/schemas/Money'}
        entries:
          type: array
          items:
            type: object
            required: [id, doc_no, party, fund, category, amount, reversal]
            properties:
              id: {type: string, format: uuid}
              doc_no: {type: [string, 'null']}
              party: {type: [string, 'null']}
              fund: {type: string}
              category: {type: string}
              amount: {$ref: '#/components/schemas/Money'}
              reversal: {type: boolean}
    ReportConfig:
      type: object
      properties:
        columns: {type: array, items: {type: string}}
        group_by: {type: string}
        filters: {type: object, additionalProperties: {type: string}}
    SavedReport:
      type: object
      required: [id, report_key, name, config, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        report_key: {$ref: '#/components/schemas/ReportKey'}
        name: {type: string}
        config: {$ref: '#/components/schemas/ReportConfig'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExportJob:
      type: object
      required: [id, kind, report_key, params, status, row_count, error, created_at, started_at, finished_at, expires_at, download_path]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [report_csv, full_data_export]}
        report_key:
          description: Report of a report_csv export; empty for a full data export.
          anyOf:
            - $ref: '#/components/schemas/ReportKey'
            - {type: string, const: ''}
        params: {type: object, additionalProperties: {type: string}}
        status: {type: string, enum: [queued, running, succeeded, failed, expired, cancelled]}
        row_count: {type: [integer, 'null']}
        error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        download_path: {type: [string, 'null'], description: Set while a finished export can be downloaded.}
    AnalyticsQuery:
      type: object
      required: [id, question, answer, citations, model, asked_by, created_at]
      properties:
        id: {type: string, format: uuid}
        question: {type: string}
        answer: {type: [string, 'null']}
        citations:
          type: array
          items:
            type: object
            required: [report_key, title, params, refs]
            properties:
              report_key: {$ref: '#/components/schemas/ReportKey'}
              title: {type: string}
              params: {type: object, additionalProperties: {type: string}}
              refs: {type: array, items: {type: string}, description: Document numbers the answer names from this report.}
        model: {type: string}
        asked_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    PrintStatement:
      type: object
      required: [direction, period_from, period_to, opening_balance, closing_balance, lines]
      properties:
        direction: {$ref: '#/components/schemas/DebtDirection'}
        period_from: {type: string, format: date}
        period_to: {type: string, format: date}
        opening_balance: {$ref: '#/components/schemas/Money'}
        closing_balance: {$ref: '#/components/schemas/Money'}
        lines:
          type: array
          items:
            type: object
            required: [date, kind, doc_no, increase, decrease, balance]
            properties:
              date: {type: string, format: date}
              kind: {type: string}
              doc_no: {type: string}
              due_date: {type: [string, 'null'], format: date}
              increase: {$ref: '#/components/schemas/Money'}
              decrease: {$ref: '#/components/schemas/Money'}
              balance: {$ref: '#/components/schemas/Money'}
    PrintKitLot:
      type: object
      required: [lot_no, expiry_date, qty, sku_code, name, components]
      properties:
        lot_no: {type: string}
        expiry_date: {type: [string, 'null'], format: date}
        qty: {$ref: '#/components/schemas/Qty'}
        sku_code: {type: string}
        name: {type: string}
        components:
          type: array
          items:
            type: object
            required: [sku_code, name, lot_no, color, expiry_date, qty_per_kit]
            properties:
              sku_code: {type: string}
              name: {type: string}
              lot_no: {type: string}
              color: {type: [string, 'null']}
              expiry_date: {type: [string, 'null'], format: date}
              qty_per_kit: {$ref: '#/components/schemas/Qty'}
    PlanModule:
      type: string
      enum: [pos, kits, campaign, crm, reports_advanced, ai_qa]
    Plan:
      type: object
      required: [id, code, name, kind, billing_period, price, modules, limits, terms, active]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        kind: {type: string, enum: [year_round, seasonal, addon, trial]}
        billing_period: {type: string, enum: [month, season, year, none]}
        price: {$ref: '#/components/schemas/Money'}
        modules: {type: array, items: {$ref: '#/components/schemas/PlanModule'}}
        limits:
          type: object
          description: Numeric limits; a missing key is unlimited.
          properties:
            skus: {type: integer, description: Number of SKUs.}
            storage_mb: {type: integer, description: File storage in MiB.}
          additionalProperties: {type: integer}
        terms:
          type: object
          description: Published terms in days (SLA in hours).
          required: [trial_days, grace_days, read_only_days, support_sla_hours, period_days]
          properties:
            trial_days: {type: integer}
            grace_days: {type: integer}
            read_only_days: {type: integer}
            support_sla_hours: {type: integer}
            period_days: {type: integer}
        active: {type: boolean}
    SubscriptionStatus:
      type: string
      description: |
        trialing and active work fully; grace works and warns; read_only keeps reads, exports,
        payment and support but refuses postings (403 subscription_read_only); closed allows
        nothing but sign-in. Nothing is deleted on any status.
      enum: [trialing, active, grace, read_only, closed]
    Subscription:
      type: object
      required: [id, plan_id, status, current_period_start, current_period_end, trial_ends_on, grace_ends_on,
        read_only_ends_on, cancel_at_period_end, version]
      properties:
        id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/SubscriptionStatus'}
        current_period_start: {type: string, format: date}
        current_period_end: {type: string, format: date}
        trial_ends_on: {type: [string, 'null'], format: date}
        grace_ends_on: {type: [string, 'null'], format: date}
        read_only_ends_on: {type: [string, 'null'], format: date}
        cancel_at_period_end: {type: boolean}
        version: {type: integer}
    Entitlements:
      type: object
      required: [status, modules, limits, can_post, can_export]
      properties:
        status:
          description: Status in effect today; empty for a store without a subscription, which is unrestricted.
          anyOf:
            - $ref: '#/components/schemas/SubscriptionStatus'
            - {type: string, const: ''}
        modules:
          type: [object, 'null']
          description: Enabled modules; null when unrestricted.
          additionalProperties: {type: boolean}
        limits:
          type: [object, 'null']
          description: Limits of the plan and its add-ons; null when unrestricted.
          additionalProperties: {type: integer}
        can_post: {type: boolean}
        can_export: {type: boolean}
    SubscriptionView:
      type: object
      required: [subscription, plan, entitlements, addons]
      properties:
        subscription:
          oneOf:
            - $ref: '#/components/schemas/Subscription'
            - type: 'null'
        plan:
          oneOf:
            - $ref: '#/components/schemas/Plan'
            - type: 'null'
        entitlements: {$ref: '#/components/schemas/Entitlements'}
        addons:
          type: array
          description: Add-ons in force today, earliest period first.
          items: {$ref: '#/components/schemas/ActiveAddon'}
    ActiveAddon:
      type: object
      description: A paid add-on whose period holds today, with the modules its purchase enabled.
      required: [plan_id, plan_name, modules, period_start, period_end]
      properties:
        plan_id: {type: string, format: uuid}
        plan_name: {type: string}
        modules:
          type: array
          items: {$ref: '#/components/schemas/PlanModule'}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date, description: 'Last day of the period, included.'}
    PlanChangeRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id: {type: string, format: uuid}
        accept_terms: {type: boolean, default: false, description: Required true by `POST /subscription:change`.}
    PlanChangeQuote:
      type: object
      required: [plan, purpose, period_start, period_end, amount, proration_note, terms]
      properties:
        plan: {$ref: '#/components/schemas/Plan'}
        purpose: {$ref: '#/components/schemas/SaasInvoicePurpose'}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        amount: {$ref: '#/components/schemas/Money'}
        proration_note: {type: string}
        terms: {type: string, description: Terms text the owner accepts.}
    SaasInvoicePurpose:
      type: string
      enum: [new_period, renewal, plan_change, addon]
    SaasInvoice:
      type: object
      required: [id, number, subscription_id, plan_id, purpose, period_start, period_end, amount, proration_note, status,
        provider, provider_ref, issued_at, paid_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, examples: [SV-20261018-0001]}
        subscription_id: {type: [string, 'null'], format: uuid}
        plan_id: {type: [string, 'null'], format: uuid}
        purpose: {$ref: '#/components/schemas/SaasInvoicePurpose'}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        amount: {$ref: '#/components/schemas/Money'}
        proration_note: {type: [string, 'null']}
        status: {type: string, enum: [open, paid, void]}
        provider: {type: [string, 'null']}
        provider_ref: {type: [string, 'null']}
        issued_at: {type: string, format: date-time}
        paid_at: {type: [string, 'null'], format: date-time}
    DataExport:
      type: object
      required: [id, status, created_at]
      properties:
        id: {type: string, format: uuid, description: 'Export job id for GET /export-jobs/{id}.'}
        status: {type: string, enum: [queued]}
        created_at: {type: string, format: date-time}
    AccountClosureRequest:
      type: object
      required: [id, status, verified_at, export_job_id, waiting_until, legal_hold, created_at]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [requested, verified, waiting, exporting, export_failed, completed, cancelled]
          description: |
            `exporting`: the wait ended and the final export is being taken; the store only reads
            and can no longer cancel. `export_failed`: the final export kept failing; the store
            still only reads until an operator retries it.
        verified_at: {type: [string, 'null'], format: date-time}
        export_job_id: {type: [string, 'null'], format: uuid, description: The closure's latest export (the first or the final one).}
        waiting_until:
          type: string
          format: date
          description: After this day the closure takes its final export, and the store only reads from then on.
        legal_hold: {type: boolean, description: A store under legal hold is not closed when the wait ends.}
        created_at: {type: string, format: date-time}
    AccountClosureView:
      type: object
      required: [request, export]
      properties:
        request:
          oneOf:
            - $ref: '#/components/schemas/AccountClosureRequest'
            - type: 'null'
        export:
          oneOf:
            - $ref: '#/components/schemas/AccountClosureExport'
            - type: 'null'
    AccountClosureExport:
      type: object
      required: [id, status, expires_at, final, failed_attempts]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, succeeded, failed, expired, cancelled]}
        expires_at: {type: [string, 'null'], format: date-time, description: The download link of a succeeded export ends then.}
        final:
          type: boolean
          description: The export taken when the wait ended, once the store only reads; the store closes when it succeeded.
        failed_attempts:
          type: integer
          minimum: 0
          description: Final exports of the current round that failed; at three the closure stops at `export_failed`.
    SupportTicket:
      type: object
      required: [id, number, subject, status, priority, sla_due_at, assigned_admin_id, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, examples: [HT-20261018-7K2M9Q]}
        subject: {type: string}
        status: {type: string, enum: [open, waiting_customer, in_progress, resolved, closed]}
        priority: {type: string, enum: [low, normal, high, urgent]}
        sla_due_at: {type: [string, 'null'], format: date-time}
        assigned_admin_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SupportTicketMessage:
      type: object
      required: [id, author_type, author_id, body, attachment_ids, created_at]
      properties:
        id: {type: string, format: uuid}
        author_type: {type: string, enum: [owner, platform_admin]}
        author_id: {type: string, format: uuid}
        body: {type: string}
        attachment_ids: {type: array, items: {type: string, format: uuid}}
        created_at: {type: string, format: date-time}
    SupportTicketView:
      allOf:
        - $ref: '#/components/schemas/SupportTicket'
        - type: object
          required: [messages]
          properties:
            messages: {type: array, items: {$ref: '#/components/schemas/SupportTicketMessage'}}
    SupportViewModule:
      type: string
      enum: [catalog, partners, inventory, procurement, sales, debt_cash, kits, campaign, crm, reports, settings]
    SupportSession:
      type: object
      required: [id, tenant_id, admin_id, ticket_id, scope, modules, state, granted_at, expires_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        admin_id: {type: string, format: uuid}
        ticket_id: {type: [string, 'null'], format: uuid}
        scope: {type: string, enum: [read_only]}
        modules: {type: array, items: {$ref: '#/components/schemas/SupportViewModule'}}
        state: {type: string, enum: [active, expired, revoked]}
        granted_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    OnboardingStepKey:
      type: string
      enum: [store_profile, catalog_setup, opening_stock, opening_debt, opening_cash, first_sale, confirm_opening_balances]
    OpeningTotals:
      type: object
      required: [cutoff, stock_by_color, stock_value, receivables, payables, customer_advances, supplier_advances, funds]
      properties:
        cutoff: {type: string, format: date}
        stock_by_color:
          type: array
          items:
            type: object
            required: [color_id, color_code, color_name, qty, value]
            properties:
              color_id: {type: [string, 'null'], format: uuid}
              color_code: {type: [string, 'null']}
              color_name: {type: [string, 'null']}
              qty: {$ref: '#/components/schemas/Qty'}
              value: {$ref: '#/components/schemas/Money'}
        stock_value: {$ref: '#/components/schemas/Money'}
        receivables: {$ref: '#/components/schemas/Money'}
        payables: {$ref: '#/components/schemas/Money'}
        customer_advances: {$ref: '#/components/schemas/Money'}
        supplier_advances: {$ref: '#/components/schemas/Money'}
        funds:
          type: array
          items:
            type: object
            required: [id, name, kind, balance]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              kind: {type: string}
              balance: {$ref: '#/components/schemas/Money'}
    OnboardingStep:
      type: object
      required: [key, status, skippable, completed_at, skipped_at]
      properties:
        key: {$ref: '#/components/schemas/OnboardingStepKey'}
        status: {type: string, enum: [pending, completed, skipped]}
        skippable: {type: boolean}
        completed_at: {type: [string, 'null'], format: date-time}
        skipped_at: {type: [string, 'null'], format: date-time}
        totals: {$ref: '#/components/schemas/OpeningTotals'}
    Onboarding:
      type: object
      required: [steps, done, total, complete, locked_through, totals]
      properties:
        steps: {type: array, items: {$ref: '#/components/schemas/OnboardingStep'}}
        done: {type: integer}
        total: {type: integer}
        complete: {type: boolean}
        locked_through: {type: [string, 'null'], format: date, description: Period lock in effect.}
        totals:
          oneOf:
            - $ref: '#/components/schemas/OpeningTotals'
            - type: 'null'
    Incident:
      type: object
      required: [id, title, status, impact, started_at, resolved_at, updates]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        status: {type: string, enum: [investigating, identified, monitoring, resolved]}
        impact: {type: string, enum: [none, minor, major, critical]}
        started_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        updates:
          type: array
          items:
            type: object
            required: [at, status, message]
            properties:
              at: {type: string, format: date-time}
              status: {type: string}
              message: {type: string}
    ServiceStatus:
      type: object
      required: [indicator, incidents]
      properties:
        indicator: {type: string, enum: [operational, degraded, outage]}
        incidents: {type: array, items: {$ref: '#/components/schemas/Incident'}}
