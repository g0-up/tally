      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Price list; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceList'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [pricing]
      operationId: updatePriceList
      summary: Update a price list
      description: The kind, customer group and customer cannot change. A base list cannot be deactivated or dated.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
