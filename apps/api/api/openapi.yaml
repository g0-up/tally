      properties:
        sku_id: {type: string, format: uuid}
        sku_code: {type: string}
        name: {type: string}
        variant_label: {type: string}
        unit_id: {type: string, format: uuid}
        unit_name: {type: string}
        retail_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: 'The retail list price; null when the SKU has none.'}
        stock: {type: array, items: {$ref: '#/components/schemas/PosTileStock'}}
    PosBootstrap:
      type: object
      required: [settings, payment_methods, shift, tiles, priced_at]
      properties:
        settings: {$ref: '#/components/schemas/PosSettings'}
        payment_methods: {type: array, items: {$ref: '#/components/schemas/PosPaymentMethod'}}
        shift: {oneOf: [{$ref: '#/components/schemas/Shift'}, {type: 'null'}], description: 'The open shift, null when none is open yet.'}
