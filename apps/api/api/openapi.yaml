  /invoices/{id}/paid-amount:
    put:
      tags: [sales]
      operationId: setInvoicePaidAmount
      summary: Set what the customer has paid towards a draft invoice
      description: |
        Brings the paid amount to `amount`: an increase is one deposit (PT) earmarked for the invoice,
        which its stock outs consume first; a decrease refunds the latest deposits (PC). Money already
        allocated or a transfer still waiting for verification cannot be refunded here.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaidAmountRequest'
      responses:
        '200':
          description: Invoice with its payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            invoice_not_editable, nothing_changed, paid_amount_not_refundable, paid_amount_changed or an
            idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, idempotency_key_required or payment_method_inactive.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /invoices/{id}/stock-outs:
    post:
      tags: [sales]
      operationId: postStockOut
      summary: Deliver goods of a confirmed invoice (PX) and post its sales document (BH)
      description: |
        Each line takes at most what is reserved for its invoice line, from the reserved color, out of
        stock at the average cost; a mix pack or combo is delivered whole. The sales document carries
        the cost of goods and the receivable for its total, due on the invoice due date. The invoice
        moves to partially_delivered or completed.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockOutRequest'
      responses:
        '201':
          description: Stock out with its sales document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            invalid_status_transition, nothing_to_deliver, delivery_exceeds_reserved, insufficient_stock or
            an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed, idempotency_key_required or mix_pack_partial.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /invoices/{id}:check:
    post:
      tags: [sales]
      operationId: checkInvoice
      summary: Check what confirming an invoice needs
      description: |
        Reports the lines still missing a color, the lines below their minimum price, whether the credit
        limit would be exceeded, the exceptions the owner must confirm, and how much of each line can be
        reserved now (the rest is backordered). It changes nothing.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Readiness of the invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCheck'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only (a support session only reads). A read-only subscription may still check.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: invalid_status_transition.
          $ref: '#/components/responses/Error'
  /invoices/{id}:confirm:
    post:
      tags: [sales]
      operationId: confirmInvoice
      summary: Confirm a draft invoice and reserve its stock
      description: |
        Saves version 1, reserves each line by color (the rest is backordered) and opens no receivable
        until goods are delivered. Each line needs its color; a line below its minimum price or a
        customer over the credit limit needs a confirmed exception.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                exception_confirmation_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Confirmed invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            invalid_status_transition, exception_required (below the minimum price or over the credit limit;
            the owner confirms the exception and the request is retried with its exception_confirmation_ids),
            sale_changed (the invoice's lines changed while it posted; send it again) or an idempotency
            conflict.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          description: color_required, validation_failed or idempotency_key_required.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /invoices/{id}:revise:
    post:
      tags: [sales]
      operationId: reviseInvoice
      summary: Revise a confirmed invoice and save its next version
      description: |
        Replaces the header fields and lines given, keeps what was delivered, re-reserves the remainder
        and records whether the change is material.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceReviseRequest'
      responses:
        '200':
          description: Revised invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            invalid_status_transition, nothing_changed, exception_required (below the minimum price or over
            the credit limit; the owner confirms the exception and the request is retried with its
            exception_confirmation_ids), sale_changed (a combo recipe or a promotion changed the goods the
            revision takes while it posted; send it again) or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          description: color_required, validation_failed or idempotency_key_required.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /invoices/{id}:reserve-more:
