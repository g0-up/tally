            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyOrderPreview'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or not_a_kit.
          $ref: '#/components/responses/Error'
  /assembly-orders/{id}:
    get:
      tags: [kits]
      operationId: getAssemblyOrder
      summary: One assembly order with its items and batches
      parameters:
        - $ref: '#/components/parameters/ID'
