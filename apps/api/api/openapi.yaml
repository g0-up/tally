      type: object
      required: [enabled, points_per_amount, point_value, updated_at, version]
      properties:
        enabled: {type: boolean}
        points_per_amount: {$ref: '#/components/schemas/Money', description: Points earned per đồng of net revenue.}
        point_value: {$ref: '#/components/schemas/Money', description: The đồng a point is worth when redeemed as a discount.}
        updated_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, description: 0 while the program was never saved.}
    LoyaltyEntry:
      type: object
      required: [id, party_id, points, kind, source_type, source_id, reversal_of, business_date, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        party_id: {type: string, format: uuid}
        points: {$ref: '#/components/schemas/Qty'}
        kind: {type: string, enum: [earn, redeem, reverse, manual]}
        source_type:
          type: string
          enum: [sales_document, sales_document_reversal, sales_return, sales_return_redemption,
            sales_document_reversal_redemption, payment, payment_reversal, invoice, consent, manual]
          description: |
            sales_return_redemption and sales_document_reversal_redemption give back the points redeemed on
            a sale when it is returned or reversed; sales_return and sales_document_reversal take back the
            points it earned.
        source_id: {type: string, format: uuid}
        reversal_of: {type: [string, 'null'], format: uuid}
        business_date: {type: string, format: date}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, kind, dedupe_key, severity, title, body, entity_type, entity_id, color_id, action_path, doc_no, created_at, updated_at,
        read_at, resolved_at, resolved_by, snoozed_until]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [receivable_overdue, payable_due_soon, lot_expiring, lot_expired, below_min_stock, surplus_stock, pos_sync_exception,
            statement_disputed, subscription_status, export_ready]
        dedupe_key: {type: string, description: One notification per key; a condition lasting several days stays one notification.}
        severity: {type: string, enum: [info, warn, bad]}
        title: {type: string}
        body: {type: [string, 'null']}
        entity_type: {type: [string, 'null']}
        entity_id: {type: [string, 'null'], format: uuid}
        color_id: {type: [string, 'null'], format: uuid}
        action_path:
          type: [string, 'null']
          description: |
            Web route of the screen that handles the notification, with its query (for example
            `/debts/receivables?party={id}` or `/inventory/stock-card?sku={id}`); null when no screen
            handles it (export_ready links to its download through entity_id).
        doc_no: {type: [string, 'null'], description: 'Number of the document the notification is about, when one.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        resolved_by: {type: [string, 'null'], enum: [user, system, null]}
        snoozed_until: {type: [string, 'null'], format: date-time}
    ReportKey:
      type: string
      enum: [nxt, lot_stock, revenue, gross_margin, debt_aging, debt_schedule, cash_flow, kits, season, buy_suggestions,
        clearance_suggestions, cash_forecast]
    ReportColumn:
      type: object
      required: [key, label, kind]
      properties:
        key: {type: string}
        label: {type: string}
        kind: {type: string, enum: [text, money, qty, percent, date, int]}
    ReportRow:
      type: object
      description: Cells by column key; every cell is a decimal or date string, or null.
      additionalProperties: {type: [string, 'null']}
    ReportSpec:
      type: object
      required: [key, slug, title, range, group_bys, filters, columns, paged, saveable]
      properties:
        key: {$ref: '#/components/schemas/ReportKey'}
        slug: {type: string, description: 'The key with hyphens, as used in paths.'}
        title: {type: string}
        range: {type: string, enum: [none, period, as_of, future]}
        max_days: {type: integer, description: Longest range of a period or forecast report.}
        group_bys: {type: array, items: {type: string}}
        filters:
          type: array
          items:
            type: object
            required: [name, kind, required]
            properties:
              name: {type: string}
              kind:
                type: string
                enum: [uuid, uuid_list, text, int, enum]
                description: uuid_list is a comma-separated list of at most `max` ids.
              values: {type: array, items: {type: string}}
              min: {type: integer}
              max: {type: integer}
              required: {type: boolean}
        columns: {type: array, items: {$ref: '#/components/schemas/ReportColumn'}}
        paged: {type: boolean}
        saveable: {type: boolean}
    ReportTable:
      type: object
      required: [report_key, title, from, to, as_of, days, group_by, scope, notes, provisional, columns, rows, totals, summary,
        sections, next_cursor]
      properties:
        report_key: {$ref: '#/components/schemas/ReportKey'}
        title: {type: string}
        from: {type: [string, 'null'], format: date}
        to: {type: [string, 'null'], format: date}
        as_of: {type: [string, 'null'], format: date}
        days: {type: integer}
        group_by: {type: [string, 'null']}
        scope: {type: string, description: 'What the figures count, in the owner''s words.'}
        notes: {type: array, items: {type: string}}
        provisional: {type: boolean, description: A pending cost recalculation may still change the figures.}
        columns: {type: array, items: {$ref: '#/components/schemas/ReportColumn'}}
        rows: {type: array, items: {$ref: '#/components/schemas/ReportRow'}}
        totals: {oneOf: [{$ref: '#/components/schemas/ReportRow'}, {type: 'null'}], description: 'Totals of the whole result, not of the page. nxt and lot_stock compute them with the first page only and return null (and an empty summary) on later pages; keep the first page''s totals.'}
        summary:
          type: array
          items:
            type: object
            required: [key, label, kind, value]
            properties:
              key: {type: string}
              label: {type: string}
              kind: {type: string, enum: [text, money, qty, percent, date, int]}
              value: {type: [string, 'null']}
              previous: {type: [string, 'null']}
        sections:
          type: array
          items:
            type: object
            required: [key, title, columns, rows]
            properties:
              key: {type: string}
              title: {type: string}
              columns: {type: array, items: {$ref: '#/components/schemas/ReportColumn'}}
              rows: {type: array, items: {$ref: '#/components/schemas/ReportRow'}}
              totals: {$ref: '#/components/schemas/ReportRow'}
        next_cursor: {type: [string, 'null']}
