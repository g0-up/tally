        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: invoice_not_editable or invoice_has_payments.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /invoices/{id}/lines:
