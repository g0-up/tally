              available: {$ref: '#/components/schemas/Qty', description: Sellable stock today; expected receipts are not added to it.}
              backlog: {$ref: '#/components/schemas/Qty', description: 'Demand dated before the range, counted on its first day.'}
              undated_incoming: {$ref: '#/components/schemas/Qty', description: 'Pending purchases without an expected date, left out of the projection.'}
              first_shortage_on: {type: [string, 'null'], format: date}
