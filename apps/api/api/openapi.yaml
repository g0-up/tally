  /assembly-orders/{id}:reserve:
    post:
      tags: [kits]
      operationId: reserveAssemblyOrder
      summary: Reserve the components an assembly order still needs
      description: Holds what each item still needs; it may run again after a substitution or a disassembly.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Assembly order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyOrderDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: assembly_order_not_open, assembly_order_changed (send it again) or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_required.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /assembly-orders/{id}:close:
    post:
      tags: [kits]
      operationId: closeAssemblyOrder
      summary: Close an assembly order and release what it still holds
      description: The order takes no more batches; its kits stay in stock and may still be disassembled.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Closed assembly order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyOrderDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: assembly_order_status_invalid, assembly_order_changed or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_required.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /assembly-orders/{id}/substitutions:
    post:
      tags: [kits]
      operationId: substituteAssemblyComponent
      summary: Replace part of an item's remaining quantity with another component
      description: |
        The item keeps what it consumed; the substitute is a new item naming it. Both are held again
        when the order holds stock, so the expected cost follows the actual composition.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssemblySubstitutionRequest'
      responses:
        '201':
          description: Assembly order with the substitute item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyOrderDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: assembly_order_not_open, substitute_exceeds_remaining, assembly_order_changed or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (exceeds_remaining; color_id unknown_color, or color_required for a substitute stocked by color) or idempotency_key_required.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /assembly-orders/{id}/postings:
    post:
      tags: [kits]
      operationId: postAssemblyBatch
      summary: Post an assembly batch
      description: |
        One balanced posting: consumes each component from its exact lot and color (scrap included),
        makes the kits into a new kit lot valued at the components' cost plus the packing cost, links
        the kit lot to its component lots and gives it the earliest component expiry. A batch may
        complete the order partially.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssemblyBatchRequest'
      responses:
        '201':
          description: The batch and the order after it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyBatchResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: assembly_order_not_open, insufficient_stock, assembly_order_changed or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (exceeds_remaining), color_required, lot_mismatch or idempotency_key_required.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /assembly-orders/{id}/disassemblies:
    post:
      tags: [kits]
      operationId: postDisassembly
      summary: Take kits of an assembly order apart (TG)
      description: |
        Takes the kits out of their kit lot and returns each component to the exact lot and color it
        came from, at the cost it went into the kits at; damaged components go on to a quarantine
        lot. The rest of the kits' value (their packing cost and share of the batch's scrap) is
        expensed as a COGS adjustment of the kit SKU. The components given back may be assembled
        again.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisassemblyRequest'
      responses:
        '201':
          description: Disassembly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disassembly'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: kit_lot_exhausted, insufficient_stock (the kits an invoice or a hold reserves stay whole) or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed (exceeds_remaining; reason_id not_found, wrong_kind or inactive) or idempotency_key_required.
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /disassemblies:
