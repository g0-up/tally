          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: base_price_list_locked, or price_list_in_use (deactivate it instead).
          $ref: '#/components/responses/Error'
  /price-lists/{id}/items:
    get:
      tags: [pricing]
      operationId: listPriceListItems
      summary: Prices of a price list by SKU code
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Cursor'
