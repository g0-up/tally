        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [catalog]
      operationId: updateAttributeSet
      summary: Rename or (de)activate an attribute set
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeSetRequest'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeSet'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: name_taken.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /attribute-sets/{id}/items:
    put:
      tags: [catalog]
      operationId: replaceAttributeSetItems
