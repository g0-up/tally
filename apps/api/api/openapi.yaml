  /search:
    get:
      tags: [catalog]
      operationId: search
      summary: Picker search over SKUs, customers or suppliers
      description: |
        An exact code, barcode, phone or tax code match comes first, then words matched anywhere
        ignoring accents and case (`banh dau xanh` finds `Bánh đậu xanh`), prefix matches first.
        Only active SKUs of active products and active customers or suppliers are returned (a
        stopped supplier is left out).
      parameters:
        - {name: type, in: query, required: true, schema: {type: string, enum: [sku, customer, supplier]}}
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 100}}
        - {name: in_stock, in: query, description: SKUs with stock on hand only., schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Candidates, best first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SearchItem'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /customers:
    get:
      tags: [partners]
      operationId: listCustomers
      summary: Customers by name
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - {name: q, in: query, description: 'Name, phone or tax code words, accent-insensitive.', schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive]}}
        - {name: customer_group_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Customers.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/CustomerListItem'}}
                  next_cursor:
                    oneOf:
                      - $ref: '#/components/schemas/Cursor'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags: [partners]
      operationId: createCustomer
      summary: Add a customer, or make an existing supplier a customer
      description: |
        With `party_id` the customer profile is added to an existing partner and the party fields
        are ignored. Possible duplicates (same phone, tax code or name) are returned as warnings,
        never as errors.
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Customer and duplicate warnings; `ETag` carries the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResult'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: already_customer, idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid or validation_failed.
          $ref: '#/components/responses/Error'
  /customers/{id}:
    get:
      tags: [partners]
      operationId: getCustomer
      summary: One customer
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Customer; `ETag` carries the version.
          content:
