          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /skus/{id}/sale-price:
    post:
      tags: [pricing]
      operationId: setSalePrice
      summary: Set or remove a base sale price of a SKU
      description: |
        Writes the retail or wholesale base price of the SKU in one unit, for the general color or
        one color. A null `price` with a color removes that color's own price (the general price
        applies again); `apply_all_colors` sets the general price and drops every color price.
        Only documents priced afterwards see the change.
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalePriceRequest'
      responses:
        '200':
          description: The price history rows written, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PriceChange'}}
                  next_cursor: {type: 'null'}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: base_price_list_missing, idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or idempotency_key_invalid.
          $ref: '#/components/responses/Error'
  /skus/{id}/price-history:
    get:
      tags: [pricing]
      operationId: listPriceHistory
      summary: Price history of a SKU, newest first
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Cursor'
