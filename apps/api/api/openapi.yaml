  /receipts/{id}/landed-costs:
    post:
      tags: [procurement]
      operationId: postLandedCost
      summary: Allocate a landed cost (shipping, loading) over the lines of a receipt
      description: |
        Splits `amount` over the lines that hold goods, `by_value` or `by_qty`, with the
        largest-remainder rule so the parts add up exactly. The part of a line still on hand
        raises its stock value (and the average cost); the part already sold goes to cost of
        goods sold. A `payee_party_id` gets a payable for the cost, optionally paid now.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LandedCostRequest'
      responses:
        '201':
          description: Allocation with its split per line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandedCost'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only or subscription_read_only.
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: receipt_not_posted, receipt_has_no_kept_lines or an idempotency conflict.
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /supplier-documents:
    get:
      tags: [procurement]
      operationId: listSupplierDocuments
      summary: Supplier documents (invoices), newest first
      parameters:
        - {name: supplier_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: receipt_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [unmatched, matched, variance]}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Documents without their receipts.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SupplierDocument'}}
                  next_cursor: {type: [string, 'null']}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          description: validation_failed or invalid_cursor.
          $ref: '#/components/responses/Error'
    post:
      tags: [procurement]
      operationId: createSupplierDocument
      summary: Record a supplier document and match it to receipts
      description: |
        A document never changes a payable: it is compared with the totals of its receipts and
        marked matched or variance. Resolve a variance with a purchase price adjustment. A
        receipt is matched to one supplier document at most (409 receipt_already_matched).
        A retry with the same Idempotency-Key answers the first response with `Idempotent-Replay: true`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierDocumentRequest'
      responses:
        '201':
          description: Document with its receipts; `ETag` carries the version.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierDocument'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: support_read_only.
          $ref: '#/components/responses/Error'
        '409':
          description: supplier_document_exists, receipt_already_matched, idempotency_key_reused or idempotency_key_in_progress.
          $ref: '#/components/responses/Error'
        '422':
          description: idempotency_key_invalid or validation_failed (an unknown, reversed or other supplier's receipt in `fields`).
          $ref: '#/components/responses/Error'
