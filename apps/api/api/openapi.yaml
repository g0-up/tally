  /attachments:
    post:
      tags: [organization]
      operationId: createAttachment
      summary: Declare a file and get a presigned upload
      description: >-
        Photos (JPEG, PNG, WebP) and PDFs up to 10 MB, for a record of the store: a product image,
        the party of a signed debt offset record, a receipt, a supplier document or a support ticket.
        The plan's storage limit applies (409 plan_limit_reached).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type, owner_id, file_name, content_type, size_bytes, sha256]
              properties:
                owner_type: {type: string, enum: [product, party, receipt, supplier_document, support_ticket]}
                owner_id: {type: string, format: uuid, description: Id of a record of the store of owner_type.}
                file_name: {type: string, maxLength: 255}
                content_type: {type: string, enum: [image/jpeg, image/png, image/webp, application/pdf]}
                size_bytes: {type: integer, minimum: 1}
                sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      responses:
        '201':
          description: Pending attachment and the upload request to send to object storage.
          content:
            application/json:
              schema:
                type: object
                required: [attachment, upload]
                properties:
                  attachment:
                    $ref: '#/components/schemas/Attachment'
                  upload:
                    type: object
                    required: [method, url, headers, expires_at]
                    properties:
                      method: {type: string, const: PUT}
                      url: {type: string, format: uri}
                      headers:
                        type: object
                        additionalProperties: {type: string}
                      expires_at: {type: string, format: date-time}
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: plan_limit_reached (`fields.limit` storage_mb).
          $ref: '#/components/responses/Error'
        '422':
          description: >-
            validation_failed; `fields.owner_type` is invalid for a type files cannot be uploaded
            for, `fields.owner_id` is not_found when the store has no such record.
          $ref: '#/components/responses/Error'
