<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tết Sales Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Manrope:wght@600;700&family=Roboto:wght@400;700&display=swap&subset=vietnamese">
<style>
/* Bố cục: thanh điều hướng navy cố định bên trái (theo NavBar của UpNext) + vùng làm việc trắng; card vuông có shadow-card, một CTA gradient mỗi màn hình.
   Hệ thống chỉ định nghĩa theme sáng nên app cam kết một theme sáng, đặt nền và mọi màu tường minh. */
:root {
  color-scheme: light;
  --navy-900: #0a0d53; --navy-700: #233c65; --navy-deep: #001a2d;
  --accent-orange: #f45d29; --accent-crimson: #f2295b; --on-accent: #eaeaea;
  --slate-600: #4b5863; --gray-800: #333333; --gray-600: #555555; --gray-500: #777777; --gray-300: #c4c4c4; --gray-200: #d8d8d8;
  --surface-0: #ffffff; --surface-50: #f5f5f5; --surface-100: #f2f2f2; --surface-blue-50: #e8edf7; --surface-blue-100: #d8e2ec; --surface-dark: #23282d;
  --shadow-card: 0 0 7px 0 rgba(0,0,0,.15); --shadow-card-strong: 0 0 7px 0 rgba(0,0,0,.2); --shadow-float: 0 5px 15px 0 rgba(0,0,0,.15);
  --gradient-accent: linear-gradient(260deg, #f45d29 0%, #f2295b 100%);
  --space-1: 2px; --space-2: 6px; --space-3: 10px; --space-4: 18px; --space-5: 24px; --space-6: 35px; --space-7: 60px;
  --radius-xs: 2px; --radius-sm: 3px; --radius-pill: 50px;
  --font-sans: "Inter Tight", system-ui, sans-serif; --font-display: Manrope, "Inter Tight", system-ui, sans-serif; --font-ui: Roboto, "Inter Tight", system-ui, sans-serif;
  /* bổ sung ngoài hệ thống: màu trạng thái và màu biểu đồ (đã kiểm tra tách màu) */
  --ok-ink: #1d6a3a; --ok-bg: #e7f3eb; --ok-line: #b6dbc3;
  --warn-ink: #7a5200; --warn-bg: #fdf3dc; --warn-line: #efd28c;
  --bad-ink: #a01431; --bad-bg: #fde9ed; --bad-line: #f1b5c2;
  --series-1: #2f5da8; --series-2: #f45d29;
}
html, body { height: 100%; }
body { margin: 0; background: var(--surface-0); color: var(--gray-600); font-family: var(--font-sans); font-size: 14px; line-height: 1.55; letter-spacing: .2px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--navy-700); outline-offset: 2px; }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tab-n { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }

/* ---------- khung ---------- */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--navy-700); color: var(--surface-0); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { padding: 22px 22px 18px; border-bottom: 1px solid rgba(255,255,255,.12); }
.brand b { display: block; font-family: var(--font-display); font-size: 22px; line-height: 1.1; letter-spacing: -.3px; color: var(--surface-0); }
.brand span { display: block; margin-top: 6px; font-size: 12px; color: var(--surface-blue-100); letter-spacing: .5px; }
.nav { padding: 10px 0 24px; }
.nav-g { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: 0; color: var(--surface-0); text-align: left; cursor: pointer;
  font-family: var(--font-ui); font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 10px 22px; }
.nav-g:hover { background: rgba(255,255,255,.06); }
.nav-g .cnt { font-family: var(--font-sans); font-size: 11px; font-weight: 600; background: var(--gradient-accent); color: var(--surface-0); padding: 0 7px; border-radius: var(--radius-pill); letter-spacing: 0; }
.nav-g[aria-expanded="true"] { background: var(--navy-900); }
.nav-sub { background: var(--navy-900); padding: 2px 0 10px; }
.nav-sub a { display: block; padding: 6px 22px 6px 36px; color: var(--surface-blue-100); text-decoration: none; font-size: 14px; }
.nav-sub a:hover { color: var(--surface-0); }
.nav-sub a[aria-current] { color: var(--surface-0); font-weight: 600; background: rgba(255,255,255,.08); }
.side-foot { margin-top: auto; padding: 16px 22px 22px; font-size: 12px; color: var(--surface-blue-100); border-top: 1px solid rgba(255,255,255,.12); }

.util { background: var(--surface-50); border-bottom: 1px solid var(--gray-200); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 8px 28px; font-size: 13px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.util label { display: inline-flex; align-items: center; gap: 6px; color: var(--gray-600); }
.util select { border: 1px solid var(--gray-300); background: var(--surface-0); color: var(--navy-900); padding: 4px 8px; border-radius: var(--radius-xs); font-size: 13px; }
.util .tenant { font-weight: 600; color: var(--navy-900); }
.util .sp { flex: 1; }
.sandbox { display: inline-flex; align-items: center; gap: 6px; background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); padding: 1px 8px; font-size: 12px; font-weight: 600; }
.menu-btn { display: none; }
.bell { position: relative; background: var(--surface-0); border: 1px solid var(--gray-300); color: var(--navy-700); padding: 4px 10px; cursor: pointer; border-radius: var(--radius-xs); font-size: 13px; }
.bell b { color: var(--accent-crimson); }

main.view { padding: 26px 28px 60px; max-width: 1480px; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; margin-bottom: 18px; }
.ph .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--gray-600); margin: 0 0 6px; }
.ph h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.5px; color: var(--navy-900); }
.ph .lead { margin: 6px 0 0; max-width: 72ch; color: var(--gray-600); }
.ph .acts { display: flex; flex-wrap: wrap; gap: 10px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--gray-200); margin: 0 0 22px; overflow-x: auto; }
.tabs a { font-family: var(--font-ui); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--navy-700); text-decoration: none; padding: 10px 14px; white-space: nowrap; border-bottom: 3px solid transparent; }
.tabs a[aria-current] { border-bottom-color: var(--navy-700); color: var(--navy-900); }
.tabs a:hover { background: var(--surface-blue-50); }

/* ---------- nút (UpNext) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none; font-family: var(--font-sans);
  font-size: 13px; line-height: 13px; font-weight: 500; letter-spacing: 1.3px; text-transform: uppercase; padding: 14px 26px; border-radius: var(--radius-pill); transition: filter .2s, background .2s, color .2s; white-space: nowrap; }
.btn-primary { color: var(--surface-0); background-color: var(--navy-700); background-image: var(--gradient-accent); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-navy { color: var(--surface-0); background: var(--navy-700); }
.btn-navy:hover { background: var(--navy-900); }
.btn-line { color: var(--navy-700); background: var(--surface-0); box-shadow: inset 0 0 0 1px var(--navy-700); }
.btn-line:hover { background: var(--surface-blue-50); }
.btn-danger { color: var(--bad-ink); background: var(--surface-0); box-shadow: inset 0 0 0 1px var(--bad-line); }
.btn-sm { font-size: 11px; line-height: 11px; padding: 9px 14px; letter-spacing: 1px; }
.btn[disabled] { opacity: .55; cursor: progress; filter: none; }
.lnk { background: none; border: 0; padding: 0; color: var(--navy-700); font-weight: 600; cursor: pointer; text-decoration: none; text-align: left; }
.lnk:hover { text-decoration: underline; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- thẻ, lưới ---------- */
.card { background: var(--surface-0); box-shadow: var(--shadow-card); padding: var(--space-5); min-width: 0; }
.card h2, .sec-h { font-family: var(--font-sans); font-size: 18px; line-height: 1.3; font-weight: 600; letter-spacing: -.3px; color: var(--navy-700); }
.card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; margin-bottom: 14px; }
.card-h small { color: var(--gray-600); font-size: 12px; }
.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.stack { display: grid; gap: 20px; }
.band { margin-bottom: 22px; }
.band-h { display: flex; align-items: baseline; gap: 12px; margin: 0 0 10px; }
.band-h h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--navy-900); font-weight: 600; }
.band-h span { font-size: 12px; color: var(--gray-600); }
.kpi { background: var(--surface-0); box-shadow: var(--shadow-card); padding: 18px 20px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.kpi.click { cursor: pointer; text-align: left; border: 0; }
.kpi.click:hover { box-shadow: var(--shadow-card-strong); }
.kpi .k { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--gray-600); }
.kpi .v { font-size: 25px; line-height: 1.2; font-weight: 600; letter-spacing: -.3px; color: var(--navy-900); font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 13px; color: var(--gray-600); }
.kpi.forecast { background: var(--surface-blue-50); box-shadow: none; border: 1px dashed var(--navy-700); }
.lock { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--gray-600); background: var(--surface-100); padding: 0 6px; white-space: nowrap; }

/* ---------- bảng ---------- */
.tw { overflow-x: auto; background: var(--surface-0); box-shadow: var(--shadow-card); }
.tw.flat { box-shadow: none; border: 1px solid var(--gray-200); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { background: var(--surface-blue-50); color: var(--navy-900); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; text-align: left; padding: 10px 12px; white-space: nowrap; }
.t td { padding: 10px 12px; border-top: 1px solid var(--gray-200); color: var(--gray-800); vertical-align: top; }
.t tbody tr:hover td { background: #fafbfd; }
.t tfoot td { font-weight: 600; color: var(--navy-900); background: var(--surface-50); border-top: 1px solid var(--gray-300); }
.t .sub { display: block; font-size: 12px; color: var(--gray-600); }
.t .doc { font-weight: 600; color: var(--navy-700); }
.t td.acts { white-space: nowrap; text-align: right; }
.empty { padding: 28px; text-align: center; color: var(--gray-600); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.filters input, .filters select { border: 1px solid var(--gray-300); padding: 8px 10px; background: var(--surface-0); color: var(--gray-800); border-radius: var(--radius-xs); min-width: 0; }
.filters input[type=search] { width: 280px; max-width: 100%; }
.chip { border: 1px solid var(--gray-300); background: var(--surface-0); color: var(--navy-700); padding: 6px 12px; cursor: pointer; font-size: 13px; border-radius: var(--radius-pill); }
.chip[aria-pressed="true"] { background: var(--navy-700); color: var(--surface-0); border-color: var(--navy-700); }

/* ---------- trạng thái: chữ + ký hiệu, không chỉ dùng màu ---------- */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; line-height: 18px; padding: 1px 8px; border: 1px solid var(--surface-blue-100); background: var(--surface-blue-50); color: var(--navy-700); white-space: nowrap; font-weight: 500; }
.st::before { content: "•"; font-weight: 700; }
.st.ok { color: var(--ok-ink); background: var(--ok-bg); border-color: var(--ok-line); } .st.ok::before { content: "✓"; }
.st.warn { color: var(--warn-ink); background: var(--warn-bg); border-color: var(--warn-line); } .st.warn::before { content: "◷"; }
.st.bad { color: var(--bad-ink); background: var(--bad-bg); border-color: var(--bad-line); } .st.bad::before { content: "!"; }
.st.mute { color: var(--gray-600); background: var(--surface-100); border-color: var(--gray-200); } .st.mute::before { content: "–"; }
.tag { display: inline-block; font-size: 11px; line-height: 14px; letter-spacing: .5px; color: var(--surface-0); background: var(--navy-700); padding: var(--space-1) var(--space-2); white-space: nowrap; }
.tag.alt { background: var(--slate-600); }

/* ---------- form ---------- */
.fg { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.f { display: grid; gap: 5px; min-width: 0; }
.f > span { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--gray-600); font-weight: 500; }
.f input, .f select, .f textarea, .in { border: 1px solid var(--gray-300); padding: 9px 11px; background: var(--surface-0); color: var(--gray-800); border-radius: var(--radius-xs); width: 100%; min-width: 0; }
.in.sm { padding: 6px 8px; width: 96px; text-align: right; }
.in.md { width: 140px; }
.f .hint, .hint { font-size: 12px; color: var(--gray-600); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--gray-800); }
.callout { padding: 12px 14px; background: var(--surface-blue-50); border: 1px solid var(--surface-blue-100); color: var(--navy-900); font-size: 13px; }
.callout.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.callout.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad-ink); }
.callout.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); }
.impact { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.impact div { border: 1px solid var(--gray-200); padding: 10px 12px; }
.impact b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--gray-600); font-weight: 600; }
.impact span { color: var(--navy-900); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- modal, ngăn chi tiết, toast ---------- */
.ovl { position: fixed; inset: 0; background: rgba(0, 26, 45, .45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
.modal { background: var(--surface-0); box-shadow: var(--shadow-float); width: 100%; max-width: 760px; display: flex; flex-direction: column; }
.modal.wide { max-width: 1040px; }
.m-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 20px 24px 14px; border-bottom: 1px solid var(--gray-200); }
.m-h h3 { font-family: var(--font-display); font-size: 22px; letter-spacing: -.3px; color: var(--navy-900); }
.m-h p { margin: 4px 0 0; font-size: 13px; color: var(--gray-600); }
.x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--gray-600); cursor: pointer; padding: 4px 8px; }
.m-b { padding: 20px 24px; display: grid; gap: 18px; }
.m-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 14px 24px 20px; border-top: 1px solid var(--gray-200); }
.drw { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, 100%); background: var(--surface-0); box-shadow: var(--shadow-float); z-index: 40; display: flex; flex-direction: column; }
.drw-b { overflow-y: auto; padding: 0 24px 40px; display: grid; gap: 20px; align-content: start; }
.drw .m-h { position: sticky; top: 0; background: var(--surface-0); z-index: 1; padding-left: 24px; padding-right: 24px; }
.drw-scrim { position: fixed; inset: 0; background: rgba(0, 26, 45, .25); z-index: 39; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 20px; }
.kv div b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--gray-600); font-weight: 600; }
.kv div span { color: var(--navy-900); font-weight: 500; }
.toasts { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 8px; max-width: min(440px, calc(100% - 32px)); }
.toast { background: var(--navy-700); color: var(--surface-0); padding: 12px 16px; box-shadow: var(--shadow-float); font-size: 14px; }
.toast.err { background: var(--surface-0); color: var(--bad-ink); box-shadow: var(--shadow-float), inset 4px 0 0 var(--accent-crimson); }
.toast b { font-weight: 600; }

/* ---------- POS ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(320px, 1.3fr); gap: 20px; align-items: start; }
.scan { display: flex; gap: 10px; }
.scan input { flex: 1; font-size: 16px; padding: 12px 14px; border: 2px solid var(--navy-700); border-radius: var(--radius-xs); min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface-0); border: 1px solid var(--gray-200); padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.tile:hover { border-color: var(--navy-700); }
.tile b { color: var(--navy-900); font-weight: 600; font-size: 13px; line-height: 1.3; }
.tile span { font-size: 12px; color: var(--gray-600); }
.tile[disabled] { opacity: .5; cursor: not-allowed; }
.cart-total { font-size: 30px; font-weight: 600; color: var(--navy-900); font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
kbd { font-family: var(--font-ui); font-size: 11px; border: 1px solid var(--gray-300); border-bottom-width: 2px; padding: 0 5px; background: var(--surface-50); color: var(--navy-900); }

/* ---------- biểu đồ & meter ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { fill: var(--gray-600); font-size: 11px; font-family: var(--font-sans); }
.chart .gl { stroke: var(--gray-200); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:hover { fill: rgba(35, 60, 101, .06); }
.tip { position: absolute; pointer-events: none; background: var(--surface-0); box-shadow: var(--shadow-float); padding: 8px 10px; font-size: 12px; color: var(--gray-800); white-space: nowrap; z-index: 2; }
.tip b { color: var(--navy-900); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--gray-600); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.meter { height: 8px; background: var(--surface-100); position: relative; overflow: hidden; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--navy-700); }
.meter.acc > i { background: var(--gradient-accent); }
.todo { display: grid; gap: 0; }
.todo a, .todo button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border: 0; border-top: 1px solid var(--gray-200); background: none; text-align: left; color: var(--gray-800); text-decoration: none; cursor: pointer; width: 100%; }
.todo a:first-child, .todo button:first-child { border-top: 0; }
.todo .n { font-weight: 600; color: var(--navy-900); font-variant-numeric: tabular-nums; }
.todo small { display: block; color: var(--gray-600); font-size: 12px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.steps span { padding: 2px 8px; border: 1px solid var(--gray-200); color: var(--gray-600); }
.steps span.on { border-color: var(--navy-700); color: var(--navy-700); font-weight: 600; }
.steps span.done { background: var(--navy-700); color: var(--surface-0); border-color: var(--navy-700); }
.tl { display: grid; gap: 0; }
.tl div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--gray-200); font-size: 13px; }
.tl div:first-child { border-top: 0; }
.tl time { color: var(--gray-600); font-variant-numeric: tabular-nums; }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.yes { color: var(--ok-ink); font-weight: 700; } .no { color: var(--gray-300); }

/* ---------- v4 ---------- */
.custbar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: baseline; padding: 12px 14px; background: var(--surface-blue-50); border: 1px solid var(--surface-blue-100); }

/* ---------- lookups ---------- */
const prod = id => S.products.find(p => p.id === id) || fail('Không tìm thấy hàng ' + id);
const party = id => S.parties.find(p => p.id === id) || fail('Không tìm thấy đối tác ' + id);
const whOf = id => S.wh.find(w => w.id === id);
const fund = id => S.funds.find(f => f.id === id);
const user = role => S.users.find(u => u.role === role) || S.users[0];
const me = () => user(S.meta.role);

function nextNo(prefix) {
  S.meta.seq[prefix] = (S.meta.seq[prefix] || 0) + 1;
  return prefix + '-' + String(S.meta.seq[prefix]).padStart(4, '0');
}
function log(action, doc, detail) {
  S.audit.unshift({ at: S._clock || S.meta.date, time: S._time || nowTime(), user: me().name, role: S.meta.role, action, doc, detail });
}
function nowTime() { try { return new Date().toTimeString().slice(0, 5); } catch (e) { return '09:00'; } }

/* ---------- tồn kho ---------- */
const isExpired = (l, d = S.meta.date) => !!l.exp && l.exp < d;
const lotsOf = (sku, wh) => S.lots.filter(l => l.sku === sku && (!wh || l.wh === wh) && l.qty > 0);
const onHand = (sku, wh) => sum(lotsOf(sku, wh), l => l.qty);
const sellable = (sku, wh) => sum(lotsOf(sku, wh).filter(l => !l.q && !isExpired(l)), l => l.qty);
const blockedQty = (sku, wh) => onHand(sku, wh) - sellable(sku, wh);
const reserved = (sku, wh) => sum(S.res.filter(r => r.sku === sku && (!wh || r.wh === wh)), r => r.qty);
function avail(sku, wh) {
  const p = prod(sku);
  if (p.type === 'combo') return Math.max(0, Math.min(...p.comps.map(c => Math.floor(avail(c.sku, wh) / c.qty))));
  if (!wh) return sum(S.wh, w => avail(sku, w.id));
  return sellable(sku, wh) - reserved(sku, wh);
}
const inTransit = (sku, toWh) => sum(S.trf.filter(t => t.status === 'Đang chuyển' && (!toWh || t.to === toWh)), t => sum(t.lines.filter(l => l.sku === sku), l => l.qty));
function incoming(sku) {
  return sum(S.po.filter(p => ['Đã duyệt', 'Nhận một phần'].includes(p.status)), p => sum(p.lines.filter(l => l.sku === sku), l => Math.max(0, l.qty - poRecv(p, l.sku))));
}
function backorder(sku) {
  return sum(S.so.filter(o => soOpen(o)), o => sum(o.lines.filter(l => l.sku === sku), l => Math.max(0, soLineRemain(o, l) - soLineRes(o, l.sku) - soLinePending(o, l.sku))));
}

function move(doc, type, sku, wh, lot, qty, cost, date, color) {
  S.moves.push({ date: date || S.meta.date, doc, type, sku, wh, lot, qty, cost: r0(cost), color: color || null });
}
function receiveLot(doc, type, sku, wh, lotNo, exp, qty, unitCost, o = {}) {
  if (qty <= 0) return;
  const p = prod(sku);
  if (!o.keepCost) {
    const total = sum(S.lots.filter(l => l.sku === sku), l => l.qty);
    p.cost = total + qty > 0 ? (Math.max(0, total) * p.cost + qty * unitCost) / (Math.max(0, total) + qty) : unitCost;
  }
  const q = !!o.q, color = o.color || null;
  const l = S.lots.find(x => x.sku === sku && x.wh === wh && x.lot === lotNo && !!x.q === q && (x.color || null) === color);
  if (l) l.qty += qty; else S.lots.push({ sku, wh, lot: lotNo, exp: exp || null, qty, q, src: doc, color });
  move(doc, type, sku, wh, lotNo, qty, o.keepCost ? p.cost : unitCost, o.date, color);
}
/* màu: null/undefined = chưa chọn; 'none' = hàng chưa gán màu; còn lại là mã màu */
const COLOR_NAMES = { xanh: 'Xanh', do: 'Đỏ', tim: 'Tím', vang: 'Vàng', nau: 'Nâu', den: 'Đen', trang: 'Trắng' };
const colorLabel = k => k === 'none' ? '(chưa gán màu)' : 'màu ' + (COLOR_NAMES[k] || k).toLowerCase();
function colorAvail(sku, wh) { const m = {}; lotsOf(sku, wh).filter(l => !l.q && !isExpired(l, S.meta.date)).forEach(l => { const k = l.color || 'none'; m[k] = (m[k] || 0) + l.qty; }); return m; }
/* màu thành phần combo: màu cố định trong công thức combo, nếu không thì màu khách chọn tại quầy */
const comboCompColor = (l, c, ci) => c.color || (l.compColors || {})[ci] || null;
const needsColor = (sku, wh) => Object.entries(colorAvail(sku, wh)).some(([k, v]) => k !== 'none' && v > 0);
function consume(doc, type, sku, wh, qty, o = {}) {
  const date = o.date || S.meta.date;
  let lots = lotsOf(sku, wh).filter(l => o.lot ? l.lot === o.lot && !!l.q === !!o.q : (o.q ? l.q : (!l.q && !isExpired(l, date))));
  if (o.color) lots = lots.filter(l => o.color === 'none' ? !l.color : l.color === o.color);
  lots.sort((a, b) => (o.prefColor ? ((b.color === o.prefColor) - (a.color === o.prefColor)) : 0) || (a.exp || '9999').localeCompare(b.exp || '9999'));
  const have = sum(lots, l => l.qty);
  if (have + 1e-9 < qty) fail(`Không đủ tồn bán được: ${prod(sku).name}${o.color ? ' ' + colorLabel(o.color) : ''} (cần ${fmtQ(sku, qty)}, có ${fmtQ(sku, have)}).`);
  const cost = prod(sku).cost, taken = [];
  let rem = qty;
  for (const l of lots) {
    if (rem <= 0) break;
    const t = Math.min(l.qty, rem);
    l.qty -= t; rem -= t;
    taken.push({ lot: l.lot, exp: l.exp, qty: t, color: l.color || null });
    move(doc, type, sku, wh, l.lot, -t, cost, date, l.color);
  }
  S.lots = S.lots.filter(l => l.qty > 1e-9);
  return { taken, cost };
}
function fmtQ(sku, q) {
  const p = prod(sku);
  const big = p.uoms.filter(u => u.f > 1).sort((a, b) => b.f - a.f)[0];
  const base = `${num(q)} ${p.base}`;
  if (big && q >= big.f) { const n = Math.floor(q / big.f), r = q - n * big.f; return `${base} (${n} ${big.u}${r ? ' + ' + num(r) + ' ' + p.base : ''})`; }
  return base;
}
const num = n => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 2 }).format(n);

/* reservations */
function reserve(src, sku, wh, want) {
  const can = Math.max(0, Math.min(want, avail(sku, wh)));
  if (can > 0) {
    const r = S.res.find(x => x.src === src && x.sku === sku && x.wh === wh);
    if (r) r.qty += can; else S.res.push({ src, sku, wh, qty: can, date: S.meta.date });
  }
  return can;
}
function release(src, sku, qty) {
  S.res.filter(r => r.src === src && (!sku || r.sku === sku)).forEach(r => {
    const t = qty == null ? r.qty : Math.min(r.qty, qty);
    r.qty -= t; if (qty != null) qty -= t;
  });
  S.res = S.res.filter(r => r.qty > 1e-9);
}

/* ---------- nghĩa vụ, thanh toán ---------- */
function addObl(kind, partyId, doc, amount, date, due, extra = {}) {
  const o = Object.assign({ id: doc, kind, party: partyId, doc, date, due, amount: r0(amount), set: [] }, extra);
  S.obl.push(o); return o;
}
const oblRem = o => o.amount - sum(o.set, s => s.amt);
const obl = id => S.obl.find(o => o.id === id);
function settle(o, src, amt, type, date) {
  amt = r0(amt);
  if (amt <= 0) return;
  if (amt > oblRem(o) + 0.5) fail(`Phân bổ ${vnd(amt)} vượt số còn lại ${vnd(oblRem(o))} của ${o.doc}.`);
  o.set.push({ src, amt, type, date: date || S.meta.date });
}
const payUnalloc = p => p.status !== 'Đã ghi' ? 0 : p.amount - sum(p.allocs, a => a.amt) - (p.refunded || 0) - (p.moved || 0);
const advanceOf = (pid, dir) => sum(S.pay.filter(p => p.party === pid && p.dir === dir), payUnalloc);
const arOpen = pid => sum(S.obl.filter(o => o.kind === 'AR' && o.party === pid), oblRem);
const apOpen = pid => sum(S.obl.filter(o => o.kind === 'AP' && o.party === pid), oblRem);

function cashEntry(fundId, amt, doc, cat, o = {}) {
  S.cash.push({ date: o.date || S.meta.date, fund: fundId, amt: r0(amt), doc, cat, party: o.party || null, note: o.note || '', shift: o.shift || null, camp: o.camp || null, verified: o.verified !== false });
}
const fundBal = id => sum(S.cash.filter(c => c.fund === id), c => c.amt);

function postPayment(x) {
  const dir = x.dir, amount = r0(x.amount);
  if (!(amount > 0)) fail('Số tiền phải lớn hơn 0.');
  const allocs = (x.allocs || []).filter(a => a.amt > 0).map(a => ({ obl: a.obl, amt: r0(a.amt) }));
  if (sum(allocs, a => a.amt) > amount + 0.5) fail('Tổng phân bổ vượt số tiền của phiếu.');
  allocs.forEach(a => { const o = obl(a.obl); if (o.party !== x.party) fail('Không phân bổ sang đối tác khác.'); if (a.amt > oblRem(o) + 0.5) fail(`Phân bổ vượt dư nợ của ${o.doc}.`); });
  const id = x.id || nextNo(dir === 'in' ? 'PT' : 'PC');
  const date = x.date || S.meta.date;
  allocs.forEach(a => settle(obl(a.obl), id, a.amt, 'Thanh toán', date));
  cashEntry(x.fund, dir === 'in' ? amount : -amount, id, x.cat || (dir === 'in' ? 'Thu tiền khách' : 'Trả NCC'), { date, party: x.party, note: x.note, shift: x.shift, camp: x.camp });
  const p = { id, dir, party: x.party, fund: x.fund, amount, date, allocs, note: x.note || '', so: x.so || null, po: x.po || null, status: 'Đã ghi', kind: x.kind || (x.so ? 'Đặt cọc' : 'Thanh toán'), bank: x.bank || null };
  S.pay.push(p);
  log(dir === 'in' ? 'Ghi phiếu thu' : 'Ghi phiếu chi', id, `${party(x.party).name} · ${vnd(amount)}${p.kind === 'Đặt cọc' ? ' · cọc ' + x.so : ''}`);
  return p;
}
function allocateAdvance(payId, oblId, amt, date) {
  const p = S.pay.find(x => x.id === payId), o = obl(oblId);
  amt = r0(Math.min(amt, payUnalloc(p), oblRem(o)));
  if (amt <= 0) return 0;
  settle(o, payId, amt, p.kind === 'Đặt cọc' ? 'Phân bổ cọc' : 'Phân bổ ứng trước', date);
  p.allocs.push({ obl: oblId, amt });
  log('Phân bổ ứng trước', payId, `→ ${o.doc} · ${vnd(amt)}`);
  return amt;
}
function suggestAlloc(pid, kind, amount) {
  const list = S.obl.filter(o => o.kind === kind && o.party === pid && oblRem(o) > 0).sort((a, b) => (a.due || a.date).localeCompare(b.due || b.date));
  let rem = amount; const out = [];
  for (const o of list) { const t = Math.min(rem, oblRem(o)); out.push({ obl: o.id, amt: Math.max(0, t) }); rem -= t; }
  return out;
}
function reversePayment(id, reason) {
  const p = S.pay.find(x => x.id === id);
  if (p.status !== 'Đã ghi') fail('Phiếu đã được đảo.');
  if ((p.refunded || 0) > 0) fail('Phiếu đã phát sinh hoàn tiền; xử lý khoản hoàn trước khi đảo.');
  if (!reason) fail('Cần nhập lý do đảo.');
  p.allocs.forEach(a => { const o = obl(a.obl); o.set = o.set.filter(s => s.src !== id); });
  cashEntry(p.fund, p.dir === 'in' ? -p.amount : p.amount, id + '-DAO', 'Đảo phiếu', { party: p.party, note: reason });
  p.status = 'Đã đảo'; p.reason = reason;
  log('Đảo phiếu', id, reason);
}

/* ---------- bán hàng ---------- */
const lineAmt = l => r0(l.qty * l.price * (1 - (l.disc || 0) / 100));
const soTotal = o => sum(o.lines, lineAmt);
const soDelivered = (o, sku) => sum(S.dlv.filter(d => d.so === o.id && d.posted && d.status !== 'Đã hoàn về kho'), d => sum(d.lines.filter(l => l.sku === sku), l => l.qty))
  + sum(S.dlv.filter(d => d.so === o.id && d.status === 'Đã hoàn về kho'), d => sum(d.lines.filter(l => l.sku === sku), l => l.qty - (l.backQty || 0)));
const soLineRes = (o, sku) => sum(S.res.filter(r => r.src === o.id && r.sku === sku), r => r.qty);
const soLinePending = (o, sku) => sum(S.dlv.filter(d => d.so === o.id && !d.posted && d.status !== 'Đã hủy'), d => sum(d.lines.filter(l => l.sku === sku), l => l.qty));
const soLineRemain = (o, l) => Math.max(0, l.qty - (l.cancelled || 0) - soDelivered(o, l.sku));
const soOpen = o => ['Đã xác nhận', 'Giao một phần'].includes(o.status);
function soDeposit(o) { return sum(S.pay.filter(p => p.so === o.id && p.status === 'Đã ghi'), p => p.amount); }
function soDepositLeft(o) { return sum(S.pay.filter(p => p.so === o.id), payUnalloc); }
function soBilled(o) { return sum(S.obl.filter(x => x.kind === 'AR' && x.so === o.id), x => x.amount); }
function soPaid(o) { return sum(S.obl.filter(x => x.kind === 'AR' && x.so === o.id), x => sum(x.set, s => s.amt)); }
function soPayStatus(o) {
  const billed = soBilled(o), paid = soPaid(o), dep = soDepositLeft(o);
  if (!billed && dep) return 'Có tiền cọc';
  if (!billed) return 'Chưa phát sinh';
  if (paid >= billed - 0.5) return dep > 0 ? 'Đủ · còn cọc dư' : 'Đã thanh toán đủ';
  return paid > 0 ? 'Thanh toán một phần' : 'Chưa thanh toán';
}
function soDeliveryStatus(o) {
  const tot = sum(o.lines, l => l.qty - (l.cancelled || 0)), del = sum(o.lines, l => soDelivered(o, l.sku));
  if (!del) return 'Chưa giao'; if (del >= tot) return 'Đã giao đủ'; return 'Giao một phần';
}
function creditExposure(pid, exceptSo) {
  const open = arOpen(pid);
  const pending = sum(S.so.filter(o => o.payer === pid && soOpen(o) && o.id !== exceptSo), o => sum(o.lines, l => soLineRemain(o, l) * l.price * (1 - (l.disc || 0) / 100)));
  return open + pending;
}
function createSO(x) {
  const id = nextNo('SO');
  const o = Object.assign({ id, date: S.meta.date, status: 'Nháp', version: 1, creator: me().name, payer: x.cust, camp: activeCamp(), dueDays: party(x.cust).terms || 0, recvs: [] }, x);
  S.so.unshift(o);
  log('Tạo hóa đơn', id, `${party(o.cust).name} · ${vnd(soTotal(o))}`);
  return o;
}
function soChecks(o) {
  const issues = [];
  const p = party(o.payer);
  const value = soTotal(o) - soDepositLeft(o);
  const exp = creditExposure(o.payer, o.id) + Math.max(0, value);
  if (o.dueDays > 0 && exp > p.limit) issues.push({ type: 'Vượt hạn mức', detail: `Dư nợ + đơn mở sau đơn này ${vnd(exp)} > hạn mức ${vnd(p.limit)}` });
  o.lines.forEach(l => { const pr = prod(l.sku); const net = l.price * (1 - (l.disc || 0) / 100); if (pr.minPrice && net < pr.minPrice) issues.push({ type: 'Giá dưới mức tối thiểu', detail: `${pr.name}: ${vnd(net)} < ${vnd(pr.minPrice)}` }); });
  return issues;
}
function confirmSO(id, o2 = {}) {
  const o = S.so.find(x => x.id === id);
  if (!['Nháp', 'Chờ duyệt'].includes(o.status)) fail('Hóa đơn không ở trạng thái có thể xác nhận.');
  if (!o.lines.length) fail('Hóa đơn chưa có dòng hàng.');
  if (!o2.approved) {
    const iss = soChecks(o);
    if (iss.length) {
      o.status = 'Chờ duyệt';
      iss.forEach(i => requestApproval(i.type, o.id, i.detail, Math.round(soTotal(o))));
      log('Gửi duyệt', o.id, iss.map(i => i.type).join(', '));
      return { pending: iss };
    }
  }
  o.status = 'Đã xác nhận';
  o.lines.forEach(l => { l.res0 = reserve(o.id, l.sku, o.wh, l.qty); });
  log('Xác nhận hóa đơn', o.id, o.lines.map(l => `${prod(l.sku).name}: giữ ${num(l.res0)}/${num(l.qty)}`).join('; '));
  return { ok: true };
}
function topUpReserve(id) {
  const o = S.so.find(x => x.id === id); let got = 0;
  o.lines.forEach(l => { const need = soLineRemain(o, l) - soLineRes(o, l.sku) - soLinePending(o, l.sku); if (need > 0) got += reserve(o.id, l.sku, o.wh, need); });
  log('Giữ thêm hàng', id, 'Giữ thêm ' + num(got)); return got;
}
function cancelRemaining(id, reason) {
  const o = S.so.find(x => x.id === id);
  if (!reason) fail('Cần lý do hủy phần còn lại.');
  if (S.dlv.some(d => d.so === id && !d.posted && d.status !== 'Đã hủy')) fail('Còn phiếu giao chưa xuất kho. Hủy hoặc xuất phiếu đó trước.');
  o.lines.forEach(l => { l.cancelled = (l.cancelled || 0) + soLineRemain(o, l); });
  release(o.id);
  o.status = soDelivered(o, o.lines[0].sku) || o.lines.some(l => soDelivered(o, l.sku)) ? 'Hoàn tất' : 'Đã hủy';
  o.note = (o.note ? o.note + ' · ' : '') + 'Hủy phần còn lại: ' + reason;
  log('Hủy phần chưa giao', id, reason);
}
function createDelivery(soId, lines, x = {}) {
  const o = S.so.find(z => z.id === soId);
  if (!soOpen(o)) fail('Chỉ xuất kho cho hóa đơn đã xác nhận.');
  lines = lines.filter(l => l.qty > 0);
  if (!lines.length) fail('Chưa nhập số lượng xuất.');
  lines.forEach(l => {
    const sl = o.lines.find(z => z.sku === l.sku);
    const free = soLineRes(o, l.sku) - soLinePending(o, l.sku);
    if (l.qty > soLineRemain(o, sl) - soLinePending(o, l.sku)) fail(`${prod(l.sku).name}: vượt lượng còn phải giao.`);
    if (l.qty > free) fail(`${prod(l.sku).name}: chỉ còn ${num(free)} đã giữ cho hóa đơn. Giữ thêm hàng trước khi xuất kho.`);
    l.price = sl.price * (1 - (sl.disc || 0) / 100); l.color = sl.color || null;
  });
  const id = nextNo('PX');
  const d = { id, so: soId, date: x.date || S.meta.date, wh: o.wh, lines, recipient: x.recipient || party(o.cust).name, addr: x.addr || party(o.cust).addr, phone: x.phone || party(o.cust).phone, carrier: x.carrier || 'Nội bộ', cod: !!x.cod, status: 'Chờ soạn', posted: false, trip: null, waybill: null, sched: x.sched || S.meta.date };
  S.dlv.unshift(d);
  log('Tạo phiếu giao', id, `${soId} · ${lines.map(l => num(l.qty) + ' ' + prod(l.sku).base + ' ' + prod(l.sku).name).join(', ')}`);
  return d;
}
function pickDelivery(id) { const d = S.dlv.find(x => x.id === id); if (d.status !== 'Chờ soạn') fail('Phiếu không ở trạng thái chờ soạn.'); d.status = 'Đã soạn'; log('Soạn xong', id, ''); }
function postDelivery(id, x = {}) {
  const d = S.dlv.find(z => z.id === id);
  if (d.posted) fail('Phiếu đã xuất kho. Không ghi sổ lần hai.');
  const o = S.so.find(z => z.id === d.so);
  const date = x.date || S.meta.date;
  d.lines.forEach(l => { release(o.id, l.sku, l.qty); });
  d.lines.forEach(l => { const c = consume(d.id, 'Xuất bán', l.sku, d.wh, l.qty, l.color ? { date, color: l.color } : { date }); l.cost = c.cost; l.taken = c.taken; });
  d.posted = true; d.postedAt = date; d.status = d.carrier === 'Nhận tại kho' ? 'Giao thành công' : 'Đang giao';
  const bh = nextNo('BH');
  const amount = sum(d.lines, l => r0(l.qty * l.price));
  S.sdoc.unshift({ id: bh, src: d.id, so: o.id, party: o.payer, date, lines: d.lines.map(l => Object.assign({ sku: l.sku, qty: l.qty, price: l.price, cost: l.cost, taken: l.taken }, l.color ? { color: l.color } : {})), revenue: amount, cogs: sum(d.lines, l => l.qty * l.cost), camp: o.camp, channel: 'Bán sỉ', seller: o.creator, branch: whOf(d.wh).branch });
  d.sdoc = bh;
  const ob = addObl('AR', o.payer, bh, amount, date, addDays(date, o.dueDays || 0), { so: o.id, src: d.id });
  // phân bổ cọc của đơn
  S.pay.filter(p => p.so === o.id && payUnalloc(p) > 0).forEach(p => allocateAdvance(p.id, ob.id, payUnalloc(p), date));

  log('Xuất kho giao hàng', d.id, `Ghi ${bh}: doanh thu ${vnd(amount)}, phải thu ${party(o.payer).name}`);

}

function collectorName(id) { if (id === 'VC01') return 'Bắc Hà Express'; const u = S.users.find(u => 'NV-' + u.id === id); return u ? u.name + ' (giao hàng)' : id; }
function returnDeliveryToStock(id) {

function salesReturn(sdocId, lines, reason, x = {}) {
  const sd = S.sdoc.find(s => s.id === sdocId) || fail('Không tìm thấy chứng từ bán gốc.');
  lines = lines.filter(l => l.qty > 0);
  if (!lines.length) fail('Chưa chọn số lượng trả.');
  if (!reason) fail('Cần chọn lý do trả.');
  lines.forEach(l => {
    const all = sd.lines.filter(z => z.sku === l.sku); if (!all.length) fail(`${prod(l.sku).name} không có trên chứng từ gốc.`);
    const byCol = l.color ? all.filter(z => (z.color || null) === l.color) : [];
    const sls = byCol.length ? byCol : all;
    const sl = Object.assign({}, sls[0], { qty: sum(sls, z => z.qty) });
    const already = sum(S.sret.filter(r => r.sdoc === sdocId), r => sum(r.lines.filter(z => z.sku === l.sku && (!byCol.length || (z.color || null) === l.color)), z => z.qty));
    if (l.qty > sl.qty - already) fail(`${prod(l.sku).name}: trả vượt lượng đã giao (còn được trả ${num(sl.qty - already)}).`);
    l.price = sl.price; l.cost = sl.cost;
  });
  const id = nextNo('TH');
  const wh = x.wh || (S.dlv.find(d => d.id === sd.src) || {}).wh || 'K1';
  const dsrc = S.dlv.find(d => d.id === sd.src);
  lines.forEach(l => { const dl = (dsrc && (dsrc.lines.find(z => z.sku === l.sku && l.color && z.color === l.color) || dsrc.lines.find(z => z.sku === l.sku))) || sd.lines.find(z => z.sku === l.sku && z.taken && (!l.color || z.color === l.color)) || sd.lines.find(z => z.sku === l.sku && z.taken); const tk = (l.color && dl && dl.taken && dl.taken.find(t => (t.color || 'none') === l.color)) || (dl && dl.taken && dl.taken[0]); receiveLot(id, 'Nhập trả hàng', l.sku, wh, tk ? tk.lot : 'TRA-' + id, tk ? tk.exp : null, l.qty, l.cost, { q: x.quarantine !== false, keepCost: true, color: l.color && l.color !== 'none' ? l.color : (tk ? tk.color : null) }); });
  const amount = sum(lines, l => r0(l.qty * l.price));
  const ob = S.obl.find(o => o.id === sdocId);
  const credit = Math.min(amount, ob ? oblRem(ob) : 0);
  if (credit > 0) settle(ob, id, credit, 'Giảm nợ do trả hàng');
  const refund = amount - credit;
  const r = { id, sdoc: sdocId, party: sd.party, date: S.meta.date, lines, amount, credit, refund, refunded: 0, reason, wh, cogs: sum(lines, l => l.qty * l.cost), camp: sd.camp };
  S.sret.unshift(r);
  log('Ghi nhận trả hàng', id, `${sdocId} · ${vnd(amount)} · giảm nợ ${vnd(credit)}${refund ? ' · cần hoàn ' + vnd(refund) : ''} · ${x.quarantine !== false ? 'hàng vào khu cách ly' : 'hàng nhập lại bán được'}`);
  return r;
}
function refundReturn(id, fundId) {
  const r = S.sret.find(x => x.id === id);
  const due = r.refund - r.refunded; if (due <= 0) fail('Không còn khoản cần hoàn.');
  const pc = nextNo('PC');
  cashEntry(fundId, -due, pc, 'Hoàn tiền khách', { party: r.party, note: 'Hoàn tiền ' + id });
  S.pay.push({ id: pc, dir: 'out', party: r.party, fund: fundId, amount: due, date: S.meta.date, allocs: [], note: 'Hoàn tiền trả hàng ' + id, status: 'Đã ghi', kind: 'Hoàn tiền', refundOf: id, refunded: due });
  r.refunded += due; log('Hoàn tiền khách', pc, `${id} · ${vnd(due)}`);
}

/* POS */
function posSale(x) {
  const shift = S.shifts.find(s => s.id === x.shift && s.status === 'Đang mở') || fail('Chưa mở ca bán hàng. Mở ca trước khi bán.');
  if (!x.lines.length) fail('Giỏ hàng trống.');
  const wh = shift.wh, date = S.meta.date;
  const need = {};
  x.lines.forEach(l => { const p = prod(l.sku); (p.type === 'combo' ? p.comps.map(c => ({ sku: c.sku, q: c.qty * l.qty })) : [{ sku: l.sku, q: l.qty }]).forEach(c => need[c.sku] = (need[c.sku] || 0) + c.q); });
  Object.entries(need).forEach(([sku, q]) => { if (q > avail(sku, wh)) fail(`${prod(sku).name}: chỉ còn ${num(avail(sku, wh))} ${prod(sku).base} có thể bán.`); });
  const byColor = {};
  x.lines.forEach(l => { const p = prod(l.sku);
    if (p.type === 'combo') { p.comps.forEach((c, ci) => { const col = comboCompColor(l, c, ci);
      if (!col && needsColor(c.sku, wh)) fail(`Chọn màu cho ${prod(c.sku).name} trong ${p.name}.`);
      if (col) { const k = c.sku + '|' + col; byColor[k] = (byColor[k] || 0) + c.qty * l.qty; } }); return; }
    if (!l.color && needsColor(l.sku, wh)) fail(`Chọn màu cho ${p.name}: hàng này đang có tồn theo màu, cần biết khách lấy màu nào để trừ đúng kho.`);
    if (l.color) { const k = l.sku + '|' + l.color; byColor[k] = (byColor[k] || 0) + l.qty; } });
  Object.entries(byColor).forEach(([k, q]) => { const [sku, c] = k.split('|'); const have = colorAvail(sku, wh)[c] || 0; if (q > have + 1e-9) fail(`${prod(sku).name} ${colorLabel(c)}: chỉ còn ${num(have)} ${prod(sku).base}.`); });
  const total = sum(x.lines, lineAmt);
  const paid = sum(x.pays, p => p.amt);
  const custP = party(x.cust);
  if (paid < total - 0.5) {
    if (!x.credit) fail('Khách trả chưa đủ. Chọn "Bán chịu phần còn lại" nếu được phép.');
    if (!can('sellCredit')) fail('Vai trò hiện tại không có quyền bán chịu.');
    if (x.cust === 'KH001') fail('Không bán chịu cho khách lẻ. Chọn khách có hồ sơ công nợ.');
    if (creditExposure(x.cust) + total - paid > custP.limit) fail(`Vượt hạn mức nợ của ${custP.name}. Cần duyệt ngoại lệ.`);
  }
  const id = nextNo('HD');
  const lines = [];
  x.lines.forEach(l => {
    const p = prod(l.sku);
    if (p.type === 'combo') {
      let cost = 0; const comps = [];
      p.comps.forEach((c, ci) => { const col = comboCompColor(l, c, ci); const r = consume(id, 'Xuất bán combo', c.sku, wh, c.qty * l.qty, col ? { color: col } : {}); cost += r.cost * c.qty; comps.push(Object.assign({ sku: c.sku, qty: c.qty * l.qty, taken: r.taken }, col ? { color: col } : {})); });
      lines.push({ sku: l.sku, qty: l.qty, price: l.price * (1 - (l.disc || 0) / 100), cost, comps });
    } else {
      const r = consume(id, 'Xuất bán POS', l.sku, wh, l.qty, l.color ? { color: l.color } : {}); lines.push(Object.assign({ sku: l.sku, qty: l.qty, price: l.price * (1 - (l.disc || 0) / 100), cost: r.cost, taken: r.taken }, l.color ? { color: l.color } : {}));
    }
  });
  S.sdoc.unshift({ id, src: id, so: null, party: x.cust, date, lines, revenue: total, cogs: sum(lines, l => l.qty * l.cost), camp: activeCamp(), channel: 'POS', seller: me().name, branch: whOf(wh).branch, shift: shift.id });
  const ob = addObl('AR', x.cust, id, total, date, addDays(date, x.credit ? (custP.terms || 7) : 0));
  let change = 0;
  x.pays.filter(p => p.amt > 0).forEach(p => {
    let amt = p.amt;
    const rem = oblRem(ob);
    if (p.fund === shift.fund && amt > rem) { change = amt - rem; amt = rem; }
    if (amt <= 0) return;
    postPayment({ dir: 'in', party: x.cust, fund: p.fund, amount: amt, allocs: [{ obl: ob.id, amt: Math.min(amt, oblRem(ob)) }], note: 'Thanh toán ' + id, shift: p.fund === shift.fund ? shift.id : null, cat: 'Thu bán hàng', camp: activeCamp() });
  });
  log('Bán tại quầy', id, `${vnd(total)} · ${x.pays.filter(p => p.amt > 0).map(p => fund(p.fund).short + ' ' + vnd(p.amt)).join(' + ')}${change ? ' · trả lại ' + vnd(change) : ''}`);
  return { id, total, change };
}

/* báo giá */
function quoteToSO(id) {
  const q = S.quotes.find(x => x.id === id);
  if (q.status !== 'Khách chấp nhận') fail('Chỉ chuyển đơn khi khách đã chấp nhận báo giá.');
  if (q.validTo < S.meta.date) fail('Báo giá đã hết hiệu lực. Tạo phiên bản mới.');
  const o = createSO({ cust: q.cust, wh: 'K1', lines: q.lines.map(l => Object.assign({}, l)), note: 'Từ ' + q.id + ' v' + q.version, quote: q.id });
  q.status = 'Đã chuyển đơn'; q.so = o.id; return o;
}

/* ---------- mua hàng ---------- */
const poTotal = p => sum(p.lines, l => r0(l.qty * l.price));
const poRecv = (p, sku) => sum(S.rcv.filter(r => r.po === p.id), r => sum(r.lines.filter(l => l.sku === sku), l => l.qty));
const poRet = (p, sku) => sum(S.prt.filter(r => r.po === p.id), r => sum(r.lines.filter(l => l.sku === sku), l => l.qty));
function createPO(x) {
  const id = nextNo('PO');
  const p = Object.assign({ id, date: S.meta.date, status: 'Nháp', creator: me().name, terms: party(x.sup).terms, camp: activeCamp() }, x);
  S.po.unshift(p); log('Tạo đơn nhập', id, `${party(p.sup).name} · ${vnd(poTotal(p))}`); return p;
}
function submitPO(id) {
  const p = S.po.find(x => x.id === id);
  if (poTotal(p) > 30000000) { p.status = 'Chờ duyệt'; requestApproval('Duyệt đơn nhập', id, `Giá trị ${vnd(poTotal(p))} > ngưỡng 30.000.000 ₫`, poTotal(p)); return 'Chờ duyệt'; }
  p.status = 'Đã duyệt'; log('Duyệt đơn nhập', id, 'Dưới ngưỡng, tự duyệt theo chính sách'); return 'Đã duyệt';
}
function receive(x) {
  const id = nextNo('PN');
  const p = x.po ? S.po.find(z => z.id === x.po) : null;
  if (p && !['Đã duyệt', 'Nhận một phần'].includes(p.status)) fail('Đơn nhập chưa duyệt hoặc đã đóng.');
  const lines = x.lines.filter(l => l.qty > 0);
  if (!lines.length) fail('Chưa nhập số lượng thực nhận.');
  lines.forEach(l => {
    const pr = prod(l.sku);
    if (pr.track && !l.lot) fail(`${pr.name}: bắt buộc nhập số lô.`);
    if (pr.track && !l.exp) fail(`${pr.name}: bắt buộc nhập hạn dùng.`);
    if (p) {
      const pl = p.lines.find(z => z.sku === l.sku);
      const remain = pl.qty - poRecv(p, l.sku);
      if (l.qty > remain * 1.05 + 1e-9 && !x.overOk) fail(`${pr.name}: nhận ${num(l.qty)} vượt dung sai 5% so với còn chờ ${num(remain)}. Cần duyệt nhận vượt.`);
      l.price = pl.price;
    }
  });
  const goods = sum(lines, l => l.qty * l.price);
  const extra = x.extra || 0;
  lines.forEach(l => {
    const alloc = goods ? extra * (l.qty * l.price) / goods : 0;
    l.unitCost = l.price + alloc / l.qty;
    receiveLot(id, 'Nhập mua', l.sku, x.wh, l.lot || 'NL-' + id, l.exp, l.qty, l.unitCost, { date: x.date, color: l.color });
  });
  const date = x.date || S.meta.date;
  const sup = p ? p.sup : x.sup;
  const amount = r0(goods);
  const ob = addObl('AP', sup, id, amount, date, addDays(date, party(sup).terms || 0), { po: p && p.id });
  if (extra > 0) cashEntry(x.extraFund || 'TM-CN1', -extra, id, 'Chi phí mua (vận chuyển, bốc xếp)', { date, note: 'Phân bổ vào giá vốn ' + id });
  S.rcv.unshift({ id, po: p && p.id, sup, date, wh: x.wh, lines, amount, extra, invoice: x.invoice || null, note: x.note || '' });
  if (p) {
    p.status = p.lines.every(l => poRecv(p, l.sku) >= l.qty) ? 'Hoàn tất' : 'Nhận một phần';
    S.pay.filter(z => z.po === p.id && payUnalloc(z) > 0).forEach(z => allocateAdvance(z.id, ob.id, payUnalloc(z), date));
  }
  log('Nhập kho', id, `${party(sup).name} · ${vnd(amount)}${p ? ' · theo ' + p.id : ' · nhập nhanh'}${extra ? ' · chi phí mua ' + vnd(extra) : ''}`);
  return { id, ob };
}
function closePOShort(id, reason) {
  const p = S.po.find(x => x.id === id);
  if (!reason) fail('Cần lý do đóng phần thiếu.');
  p.status = 'Đóng – thiếu'; p.closeReason = reason; log('Đóng PO còn thiếu', id, reason);
}
function supplierReturn(rcvId, lines, reason) {
  const rc = S.rcv.find(r => r.id === rcvId);
  lines = lines.filter(l => l.qty > 0);
  if (!lines.length) fail('Chưa nhập số lượng trả.');
  if (!reason) fail('Cần lý do trả NCC.');
  const id = nextNo('XT');
  lines.forEach(l => {
    const rl = (l.idx != null && rc.lines[l.idx]) || rc.lines.find(z => z.sku === l.sku && (z.color || null) === (l.color || null)) || rc.lines.find(z => z.sku === l.sku);
    consume(id, 'Xuất trả NCC', l.sku, rc.wh, l.qty, { lot: rl.lot, q: false, color: rl.color || 'none' });
    l.price = rl.price; l.lot = rl.lot; l.color = rl.color || null; delete l.idx;
  });
  const amount = sum(lines, l => r0(l.qty * l.price));
  const ob = obl(rcvId);
  const credit = Math.min(amount, oblRem(ob));
  if (credit > 0) settle(ob, id, credit, 'Giảm nợ do trả NCC');
  S.prt.unshift({ id, rcv: rcvId, po: rc.po, sup: rc.sup, date: S.meta.date, lines, amount, credit, supRefund: amount - credit, reason });
  log('Trả hàng NCC', id, `${party(rc.sup).name} · ${vnd(amount)} · giảm phải trả ${vnd(credit)}`);
}
function purchaseSuggestions() {
  return S.products.filter(p => p.type === 'goods' || p.type === 'material').map(p => {
    const av = avail(p.id), inc = incoming(p.id), bo = backorder(p.id);
    const kitNeed = 0;
    const target = p.min * 2;
    const gap = Math.max(0, target + bo - av - inc - kitNeed);
    return { p, av, inc, bo, target, gap };
  }).filter(x => x.gap > 0);
}

/* ---------- kho ---------- */
function transferShip(x) {
  if (x.from === x.to) fail('Kho nguồn và kho đích phải khác nhau.');
  const lines = x.lines.filter(l => l.qty > 0);
  if (!lines.length) fail('Chưa nhập số lượng chuyển.');
  lines.forEach(l => { if (l.qty > avail(l.sku, x.from)) fail(`${prod(l.sku).name}: chỉ còn ${num(avail(l.sku, x.from))} có thể chuyển.`); });
  const id = nextNo('CK');
  const out = lines.map(l => { const c = consume(id, 'Xuất chuyển kho', l.sku, x.from, l.qty); return { sku: l.sku, qty: l.qty, taken: c.taken, cost: c.cost }; });
  S.trf.unshift({ id, from: x.from, to: x.to, date: S.meta.date, lines: out, status: 'Đang chuyển', note: x.note || '' });
  log('Xuất chuyển kho', id, `${whOf(x.from).name} → ${whOf(x.to).name}`);
}
function transferReceive(id, got) {
  const t = S.trf.find(x => x.id === id);
  if (t.status !== 'Đang chuyển') fail('Phiếu chuyển đã nhận.');
  let short = [];
  t.lines.forEach((l, i) => {
    let left = Math.min(got[i] ?? l.qty, l.qty);
    l.recv = left;
    l.taken.forEach(tk => { const q = Math.min(tk.qty, left); if (q > 0) receiveLot(id, 'Nhận chuyển kho', l.sku, t.to, tk.lot, tk.exp, q, l.cost, { keepCost: true }); left -= q; });
    if (l.recv < l.qty) short.push(`${prod(l.sku).name} thiếu ${num(l.qty - l.recv)}`);
  });
  t.status = short.length ? 'Nhận thiếu – có biên bản' : 'Đã nhận';
  t.recvDate = S.meta.date; t.shortNote = short.join('; ');
  if (short.length) t.lines.filter(l => l.recv < l.qty).forEach(l => S.adj.unshift({ id: id + '-BB', date: S.meta.date, type: 'Hao hụt chuyển kho', sku: l.sku, wh: t.to, qty: l.qty - l.recv, reason: 'Biên bản nhận thiếu ' + id, value: (l.qty - l.recv) * l.cost, status: 'Đã ghi sổ' }));
  log('Nhận chuyển kho', id, short.length ? 'Biên bản chênh lệch: ' + t.shortNote : 'Nhận đủ');
}
function startCount(wh, group) {
  const id = nextNo('KK');
  const skus = S.products.filter(p => (p.type !== 'combo') && (!group || p.group === group) && onHand(p.id, wh) > 0);
  S.counts.unshift({ id, wh, group: group || 'Toàn kho', cutoff: S.meta.date + ' ' + nowTime(), status: 'Đang đếm', blind: true, lines: skus.flatMap(p => { const cs = colorStock(p.id, wh), ks = Object.keys(cs).filter(k => cs[k] > 0); return ks.some(k => k) ? ks.map(k => ({ sku: p.id, color: k || 'none', sys: cs[k], counted: null })) : [{ sku: p.id, sys: onHand(p.id, wh), counted: null }]; }) });
  log('Bắt đầu kiểm kê', id, `${whOf(wh).name} · ${skus.length} mã · đếm mù`);
  return id;
}
function submitCount(id) {
  const c = S.counts.find(x => x.id === id);
  if (c.lines.some(l => l.counted == null || l.counted === '')) fail('Còn dòng chưa nhập số đếm.');
  // đối chiếu giao dịch phát sinh sau cutoff
  c.lines.forEach(l => { l.diff = Number(l.counted) - l.sys; });
  c.status = 'Chờ duyệt';
  const total = sum(c.lines, l => Math.abs(l.diff) * prod(l.sku).cost);
  if (c.lines.some(l => l.diff !== 0)) requestApproval('Chênh lệch kiểm kê', id, `${c.lines.filter(l => l.diff).length} mã lệch · giá trị tuyệt đối ${vnd(total)}`, total);
  else postCount(id);
  log('Gửi duyệt kiểm kê', id, '');
}
function postCount(id) {
  const c = S.counts.find(x => x.id === id);

    const col = l.color ? { color: l.color } : {};

    else receiveLot(id, 'Điều chỉnh kiểm kê', l.sku, c.wh, 'KK-' + id, null, l.diff, prod(l.sku).cost, { keepCost: true, color: l.color && l.color !== 'none' ? l.color : null });
  });
  c.status = 'Đã ghi sổ'; log('Ghi sổ kiểm kê', id, `${c.lines.filter(l => l.diff).length} dòng chênh lệch`);
}
function adjustStock(x) {

  if (!x.lot && !x.color && needsColor(x.sku, x.wh)) fail(`Chọn màu cho ${prod(x.sku).name}: hàng này đang có tồn theo màu.`);
  const c = consume(id, x.type, x.sku, x.wh, x.qty, Object.assign(x.lot ? { lot: x.lot, q: !!x.q } : {}, x.color ? { color: x.color } : {}));
  S.adj.unshift(Object.assign({ id, date: S.meta.date, type: x.type, sku: x.sku, wh: x.wh, qty: x.qty, reason: x.reason, value: c.cost * x.qty, lots: c.taken, status: 'Đã ghi sổ' }, x.color ? { color: x.color } : {}));
  log('Điều chỉnh kho', id, `${x.type}: ${prod(x.sku).name} −${num(x.qty)} · ${x.reason}`);
}
function releaseQuarantine(sku, wh, lot, ok) {
  const l = S.lots.find(z => z.sku === sku && z.wh === wh && z.lot === lot && z.q) || fail('Không tìm thấy lô cách ly.');
  const qty = l.qty;
  if (ok) {
    const id = nextNo('DC');

    S.adj.unshift({ id, date: S.meta.date, type: 'Khôi phục bán được', sku, wh, qty, reason: 'Kiểm tra đạt, quản lý duyệt', value: 0, status: 'Đã ghi sổ' });
    log('Khôi phục hàng cách ly', id, `${prod(sku).name} ${num(qty)} · lô ${lot}`);
  } else {
    adjustStock({ type: 'Tiêu hủy', sku, wh, qty, lot, q: true, reason: 'Hàng cách ly không đạt kiểm tra' });
  }
}

/* ---------- giỏ quà ---------- */
function recipeCost(rc) { return sum(rc.comps, c => c.qty * prod(c.sku).cost) + rc.packCost; }
function createAssembly(recipeId, wh, plan, so) {
  const rc = S.recipes.find(r => r.id === recipeId);
  if (!(plan > 0)) fail('Số lượng kế hoạch phải lớn hơn 0.');
  const id = nextNo('LD');
  S.asm.unshift({ id, recipe: recipeId, kit: rc.kit, wh, plan, done: 0, status: 'Nháp', date: S.meta.date, so: so || null, steps: { soan: 0, dong: 0, qc: 0 } });
  log('Tạo lệnh đóng giỏ', id, `${prod(rc.kit).name} × ${plan}`);
  return id;
}
function approveAssembly(id) {
  const a = S.asm.find(x => x.id === id), rc = S.recipes.find(r => r.id === a.recipe);
  const short = [];
  rc.comps.forEach(c => { const need = c.qty * (a.plan - a.done); const got = reserve(a.id, c.sku, a.wh, need); if (got < need) short.push(`${prod(c.sku).name} thiếu ${num(need - got)}`); });
  a.status = 'Đang đóng'; a.short = short.join('; ');
  log('Duyệt & giữ nguyên liệu', id, short.length ? 'Thiếu: ' + a.short : 'Giữ đủ nguyên liệu');
}
function completeAssembly(id, qty, x = {}) {
  const a = S.asm.find(z => z.id === id), rc = S.recipes.find(r => r.id === a.recipe);
  if (a.status !== 'Đang đóng') fail('Lệnh chưa ở trạng thái đang đóng.');
  if (!(qty > 0) || qty > a.plan - a.done) fail(`Số lượng hoàn thành phải từ 1 đến ${a.plan - a.done}.`);
  const date = x.date || S.meta.date;
  const post = a.id + '/' + (S.gen.filter(g => g.asm === a.id).length + 1);
  let value = 0, minExp = null; const used = [];
  rc.comps.forEach(c => {
    const need = c.qty * qty;
    release(a.id, c.sku, need);
    const r = consume(post, 'Xuất đóng giỏ', c.sku, a.wh, need, c.color ? { date, color: c.color } : { date });
    value += r.cost * need;
    r.taken.forEach(t => { if (t.exp && (!minExp || t.exp < minExp)) minExp = t.exp; used.push({ sku: c.sku, lot: t.lot, exp: t.exp, qty: t.qty, color: t.color || null }); });
  });
  value += rc.packCost * qty;
  receiveLot(post, 'Nhập giỏ thành phẩm', a.kit, a.wh, a.id, minExp, qty, value / qty, { date });
  S.gen.unshift({ asm: a.id, post, date, kit: a.kit, kitLot: a.id, qty, exp: minExp, used, unitCost: value / qty, ver: rc.ver });
  a.done += qty;
  if (a.done >= a.plan) { a.status = 'Hoàn thành'; release(a.id); }
  log('Hoàn thành đóng giỏ', post, `${num(qty)} ${prod(a.kit).name} · giá vốn ${vnd(value / qty)}/giỏ · hạn ${minExp}`);
}
function disassemble(kit, wh, qty, damagedPkg) {
  if (!(qty > 0)) fail('Số lượng tháo phải lớn hơn 0.');
  if (qty > avail(kit, wh)) fail(`Chỉ còn ${num(avail(kit, wh))} giỏ có thể tháo tại ${whOf(wh).name}.`);
  const id = nextNo('TG');
  const r = consume(id, 'Xuất tháo giỏ', kit, wh, qty);
  // trả lại thành phần theo genealogy lô (lấy lần đóng gần nhất có lô tương ứng)
  r.taken.forEach(tk => {
    const g = S.gen.find(x => x.kitLot === tk.lot && x.kit === kit) || S.gen.find(x => x.kit === kit);
    const rc = (g && S.recipes.find(r => r.kit === kit && r.ver === g.ver)) || activeRecipe(kit);
    rc.comps.forEach(c => {
      const pr = prod(c.sku);
      if (pr.type === 'material' && damagedPkg) return;
      let need = c.qty * tk.qty;
      const src = g ? g.used.filter(z => z.sku === c.sku && (!c.color || z.color === c.color)) : [];
      src.forEach(u => { if (need <= 0) return; const q = Math.min(need, u.qty); need -= q; receiveLot(id, 'Nhập lại từ tháo giỏ', c.sku, wh, u.lot, u.exp, q, pr.cost, { keepCost: true, color: u.color || null }); });
      if (need > 0) receiveLot(id, 'Nhập lại từ tháo giỏ', c.sku, wh, (src[0] || {}).lot || 'TG-' + id, (src[0] || {}).exp || null, need, pr.cost, { keepCost: true, color: c.color || (src[0] || {}).color || null });
    });
  });
  S.disasm.unshift({ id, kit, wh, qty, date: S.meta.date, damagedPkg, value: r.cost * qty });
  log('Tháo giỏ', id, `${num(qty)} ${prod(kit).name}${damagedPkg ? ' · vật tư bao bì hỏng, không nhập lại' : ''}`);
}


/* ---------- tạo giỏ / combo, phiên bản công thức ---------- */
function validateComps(comps, selfId) {
  comps = comps.filter(c => c.sku);
  if (comps.length < 2) fail('Giỏ hoặc combo cần ít nhất 2 thành phần.');
  const seen = {};
  comps.forEach(c => {
    const p = prod(c.sku);
    if (['kit', 'combo'].includes(p.type)) fail(`${p.name} là giỏ/combo, không dùng làm thành phần.`);
    if (c.sku === selfId) fail('Không dùng chính giỏ làm thành phần.');
    if (!(c.qty > 0)) fail(`${p.name}: số lượng phải lớn hơn 0.`);
    const key = c.sku + '|' + (c.color || '');
    if (seen[key]) fail(`${p.name}${c.color ? ' (cùng màu)' : ''} bị lặp. Gộp vào một dòng hoặc chọn màu khác.`);
    seen[key] = 1;
  });
  return comps.map(c => Object.assign({ sku: c.sku, qty: c.qty }, c.color ? { color: c.color } : {}));
}
function compCost(comps, pack) { return sum(comps.filter(c => c.sku), c => c.qty * prod(c.sku).cost) + (pack || 0); }
function createKitProduct(x) {
  const id = String(x.id || '').trim().toUpperCase();
  if (!id || !x.name) fail('Cần mã và tên giỏ/combo.');
  if (S.products.some(p => p.id === id)) fail('Mã ' + id + ' đã tồn tại trong cửa hàng.');
  if (!(x.price > 0)) fail('Nhập giá bán lẻ.');
  const comps = validateComps(x.comps, id);
  const cost = compCost(comps, x.kind === 'kit' ? x.packCost : 0);
  const base = { id, name: x.name, group: x.kind === 'kit' ? 'Giỏ quà' : 'Combo', uoms: [], price: x.price, whole: x.whole || x.price, cost: 0, min: x.kind === 'kit' ? (x.min || 0) : 0, status: 'Đang bán', minPrice: Math.round(cost * 1.08 / 100) * 100, barcode: '8936' + String(Date.now()).slice(-9) };
  if (x.kind === 'kit') {
    S.products.push(Object.assign(base, { base: 'giỏ', type: 'kit', track: true }));
    S.products[S.products.length - 1].uoms = [{ u: 'giỏ', f: 1 }];
    S.recipes.unshift({ id: 'CT-' + id, kit: id, ver: 1, from: x.from || S.meta.date, comps, packCost: r0(x.packCost || 0), note: x.note || 'Phiên bản đầu' });
    log('Tạo giỏ quà', id, `${x.name} · ${comps.length} thành phần · giá vốn dự kiến ${vnd(cost)}`);
  } else {
    S.products.push(Object.assign(base, { base: 'combo', type: 'combo', track: false, comps }));
    S.products[S.products.length - 1].uoms = [{ u: 'combo', f: 1 }];
    log('Tạo combo ghép khi bán', id, `${x.name} · ${comps.length} thành phần`);
  }
  return id;
}
function newRecipeVersion(recipeId, comps, packCost, note) {
  const old = S.recipes.find(r => r.id === recipeId);
  if (old.inactive) fail('Chỉ tạo phiên bản mới từ công thức đang hiệu lực.');
  comps = validateComps(comps, old.kit);
  if (!note) fail('Ghi lý do thay đổi công thức.');
  const ver = Math.max(...S.recipes.filter(r => r.kit === old.kit).map(r => r.ver)) + 1;
  old.inactive = true; old.to = addDays(S.meta.date, -1); old.note = (old.note || '') + ' · hết hiệu lực khi có v' + ver;
  const id = 'CT-' + old.kit + '-V' + ver;
  S.recipes.unshift({ id, kit: old.kit, ver, from: S.meta.date, comps, packCost: r0(packCost || 0), note });
  S.asm.filter(a => a.recipe === recipeId && a.status === 'Nháp').forEach(a => a.recipe = id);
  log('Tạo phiên bản công thức', id, `${prod(old.kit).name} v${ver} · ${note}`);
  return id;
}
function updateCombo(id, comps, price) {
  const p = prod(id); p.comps = validateComps(comps, id); if (price > 0) p.price = price;
  p.minPrice = Math.round(compCost(p.comps) * 1.08 / 100) * 100;
  log('Cập nhật combo', id, 'Áp dụng cho giao dịch mới; giao dịch cũ giữ nguyên thành phần đã xuất');
}
const activeRecipe = kit => S.recipes.find(r => r.kit === kit && !r.inactive);

/* ---------- giao nhận ---------- */
function createTrip(driver, dlvIds) {
  if (!dlvIds.length) fail('Chọn ít nhất một phiếu giao.');
  const id = nextNo('CH');
  dlvIds.forEach(d => { const x = S.dlv.find(z => z.id === d); x.trip = id; x.driver = driver; });
  S.trips.unshift({ id, date: S.meta.date, driver, dlvs: dlvIds, status: 'Đang chạy' });
  log('Tạo chuyến giao', id, `${S.users.find(u => u.id === driver).name} · ${dlvIds.length} điểm`);
  return id;
}
function settleCollector(collector, received, fee, fundId) {
  const list = S.obl.filter(o => o.kind === 'COLL' && o.party === collector && oblRem(o) > 0).sort((a, b) => a.date.localeCompare(b.date));
  const open = sum(list, oblRem);
  received = r0(received); fee = r0(fee || 0);
  if (received + fee <= 0) fail('Nhập số tiền nhận.');
  if (received + fee > open + 0.5) fail(`Tiền nhận + phí ${vnd(received + fee)} vượt khoản đang thu hộ ${vnd(open)}.`);
  const id = nextNo('DS-COD');
  let rem = received + fee;
  list.forEach(o => { const t = Math.min(rem, oblRem(o)); if (t > 0) { settle(o, id, t, 'Đối soát thu hộ'); rem -= t; } });
  cashEntry(fundId, received, id, collector === 'VC01' ? 'Nhận tiền COD' : 'Bàn giao tiền thu hộ', { note: collectorName(collector) });
  if (fee) S.exp.unshift({ id: id + '-PHI', date: S.meta.date, cat: 'Phí thu hộ COD', amount: fee, paid: true, fund: null, note: collectorName(collector) + ' trừ phí khi chuyển tiền', camp: activeCamp(), branch: 'CN1', inCash: false });
  S.calls.unshift({ id, collector, date: S.meta.date, received, fee, fund: fundId });
  log(collector === 'VC01' ? 'Đối soát COD' : 'Bàn giao tiền thu hộ', id, `${collectorName(collector)} · nhận ${vnd(received)}${fee ? ' · phí ' + vnd(fee) : ''}`);
}

/* ---------- tiền ---------- */
function fundTransfer(from, to, amt, note) {
  amt = r0(amt); if (!(amt > 0)) fail('Số tiền phải lớn hơn 0.'); if (from === to) fail('Quỹ nguồn và quỹ đích phải khác nhau.');
  if (fundBal(from) < amt) fail('Số dư quỹ nguồn không đủ.');
  const id = nextNo('CT');
  cashEntry(from, -amt, id, 'Chuyển quỹ', { note }); cashEntry(to, amt, id, 'Chuyển quỹ', { note });
  log('Chuyển quỹ', id, `${fund(from).name} → ${fund(to).name} · ${vnd(amt)}`);
}
function openShift(fundId, wh, openCash) {
  if (S.shifts.some(s => s.status === 'Đang mở' && s.fund === fundId)) fail('Quỹ này đang có ca mở.');
  const id = nextNo('CA');
  S.shifts.unshift({ id, fund: fundId, wh, user: me().name, open: S.meta.date + ' ' + nowTime(), openCash: r0(openCash), status: 'Đang mở' });
  log('Mở ca', id, `${fund(fundId).name} · tiền đầu ca ${vnd(openCash)}`); return id;
}
const shiftExpected = s => s.openCash + sum(S.cash.filter(c => c.shift === s.id), c => c.amt);
function closeShift(id, counted, note) {
  const s = S.shifts.find(x => x.id === id);
  if (s.status !== 'Đang mở') fail('Ca đã khóa.');
  const exp = shiftExpected(s); const diff = r0(counted) - exp;
  if (diff !== 0 && !note) fail('Có chênh lệch, cần ghi chú nguyên nhân.');
  if (diff !== 0) cashEntry(s.fund, diff, id, 'Chênh lệch ca', { note });
  s.status = 'Đã khóa'; s.close = S.meta.date + ' ' + nowTime(); s.expected = exp; s.counted = r0(counted); s.diff = diff; s.note = note || '';
  log('Kết ca', id, `Kỳ vọng ${vnd(exp)} · thực đếm ${vnd(counted)} · lệch ${vnd(diff)}`);
}
function postExpense(x) {
  if (!(x.amount > 0)) fail('Số tiền phải lớn hơn 0.'); if (!x.cat) fail('Chọn nhóm chi phí.');
  const id = nextNo('CP');
  const e = { id, date: S.meta.date, cat: x.cat, amount: r0(x.amount), paid: !!x.paid, fund: x.paid ? x.fund : null, note: x.note || '', camp: x.camp || null, branch: x.branch || 'CN1', inCash: !!x.paid };
  if (x.paid) cashEntry(x.fund, -e.amount, id, 'Chi phí: ' + x.cat, { note: x.note, camp: x.camp });
  S.exp.unshift(e);
  log('Ghi nhận chi phí', id, `${x.cat} · ${vnd(e.amount)} · ${x.paid ? 'đã trả' : 'chưa trả'}`);
}
function payExpense(id, fundId) {
  const e = S.exp.find(x => x.id === id); if (e.paid) fail('Chi phí đã thanh toán.');
  cashEntry(fundId, -e.amount, id + '-TT', 'Trả chi phí đã ghi nhận', { note: e.cat });
  e.paid = true; e.fund = fundId; e.inCash = true; log('Thanh toán chi phí', id, `${vnd(e.amount)} · không ghi chi phí lần hai`);
}

/* ---------- công nợ khác ---------- */
function writeOff(oblId, amt, reason) {
  const o = obl(oblId); if (!reason) fail('Cần lý do.'); if (!(amt > 0) || amt > oblRem(o)) fail('Số tiền không hợp lệ.');
  requestApproval('Xóa nợ / giảm nợ', oblId, `${party(o.party).name} · ${vnd(amt)} · ${reason}`, amt, { oblId, amt, reason });
}
function doWriteOff(p) { settle(obl(p.oblId), 'XN-' + p.oblId, p.amt, 'Xóa nợ (duyệt)'); log('Xóa nợ', p.oblId, `${vnd(p.amt)} · ${p.reason}`); }
function makeStatement(pid, from, to) {
  const rows = [];
  const os = S.obl.filter(o => o.kind === 'AR' && o.party === pid);
  const opening = sum(os.filter(o => o.date < from), o => o.amount) - sum(os, o => sum(o.set.filter(s => s.date < from), s => s.amt));
  os.filter(o => o.date >= from && o.date <= to).forEach(o => rows.push({ date: o.date, doc: o.doc, text: o.doc.startsWith('DK') ? 'Nợ đầu kỳ' : (o.so ? 'Giao hàng theo ' + o.so : 'Bán hàng'), debit: o.amount, credit: 0 }));
  os.forEach(o => o.set.filter(s => s.date >= from && s.date <= to).forEach(s => rows.push({ date: s.date, doc: s.src, text: s.type + ' → ' + o.doc, debit: 0, credit: s.amt })));
  rows.sort((a, b) => a.date.localeCompare(b.date) || b.debit - a.debit);
  const closing = opening + sum(rows, r => r.debit - r.credit);
  const adv = advanceOf(pid, 'in');
  const id = nextNo('DS');
  const st = { id, party: pid, from, to, opening, rows, closing, adv, version: 1, status: 'Nháp', created: S.meta.date, history: [{ v: 1, at: S.meta.date, by: me().name, status: 'Nháp' }] };
  S.stm.unshift(st); log('Lập bảng kê đối soát', id, `${party(pid).name} · ${from} → ${to} · cuối kỳ ${vnd(closing)}`);
  return st;
}
function stmStatus(id, status, note) {
  const s = S.stm.find(x => x.id === id);
  s.status = status; s.history.push({ v: s.version, at: S.meta.date, by: me().name, status, note: note || '' });
  log('Đối soát: ' + status, id, note || '');
}

/* ---------- duyệt ---------- */
function requestApproval(type, doc, detail, amount, payload) {
  const id = nextNo('YD');
  S.appr.unshift({ id, type, doc, detail, amount, status: 'Chờ duyệt', creator: me().name, at: S.meta.date, payload: payload || null });
}
function decide(id, ok, note) {
  const a = S.appr.find(x => x.id === id);
  if (a.status !== 'Chờ duyệt') fail('Yêu cầu đã được xử lý.');
  if (!can('approve')) fail('Vai trò hiện tại không có quyền duyệt.');
  if (a.creator === me().name && a.type !== 'Chênh lệch kiểm kê') fail('Người tạo không được tự duyệt (tách nhiệm vụ). Chuyển sang vai trò Chủ cửa hàng hoặc Quản lý khác để duyệt.');
  a.status = ok ? 'Đã duyệt' : 'Từ chối'; a.by = me().name; a.note = note || ''; a.decidedAt = S.meta.date;
  log(ok ? 'Duyệt' : 'Từ chối', a.doc, `${a.type}${note ? ' · ' + note : ''}`);
  const others = S.appr.filter(x => x.doc === a.doc && x.status === 'Chờ duyệt');
  if (a.doc.startsWith('SO')) {
    const o = S.so.find(x => x.id === a.doc);
    if (!ok) { o.status = 'Nháp'; others.forEach(x => { x.status = 'Từ chối'; x.note = 'Theo quyết định ' + a.id; }); }
    else if (!others.length) confirmSO(o.id, { approved: true });
  } else if (a.doc.startsWith('PO')) {
    const p = S.po.find(x => x.id === a.doc); p.status = ok ? 'Đã duyệt' : 'Nháp';
  } else if (a.doc.startsWith('KK')) {
    const c = S.counts.find(x => x.id === a.doc); if (ok) postCount(c.id); else c.status = 'Đang đếm';
  } else if (a.type === 'Xóa nợ / giảm nợ' && ok) doWriteOff(a.payload);
}

/* ---------- chiến dịch & phân quyền ---------- */

confirmSO = function (id, o2 = {}) {
  const o = S.so.find(x => x.id === id);
  if (!['Nháp', 'Chờ duyệt'].includes(o.status)) fail('Hóa đơn không ở trạng thái có thể xác nhận.');

  if (iss.length) { o.overrides = iss; log('Xác nhận ngoại lệ', o.id, iss.map(i => i.type + ': ' + i.detail).join('; ')); }

function post(btnEl, fn, okMsg, after) {

  const label = btnEl ? btnEl.innerHTML : '';
  if (btnEl) { btnEl.disabled = true; btnEl.innerHTML = 'Đang ghi sổ…'; }
  setTimeout(() => {
    const snap = JSON.stringify(S);
    try {
      const r = fn();
      save();
      if (after !== false) closeModal();
      render();
      if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
      if (typeof after === 'function') after(r);

      S = JSON.parse(snap);

      acc += r[s.k];
    });

    const tip = `<b>${fd(r.x)}</b><br>${ser.map(s => esc(s.name) + ': ' + vnd(r[s.k])).join('<br>')}<br>Tổng: ${vnd(sum(ser, s => r[s.k]))}`;
    g += `<rect class="hit" x="${L + bw * i}" y="${T}" width="${bw}" height="${H - T - B}" data-tip="${esc(tip)}"/>`;
  });

function groupedBars(data, ser) {
  const W = 680, H = 240, L = 62, B = 26, T = 12, R = 8;
  const max = Math.max(1, ...data.map(r => Math.max(...ser.map(s => r[s.k]))));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / data.length, gap = 2, w = Math.max(2, Math.min(16, (bw * .7 - gap) / ser.length));
  const every = data.length > 16 ? Math.ceil(data.length / 10) : 1;
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1e6 ? num(v / 1e6) + ' tr' : v ? num(v / 1e3) + ' k' : '0'}</text>`;
  data.forEach((r, i) => {
    const cx = L + bw * i + bw / 2, x0 = cx - (w * ser.length + gap * (ser.length - 1)) / 2;
    ser.forEach((s, j) => {
      const v = r[s.k]; if (!v) return;
      const yy = y(v), h = Math.max(1, y(0) - yy), rr = Math.min(3, h, w / 2), x = x0 + j * (w + gap);
      g += `<path fill="${s.c}" d="M${x},${yy + h}V${yy + rr}Q${x},${yy} ${x + rr},${yy}H${x + w - rr}Q${x + w},${yy} ${x + w},${yy + rr}V${yy + h}Z"/>`;
    });
    if (i % every === 0) g += `<text class="ax" x="${cx}" y="${H - 8}" text-anchor="middle">${esc(r.lab)}</text>`;
    const tip = `<b>${esc(r.lab.length <= 3 ? r.lab + '/' + r.x.slice(0, 4) : fd(r.x))}</b><br>${ser.map(s => esc(s.name) + ': ' + vnd(r[s.k])).join('<br>')}<br>Chênh lệch: ${vnd(r[ser[0].k] - r[ser[1].k])}`;
    g += `<rect class="hit" x="${L + bw * i}" y="${T}" width="${bw}" height="${H - T - B}" data-tip="${esc(tip)}"/>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--gray-300)"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cột thu và chi">${g}</svg><div class="tip" hidden></div></div><div class="legend">${ser.map(s => `<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

function buyOnChange(d, path) {
  const m = path.match(/^lines\.(\d+)\.(pick|sku|uom|base|big|f)$/); if (!m) return;
  const l = d.lines[m[1]];
  if (l.isNew) { if (m[2] === 'base' && l.uom !== l.big) l.uom = l.base; if (m[2] === 'big' && !l.big) l.uom = l.base; return; }
  if (m[2] === 'pick' || m[2] === 'sku') { const s = m[2] === 'sku' ? l.sku : pickSku(l.pick, p => p.type === 'goods' || p.type === 'material'); if (!s) { l.sku = ''; return; } l.sku = s; l.pick = undefined; const p = prod(s); const big = p.uoms.filter(u => u.f > 1).sort((a, b) => b.f - a.f)[0]; l.uom = (big || p.uoms[0]).u; l.sell = p.price; }
  const p = S.products.find(x => x.id === l.sku); if (p) l.priceU = Math.round((lastBuyPrice(l.sku) || p.cost) * uomF(l.sku, l.uom));
}
/* chuyển dòng nhập → dòng chứng từ; tạo hàng mới & áp giá bán (gọi bên trong post để nguyên tử) */
function buyLines(d, src) {
  const out = [];
  d.lines.forEach(l => {
    if (l.isNew) {
      if (!l.name && !(l.qtyU > 0)) return;
      if (!(l.priceU > 0)) fail(`${l.name || 'Hàng mới'}: nhập giá nhập.`);
      const id = createQuickProduct({ name: l.name, base: l.base, big: l.big, f: l.f, cost: (l.priceU || 0) / (l.uom === l.big ? +l.f : 1), price: l.sell, track: l.track !== false, src });
      l.isNew = false; l.sku = id;
      const f = uomF(id, l.uom);
      out.push({ sku: id, uom: l.uom, f, qty: l.qtyU * f, price: l.priceU / f, lot: l.lot, exp: l.exp, color: l.color || null, spec: l.spec || '' });
    } else if (l.sku && l.qtyU > 0) {
      const f = uomF(l.sku, l.uom);
      if (l.sell && l.sell !== prod(l.sku).price) setPrice(l.sku, l.sell, Math.min(prod(l.sku).whole, l.sell), src);
      out.push({ sku: l.sku, uom: l.uom, f, qty: l.qtyU * f, price: l.priceU / f, lot: l.lot, exp: l.exp, color: l.color || null, spec: l.spec || '' });
    }
  });
  return out;
}

/* ================= KHO → TỒN THEO MÀU ================= */
function colorStock(sku, wh) { const m = {}; lotsOf(sku, wh).forEach(l => { const k = l.color || ''; m[k] = (m[k] || 0) + l.qty; }); return m; }
function colorBreak(sku, wh) {
  const m = colorStock(sku, wh); const keys = Object.keys(m).filter(k => k);
  if (!keys.length) return '';
  return `<span class="sub">${COLORS.filter(c => m[c[0]]).map(c => `<span class="sw-chip" style="margin:0 8px 0 0"><i style="background:${c[2]}"></i>${esc(c[1])} ${num(m[c[0]])}</span>`).join('')}${m[''] ? `<span class="sw-chip" style="margin:0"><i style="background:repeating-linear-gradient(45deg,var(--gray-200) 0 2px,var(--surface-0) 2px 4px)"></i>Chưa gán ${num(m[''])}</span>` : ''}</span>`;
}
V['kho.mau'] = () => {
  const whs = whList(); const q = UI.f.cmq, only = (UI.f.cmo || 'co') === 'co', pick = UI.f.cmc || 'all';
  const rows = [];
  S.products.filter(p => p.type !== 'combo' && match(q, p.id, p.name, p.barcode, p.group)).forEach(p => whs.forEach(w => {
    const m = colorStock(p.id, w.id); const tot = sum(Object.values(m));
    if (!tot) return;
    const colored = Object.keys(m).some(k => k);
    if (only && !colored) return;
    if (pick !== 'all' && !m[pick]) return;
    rows.push({ p, w, m, tot });
  }));
  const totals = {}; COLORS.forEach(c => { totals[c[0]] = rows.filter(r => r.m[c[0]]).length; });
  const cell = (r, k) => r.m[k] ? `<b style="color:var(--navy-900)">${num(r.m[k])}</b>` : '<span class="no">—</span>';
  return pageHead('Kho', 'Tồn theo màu', 'Số lượng tồn thực của từng mặt hàng chia theo màu đã chọn khi nhập hàng (đơn vị cơ sở). Hàng nhập không chọn màu nằm ở cột “Chưa gán màu”.')
    + `<div class="grid g4" style="margin-bottom:18px">${COLORS.filter(c => totals[c[0]]).map(c => `<button type="button" class="kpi click" data-a="chip" data-id="cmc|${c[0]}"><span class="k"><span class="sw-chip" style="margin:0"><i style="background:${c[2]};width:14px;height:14px"></i>${esc(c[1])}</span></span><span class="v">${totals[c[0]]} mặt hàng</span><span class="s">${rows.filter(r => r.m[c[0]]).slice(0, 2).map(r => esc(r.p.name.split(' ').slice(0, 4).join(' ')) + ': ' + num(r.m[c[0]]) + ' ' + esc(r.p.base)).join(' · ')}${totals[c[0]] > 2 ? ' …' : ''}</span></button>`).join('') || '<p class="hint">Chưa có hàng nào được gán màu khi nhập.</p>'}</div>`
    + `<div class="filters">${search('cmq', 'Tìm hàng…')}${chips('cmc', [['all', 'Mọi màu']].concat(COLORS.map(c => [c[0], c[1]])))}${chips('cmo', [['co', 'Chỉ hàng có màu'], ['tat-ca', 'Tất cả hàng']])}</div>`
    + table([{ h: 'Hàng', f: r => `${esc(r.p.name)}<span class="sub">${esc(r.p.id)} · ${esc(r.p.base)}</span>` }, { h: 'Kho', f: r => esc(r.w.name) }]
      .concat(COLORS.map(c => ({ h: `<span class="sw-chip" style="margin:0"><i style="background:${c[2]}"></i>${esc(c[1])}</span>`, n: 1, f: r => cell(r, c[0]) })))
      .concat([{ h: 'Chưa gán màu', n: 1, f: r => r.m[''] ? num(r.m['']) : '<span class="no">—</span>' }, { h: 'Tổng tồn thực', n: 1, f: r => `<b>${num(r.tot)}</b>` }, { h: '', cls: 'acts', f: r => lnk('Thẻ kho', 'stockCard', r.p.id + '|' + r.w.id) }]),
      rows, { empty: 'Không có hàng phù hợp.' })
    + `<div class="callout" style="margin-top:14px">Màu được ghi theo lô khi nhập. Khi bán, hệ thống trừ đúng màu nếu dòng báo giá/hóa đơn có chọn màu; bán tại quầy (POS) chưa chọn màu nên trừ theo lô hết hạn trước, khi đó số theo màu có thể lệch so với thực tế.</div>`;
};

function agingOf(list, d = S.meta.date) {
  const b = { cur: 0, a30: 0, a60: 0, a90: 0 };
  list.forEach(o => { const r = oblRem(o); if (r <= 0) return; const late = diffDays(d, o.due); if (late <= 0) b.cur += r; else if (late <= 30) b.a30 += r; else if (late <= 60) b.a60 += r; else b.a90 += r; });
  return b;
}
function debtTable(kind) {
