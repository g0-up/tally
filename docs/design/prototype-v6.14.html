  const rows = parties.map(p => { const l = S.obl.filter(o => o.kind === kind && o.party === p.id); return { p, open: sum(l, oblRem), ag: agingOf(l), adv: advanceOf(p.id, kind === 'AR' ? 'in' : 'out') }; }).filter(r => r.open || r.adv || (UI.f.dz === 'all'));
  return { rows, html: table([{ h: kind === 'AR' ? 'Khách hàng' : 'Nhà cung cấp', f: r => `${lnk(esc(r.p.name), 'openParty', r.p.id + '|' + kind)}<span class="sub">${esc(r.p.group)}${kind === 'AR' && r.p.limit ? ' · hạn mức ' + vnd(r.p.limit) : ''}</span>` }, { h: kind === 'AR' ? 'Khách còn nợ' : 'Cửa hàng còn nợ', n: 1, f: r => `<b>${money(r.open)}</b>` }, { h: 'Trong hạn', n: 1, f: r => money(r.ag.cur) }, { h: 'Quá 1–30', n: 1, f: r => money(r.ag.a30) }, { h: 'Quá 31–60', n: 1, f: r => money(r.ag.a60) }, { h: 'Quá > 60', n: 1, f: r => money(r.ag.a90) }, { h: kind === 'AR' ? 'Tiền khách ứng trước' : 'Cửa hàng ứng trước', n: 1, f: r => money(r.adv) }, { h: '', cls: 'acts', f: r => kind === 'AR' ? btn('Thu tiền', 'receivePay', r.p.id, 'btn-navy btn-sm') + ' ' + btn('Bảng kê', 'newSTM', r.p.id) : btn('Trả tiền', 'payPay', r.p.id, 'btn-navy btn-sm') }], rows, { foot: ['Tổng', { n: 1, v: money(sum(rows, r => r.open)) }, { n: 1, v: money(sum(rows, r => r.ag.cur)) }, { n: 1, v: money(sum(rows, r => r.ag.a30)) }, { n: 1, v: money(sum(rows, r => r.ag.a60)) }, { n: 1, v: money(sum(rows, r => r.ag.a90)) }, { n: 1, v: money(sum(rows, r => r.adv)) }, ''] }) };

function campSummary(id) {
  const c = S.camps.find(x => x.id === id);
  const sd = S.sdoc.filter(s => s.camp === id), rt = S.sret.filter(r => r.camp === id);
  const rev = sum(sd, s => s.revenue) - sum(rt, r => r.amount), cogs = sum(sd, s => s.cogs) - sum(rt, r => r.cogs);
  const exp = sum(S.exp.filter(e => e.camp === id), e => e.amount);
  const open = sum(S.so.filter(o => soOpen(o) && o.camp === id), o => sum(o.lines, l => soLineRemain(o, l) * l.price * (1 - (l.disc || 0) / 100)));
  const ar = sum(S.obl.filter(o => o.kind === 'AR' && sd.some(s => s.id === o.id)), oblRem);
  const pct = c.target ? rev / c.target : 0;
  return `<div class="stack" style="gap:14px"><div><div class="btn-row" style="justify-content:space-between"><span class="hint">Doanh thu thuần / mục tiêu</span><b class="tab-n" style="color:var(--navy-900)">${vnd(rev)} / ${vnd(c.target)}</b></div><div class="meter acc" style="margin-top:6px"><i style="width:${Math.min(100, pct * 100)}%"></i></div><span class="hint">${(pct * 100).toFixed(1)}% sau ${diffDays(S.meta.date, c.from) + 1}/${diffDays(c.to, c.from) + 1} ngày của mùa</span></div>
    ${impact([['Lãi gộp', can('viewCost') ? vnd(rev - cogs) : 'Ẩn theo quyền'], ['Chi phí mùa', vnd(exp) + ' / ngân sách ' + vnd(c.budget)], ['Kết quả quản trị', can('viewCost') ? vnd(rev - cogs - exp) : 'Ẩn theo quyền'], ['Đơn còn phải giao', vnd(open)], ['Khách còn nợ từ đơn mùa', vnd(ar)]])}</div>`;
}

V['bao-cao.doanh-thu'] = () => {

  const m = {};

  rt.forEach(r => r.lines.forEach(l => { const s = S.sdoc.find(x => x.id === r.sdoc); const k = key(l, s); m[k] = m[k] || { k, q: 0, rev: 0, ret: 0 }; m[k].ret += l.qty * l.price; }));

  return nid;
}

function qMix(sku, q) {
  const p = prod(sku), neg = q < 0; let r = Math.abs(q);
  const us = p.uoms.slice().sort((a, b) => b.f - a.f), parts = [];
  us.forEach(u => { if (u.f === 1) return; const n = Math.floor(r / u.f + 1e-9); if (n) { parts.push(`${num(n)} ${u.u}`); r -= n * u.f; } });

}

function returnLines(sd) {
  const out = [];
  const back = (sku, col) => sum(S.sret.filter(r => r.sdoc === sd.id), r => sum(r.lines.filter(z => z.sku === sku && (z.color || null) === (col || null)), z => z.qty));

    if (l.color) { out.push({ sku: l.sku, color: l.color, fixed: true, qty: 0, max: l.qty - back(l.sku, l.color) }); return; }
    const tk = (l.taken || []).filter(t => t.qty > 0);
    const cols = [...new Set(tk.map(t => t.color || null))];
    if (tk.length && cols.length > 1) { cols.forEach(c => out.push({ sku: l.sku, color: c, fixed: true, qty: 0, max: sum(tk.filter(t => (t.color || null) === c), t => t.qty) - back(l.sku, c) })); return; }
    if (tk.length && cols[0]) { out.push({ sku: l.sku, color: cols[0], fixed: true, qty: 0, max: l.qty - back(l.sku, cols[0]) }); return; }
    const colored = S.lots.some(z => z.sku === l.sku && z.color) || S.moves.some(m => m.sku === l.sku && m.color);
    out.push({ sku: l.sku, color: null, fixed: !colored, pickable: colored, qty: 0, max: l.qty - sum(S.sret.filter(r => r.sdoc === sd.id), r => sum(r.lines.filter(z => z.sku === l.sku), z => z.qty)) });

  return out.filter(l => l.max > 0);
}

};
A.onbItem = ctx => openModal({
  title: 'Thêm hàng hóa', sub: 'Thông tin tối thiểu để nhập tồn. Bổ sung mã vạch, bảng giá sau trong Danh mục.',
  draft: { name: '', unit: 'Hộp', price: 0, colors: '', lot: false },
  body: d => `<div class="fg">${F('Tên hàng *', inp('name', d.name, 'text', `maxlength="${ONB_NAME_MAX}" autofocus`))}${F('Đơn vị tính *', inp('unit', d.unit))}${F('Giá bán (₫)', inp('price', d.price || '', 'n'))}${F('Màu (nếu có)', inp('colors', d.colors), 'Cách nhau bằng dấu phẩy, ví dụ: Đỏ, Vàng.')}</div>
    <label class="check" style="margin-top:12px"><input type="checkbox" data-b="lot" ${d.lot ? 'checked' : ''}> Quản lý theo số lô và hạn dùng</label>`,
  submitLabel: 'Thêm hàng hóa',
  submit: (d, b) => post(b, () => {
    const o = onb(), name = String(d.name).trim();
    if (!name) fail('Nhập tên hàng.'); if (name.length > ONB_NAME_MAX) fail(`Tên hàng tối đa ${ONB_NAME_MAX} ký tự.`);
    if (!String(d.unit).trim()) fail('Nhập đơn vị tính.');
    if (o.items.some(x => x.name.toLowerCase() === name.toLowerCase())) fail('Đã có hàng hóa cùng tên.');
    const it = { id: 'HH' + String(o.items.length + 1).padStart(3, '0'), name, unit: String(d.unit).trim(), price: Math.max(0, +d.price || 0), colors: String(d.colors || '').split(',').map(s => s.trim()).filter(Boolean), lot: !!d.lot };
    o.items.push(it);
    if (ctx === 'stock') { const L = o.stock.lines, l = L.find(x => !x.sku) || (L.push(onbLine()), L[L.length - 1]); l.sku = it.id; }
    return it;
  }, it => `Đã thêm <b>${esc(it.name)}</b>.`)
});
A.onbAddLine = () => { onb().stock.lines.push(onbLine()); save(); renderOnb(); const L = onb().stock.lines, el = document.getElementById(obId('stock.lines.' + (L.length - 1) + '.sku')); if (el) el.focus(); };
A.onbDelLine = i => { const o = onb(); o.stock.lines.splice(+i, 1); UI.ob.err = {}; save(); renderOnb(); toast(`Đã xóa dòng ${+i + 1}.`); };
A.onbPostStock = (id, b) => {
  const o = onb(), er = {};
  const L = o.stock.lines.map((l, i) => ({ l, i })).filter(({ l }) => l.sku || String(l.qty).trim() || String(l.cost).trim());
  if (!L.length) return obFail({ 'stock.lines.0.sku': 'Chọn hàng cho ít nhất một dòng.' });
  L.forEach(({ l, i }) => {
    const p = 'stock.lines.' + i + '.', it = obItem(l.sku), q = obNum(l.qty), c = obNum(l.cost);
    if (!it) er[p + 'sku'] = 'Chọn hàng.';
    if (it && it.colors.length && !l.color) er[p + 'color'] = 'Chọn màu.';
    if (!(q > 0)) er[p + 'qty'] = 'Số lượng phải lớn hơn 0.';
    if (!(c >= 0)) er[p + 'cost'] = 'Nhập giá vốn (0 nếu hàng tặng).';
    if (it && it.lot) { if (!String(l.lot).trim()) er[p + 'lot'] = 'Nhập số lô.'; if (!l.exp) er[p + 'exp'] = 'Chọn hạn dùng.'; }
  });
  if (Object.keys(er).length) return obFail(er);
  post(b, () => {
    L.forEach(({ l }) => o.stockPosted.push({ sku: l.sku, color: l.color, qty: obNum(l.qty), cost: obNum(l.cost), lot: String(l.lot).trim(), exp: l.exp }));
    o.stock.lines = [onbLine()]; o.status.opening_stock = 'completed'; UI.ob.err = {};
    return L.length;
  }, n => `Đã ghi <b>${n} dòng</b> tồn kho đầu kỳ. Có thể ghi thêm trước khi khóa sổ.`);
};
A.onbDir = dir => { const o = onb(); if (o.debtForm.dir === dir) return; o.debtForm = Object.assign(onbDebtForm(dir), { amount: o.debtForm.amount, due: o.debtForm.due, note: o.debtForm.note }); UI.ob.err = {}; save(); renderOnb(); };
function obAddParty(kind, name, phone) { const o = onb(), p = { id: (kind === 'AR' ? 'KH' : 'NCC') + String(o.parties.filter(x => x.kind === kind).length + 1).padStart(3, '0'), name, phone, kind }; o.parties.push(p); return p; }
A.onbParty = () => {
  const o = onb(), dir = o.debtForm.dir, w = dir === 'AR' ? 'khách hàng' : 'nhà cung cấp';
  openModal({ title: 'Thêm ' + w, draft: { name: '', phone: '' },
    body: d => `<div class="fg">${F('Tên ' + w + ' *', inp('name', d.name, 'text', `maxlength="${ONB_NAME_MAX}" autofocus`))}${F('Số điện thoại', inp('phone', d.phone, 'tel'))}</div>`,
    submitLabel: 'Thêm ' + w,
    submit: (d, b) => post(b, () => {
      const name = String(d.name).trim(); if (!name) fail('Nhập tên ' + w + '.');
      const p = obAddParty(dir, name, String(d.phone).trim()); o.debtForm.party = p.id; delete UI.ob.err['debtForm.party']; return p;
    }, p => `Đã thêm <b>${esc(p.name)}</b> và chọn cho khoản nợ.`) });
};
A.onbPostDebt = (id, b) => {
  const o = onb(), f = o.debtForm, er = {}, amt = obNum(f.amount);
  if (!obParty(f.party)) er['debtForm.party'] = f.dir === 'AR' ? 'Chọn khách hàng.' : 'Chọn nhà cung cấp.';
  if (!(amt > 0)) er['debtForm.amount'] = 'Số tiền nợ phải lớn hơn 0.';
  if (Object.keys(er).length) return obFail(er);
  post(b, () => {
    o.debts.push({ dir: f.dir, party: f.party, amount: amt, reason: String(f.reason).trim() || 'Số dư đầu kỳ', due: f.due, note: String(f.note).trim() });
    o.debtForm = onbDebtForm(f.dir); o.status.opening_debt = 'completed'; UI.ob.err = {};
  }, `Đã ghi công nợ đầu kỳ <b>${vnd(amt)}</b>. Ghi tiếp khoản khác hoặc sang bước sau.`);
};
A.onbSaveCash = (id, b) => {
  const o = onb(), er = {};
  o.funds.forEach((x, i) => { const s = String(x.val).trim(), n = obNum(s); if (s && !(n >= 0)) er['funds.' + i + '.val'] = 'Nhập số tiền từ 0 trở lên.'; });
  if (Object.keys(er).length) return obFail(er);
  post(b, () => { o.funds.forEach(x => { x.bal = obNum(x.val) || 0; }); o.status.opening_cash = 'completed'; UI.ob.err = {}; },
    `Đã lưu số dư ${o.funds.length} quỹ.`, () => onbGoTo('confirm_opening_balances'));
};
A.onbConfirm = () => {
  const o = onb(); if (!o.agree || obBlockers(o).length) return;
  openModal({ title: 'Nhập lại mật khẩu để khóa sổ', sub: `Xác nhận số dư đầu kỳ đến hết ngày ${fd(o.profile.cutoff)}. Không hoàn tác được.`, draft: { pw: '' },
    body: d => F('Mật khẩu', inp('pw', '', 'password', 'autocomplete="current-password" autofocus'), 'Bản mẫu chấp nhận mật khẩu bất kỳ.'),
    submitLabel: 'Khóa sổ và xác nhận',
    submit: (d, b) => post(b, () => {
      if (!d.pw) fail('Nhập mật khẩu.');
      Object.assign(o, { confirmed: true, confirmedAt: fd(TODAY) + ' ' + new Date().toTimeString().slice(0, 5) });
      o.status.confirm_opening_balances = 'completed'; o.step = 'first_sale';
    }, 'Đã khóa số dư đầu kỳ. POS đã mở.', () => onbGoTo('first_sale')) });
};
A.onbEnter = () => { go('tong-quan', 'dashboard'); toast('Bản mẫu: màn chính đang dùng dữ liệu của cửa hàng mẫu.'); };
A.onbLogout = () => { go('tong-quan', 'dashboard'); toast('Bản mẫu: Đăng xuất sẽ về màn đăng nhập. Tiến độ thiết lập vẫn được giữ.'); };
A.onbExit = () => go('thiet-lap', 'khoi-tao');
A.onbReset = () => openModal({ title: 'Đặt lại onboarding?', sub: 'Xóa toàn bộ dữ liệu thiết lập của cửa hàng mới trong bản mẫu. Cửa hàng mẫu không bị ảnh hưởng.', body: () => '<div class="callout warn">Các bước sẽ về trạng thái chưa làm.</div>', submitLabel: 'Đặt lại',
  submit: (d, b) => post(b, () => { S.onb = onbSeed(); UI.ob = { err: {}, rail: false }; }, 'Đã đặt lại onboarding.', () => onbGoTo('store_profile')) });
A.onbSample = () => {
  const o = onb(), k = o.step;
  const items = () => { if (o.items.length) return; o.items.push({ id: 'HH001', name: 'Hộp quà Tết An Khang', unit: 'Hộp', price: 450000, colors: ['Đỏ', 'Vàng'], lot: false }, { id: 'HH002', name: 'Mứt dừa non 500g', unit: 'Hộp', price: 85000, colors: [], lot: true }, { id: 'HH003', name: 'Hạt điều rang muối 500g', unit: 'Hũ', price: 180000, colors: [], lot: true }); };
  if (k === 'store_profile') Object.assign(o.pf, { legal: 'Công ty TNHH Bánh kẹo Hòa Phát', display: 'Bánh kẹo Tết Hòa Phát', tax: '0312345678', phone: '0909 123 456', addr: '125 Hải Thượng Lãn Ông, Phường 10, Quận 5, TP.HCM' }, o.confirmed ? {} : { cutoff: '2026-09-30' });
  else if (k === 'catalog_setup') items();
  else if (obLock(o, k) && k !== 'first_sale') return toast('Bước này đang khóa: ' + esc(obLock(o, k)) + '.', 'err');
  else if (k === 'opening_stock') { items(); o.stock.lines = [{ sku: 'HH001', color: 'Đỏ', qty: '120', cost: '310000', lot: '', exp: '' }, { sku: 'HH001', color: 'Vàng', qty: '80', cost: '310000', lot: '', exp: '' }, { sku: 'HH002', color: '', qty: '300', cost: '52000', lot: 'MD-0925', exp: '2027-03-31' }]; }
  else if (k === 'opening_debt') { const dir = o.debtForm.dir, isAR = dir === 'AR', p = o.parties.find(x => x.kind === dir) || (isAR ? obAddParty(dir, 'Đại lý Minh Châu', '0918 222 333') : obAddParty(dir, 'Công ty CP Thực phẩm Sài Gòn', '028 3812 4567')); o.debtForm = Object.assign(onbDebtForm(dir), { party: p.id, amount: isAR ? '18500000' : '42000000', due: '2026-10-31' }); }
  else if (k === 'opening_cash') { o.funds[0].val = '15000000'; o.funds[1].val = '82500000'; }
  else if (k === 'confirm_opening_balances') o.agree = true;
  else if (k === 'first_sale') { if (!o.confirmed) return toast('Bước này mở sau khi xác nhận số dư.', 'err'); o.status.first_sale = 'completed'; save(); renderOnb(); return toast('Giả lập: POS đã có hóa đơn đầu tiên.'); }
  UI.ob.err = {}; save(); renderOnb(); toast('Đã điền dữ liệu mẫu. Kiểm tra rồi bấm nút chính để lưu.');
};

/* ---------- lối vào trong app: Thiết lập › Khởi tạo cửa hàng ---------- */
V['thiet-lap.khoi-tao'] = () => {
  const o = onb(), reqN = ONB_STEPS.filter(s => s.req).length, reqD = ONB_STEPS.filter(s => s.req && o.status[s.k] === 'completed').length;
  return pageHead('Thiết lập', 'Khởi tạo cửa hàng', 'Màn onboarding cho chủ cửa hàng mới. Ở bản thật, app tự chuyển tới màn này khi còn bước bắt buộc chưa xong; chỉ Danh mục được mở trong lúc đó.', '<a class="btn btn-primary" href="#onboarding">Mở màn onboarding</a>')
    + `<div class="card"><div class="card-h"><h2>Tiến độ cửa hàng mới (bản mẫu)</h2><small>${reqD}/${reqN} bước bắt buộc</small></div>
      ${table([{ h: 'Bước', f: s => `${ONB_STEPS.indexOf(s) + 1}. ${esc(s.label)}` }, { h: 'Loại', f: s => s.req ? '<span class="tag">Bắt buộc</span>' : '<span class="tag alt">Tùy chọn</span>' }, { h: 'Trạng thái', f: s => obStatusChip(o, s) }], ONB_STEPS, { flat: true })}
      <div class="btn-row" style="margin-top:14px">${btn('Đặt lại onboarding', 'onbReset', '', 'btn-line btn-sm')}</div></div>`;
};

/* route #onboarding vẽ ngoài khung app (không sidebar, không thanh tiện ích) */
const renderApp = render;
render = function () {
  const on = location.hash === '#onboarding', was = document.body.classList.contains('is-onb');
  document.body.classList.toggle('is-onb', on);
  if (!on) { $('#onb-root').innerHTML = ''; return renderApp(); }
  renderOnb();
  if (!was) { const m = $('#onb-main'); if (m) m.focus({ preventScroll: true }); }
};

load();
window.addEventListener('hashchange', () => { closeDrawer(); closeModal(); render(); window.scrollTo(0, 0); });
render();

</script>

</body></html>
